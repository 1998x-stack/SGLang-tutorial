<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="t d"><title id="t">Three Mooncake data planes in SGLang</title><desc id="d">PD transfer moves per-request KV from prefill to decode; HiCache L3 stores reusable language KV pages; EPD global cache stores multimodal encoder embeddings.</desc><rect width="1200" height="540" rx="20" fill="#fffdf9"/><text x="40" y="46" font-family="system-ui" font-size="24" font-weight="700" fill="#20363b">Three payload types, three consumers</text><g font-family="system-ui" text-anchor="middle"><rect x="40" y="115" width="350" height="310" rx="16" fill="#fff0e6" stroke="#b75c31" stroke-width="2"/><text x="215" y="155" font-size="21" font-weight="700" fill="#b75c31">PD transfer engine</text><rect x="85" y="190" width="115" height="70" rx="10" fill="#fffdf9" stroke="#b75c31"/><text x="142" y="232" font-size="16" fill="#53646b">Prefill</text><rect x="235" y="190" width="115" height="70" rx="10" fill="#fffdf9" stroke="#147f80"/><text x="292" y="232" font-size="16" fill="#53646b">Decode</text><path d="M200 225H235" stroke="#b75c31" stroke-width="3"/><text x="215" y="310" font-size="17" fill="#20363b" font-weight="700">Payload: request KV / state</text><text x="215" y="345" font-size="15" fill="#53646b">peer bootstrap → RDMA transfer</text><text x="215" y="385" font-size="15" fill="#53646b">one request's handoff</text><rect x="425" y="115" width="350" height="310" rx="16" fill="#eee9f7" stroke="#7059aa" stroke-width="2"/><text x="600" y="155" font-size="21" font-weight="700" fill="#7059aa">HiCache L3 storage</text><rect x="475" y="190" width="250" height="70" rx="10" fill="#fffdf9" stroke="#7059aa"/><text x="600" y="232" font-size="16" fill="#53646b">Mooncake Store</text><text x="600" y="310" font-size="17" fill="#20363b" font-weight="700">Payload: reusable KV pages</text><text x="600" y="345" font-size="15" fill="#53646b">local miss → prefetch → promote</text><text x="600" y="385" font-size="15" fill="#53646b">cross-request / cross-instance reuse</text><rect x="810" y="115" width="350" height="310" rx="16" fill="#e8f1f0" stroke="#147f80" stroke-width="2"/><text x="985" y="155" font-size="21" font-weight="700" fill="#147f80">EPD global MM cache</text><rect x="860" y="190" width="115" height="70" rx="10" fill="#fffdf9" stroke="#147f80"/><text x="917" y="232" font-size="16" fill="#53646b">Encoder</text><rect x="1010" y="190" width="115" height="70" rx="10" fill="#fffdf9" stroke="#7059aa"/><text x="1067" y="232" font-size="16" fill="#53646b">Prefill</text><path d="M975 225H1010" stroke="#147f80" stroke-width="3"/><text x="985" y="310" font-size="17" fill="#20363b" font-weight="700">Payload: ViT embeddings</text><text x="985" y="345" font-size="15" fill="#53646b">image identity → embedding lookup</text><text x="985" y="385" font-size="15" fill="#53646b">avoid repeated vision compute</text></g><text x="42" y="480" font-family="system-ui" font-size="16" fill="#53646b">Shared infrastructure does not imply shared object format, cache key, lifetime, or API.</text></svg>