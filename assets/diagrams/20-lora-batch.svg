<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">Heterogeneous Multi-LoRA batch layout</title><desc id="d">Rows in one batch are tagged with adapter A, adapter B or None. Base model weights are shared while adapter-specific low rank A and B updates are applied to matching rows.</desc><rect width="1200" height="500" rx="20" fill="#fffdf9"/><text x="40" y="45" font-family="system-ui" font-size="24" font-weight="700" fill="#20363b">One batch, shared base weights, adapter-specific low-rank updates</text><g font-family="system-ui" text-anchor="middle"><rect x="50" y="115" width="300" height="275" rx="14" fill="#f0f1ef" stroke="#8b9693" stroke-width="2"/><text x="200" y="155" font-size="20" font-weight="700" fill="#53646b">Batch rows</text><g font-size="17"><rect x="90" y="180" width="220" height="48" rx="8" fill="#eee9f7"/><text x="200" y="211" fill="#7059aa">r0 → adapter A</text><rect x="90" y="240" width="220" height="48" rx="8" fill="#d8efeb"/><text x="200" y="271" fill="#147f80">r1 → adapter B</text><rect x="90" y="300" width="220" height="48" rx="8" fill="#fff0e6"/><text x="200" y="331" fill="#b75c31">r2 → None / base</text></g><rect x="450" y="170" width="300" height="95" rx="12" fill="#e8f1f0" stroke="#147f80" stroke-width="2"/><text x="600" y="210" font-size="20" font-weight="700" fill="#147f80">Shared base weights</text><text x="600" y="240" font-size="16" fill="#53646b">same model parameters</text><rect x="450" y="300" width="300" height="95" rx="12" fill="#eee9f7" stroke="#7059aa" stroke-width="2"/><text x="600" y="340" font-size="20" font-weight="700" fill="#7059aa">Adapter-specific A / B</text><text x="600" y="370" font-size="16" fill="#53646b">grouped low-rank updates</text><rect x="850" y="210" width="300" height="115" rx="12" fill="#fff0e6" stroke="#b75c31" stroke-width="2"/><text x="1000" y="255" font-size="20" font-weight="700" fill="#b75c31">Output rows</text><text x="1000" y="288" font-size="16" fill="#53646b">restore original batch order</text></g><g stroke="#147f80" stroke-width="3" fill="none"><path d="M350 220H450"/><path d="M750 215H850"/><path d="M750 347H850"/></g><text x="600" y="455" font-family="system-ui" font-size="16" fill="#53646b" text-anchor="middle">None is a distinct base-model ID and counts toward max_loras_per_batch.</text></svg>