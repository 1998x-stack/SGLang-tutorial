<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">Early versus prefill complete decode allocation timeline</title><desc id="d">Early policy reserves decode KV slots during bootstrap before prefill completes. Prefill complete policy delays destination allocation until the final prefill completion signal.</desc><rect width="1200" height="500" rx="20" fill="#fffdf9"/><text x="40" y="45" font-family="system-ui" font-size="24" font-weight="700" fill="#20363b">When does Decode reserve its destination KV slots?</text><g font-family="system-ui" font-size="18" fill="#20363b"><text x="55" y="145" font-weight="700">early</text><text x="55" y="325" font-weight="700">prefill_complete</text></g><g stroke="#aab3af" stroke-width="2"><line x1="220" y1="175" x2="1110" y2="175"/><line x1="220" y1="355" x2="1110" y2="355"/></g><g font-family="system-ui" font-size="15" fill="#53646b" text-anchor="middle"><text x="270" y="105">bootstrap</text><text x="590" y="105">prefill compute</text><text x="930" y="105">KV transfer</text><text x="1080" y="105">decode</text><text x="270" y="285">bootstrap</text><text x="590" y="285">prefill compute</text><text x="930" y="285">KV transfer</text><text x="1080" y="285">decode</text></g><g><rect x="220" y="145" width="140" height="60" rx="9" fill="#eee9f7" stroke="#7059aa" stroke-width="2"/><rect x="360" y="145" width="390" height="60" rx="9" fill="#fff0e6" stroke="#b75c31" stroke-width="2"/><rect x="750" y="145" width="220" height="60" rx="9" fill="#d8efeb" stroke="#147f80" stroke-width="2"/><rect x="970" y="145" width="140" height="60" rx="9" fill="#d8efeb" stroke="#147f80" stroke-width="2"/><rect x="220" y="325" width="140" height="60" rx="9" fill="#eee9f7" stroke="#7059aa" stroke-width="2"/><rect x="360" y="325" width="390" height="60" rx="9" fill="#fff0e6" stroke="#b75c31" stroke-width="2"/><rect x="750" y="325" width="220" height="60" rx="9" fill="#d8efeb" stroke="#147f80" stroke-width="2"/><rect x="970" y="325" width="140" height="60" rx="9" fill="#d8efeb" stroke="#147f80" stroke-width="2"/><g font-family="system-ui" font-size="15" text-anchor="middle"><text x="290" y="181" fill="#7059aa" font-weight="700">reserve now</text><text x="555" y="181" fill="#b75c31" font-weight="700">prefill; slot already held</text><text x="860" y="181" fill="#147f80" font-weight="700">transfer</text><text x="1040" y="181" fill="#147f80" font-weight="700">decode</text><text x="290" y="361" fill="#7059aa" font-weight="700">handshake</text><text x="555" y="361" fill="#b75c31" font-weight="700">prefill; no dest slot yet</text><text x="860" y="361" fill="#147f80" font-weight="700">reserve + transfer</text><text x="1040" y="361" fill="#147f80" font-weight="700">decode</text></g></g><text x="45" y="445" font-family="system-ui" font-size="16" fill="#53646b">prefill_complete reduces early Decode slot occupancy but keeps Prefill KV longer and changes overlap opportunities.</text></svg>