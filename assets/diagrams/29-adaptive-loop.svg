<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="g29a-title g29a-desc"><title id="g29a-title">Adaptive speculative control loop</title><desc id="g29a-desc">Batch size selects a per-batch policy slot; draft verification feedback updates EMA and selects a prebuilt runtime state.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#527b79"/></marker></defs><rect width="1080" height="560" rx="18" fill="#fbfdfc"/><path d="M 180 270 L 225 270" stroke="#527b79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 395 270 L 440 270" stroke="#527b79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 595 270 L 640 270" stroke="#527b79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 795 270 L 840 270" stroke="#527b79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 935 330 L 935 440" stroke="#477d78" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="935" y="376" text-anchor="middle" font-size="14" fill="#52666a">feedback</text><path d="M 935 440 L 310 440" stroke="#477d78" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="622.5" y="431" text-anchor="middle" font-size="14" fill="#52666a">update slot</text><path d="M 310 440 L 310 330" stroke="#527b79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g><rect x="25" y="210" width="155" height="120" rx="15" fill="#edf5f3" stroke="#477d78" stroke-width="2"/><text x="102.5" y="241" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">Batch size</text><text x="102.5" y="266" text-anchor="middle" font-size="15" fill="#35585a">Route to slot</text></g><g><rect x="225" y="210" width="170" height="120" rx="15" fill="#f3f0fb" stroke="#7564a0" stroke-width="2"/><text x="310" y="241" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">Adaptive slot</text><text x="310" y="266" text-anchor="middle" font-size="15" fill="#35585a">Candidate steps</text></g><g><rect x="440" y="210" width="155" height="120" rx="15" fill="#f3f0fb" stroke="#7564a0" stroke-width="2"/><text x="517.5" y="241" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">Activate state</text><text x="517.5" y="266" text-anchor="middle" font-size="15" fill="#35585a">Prebuilt graph</text></g><g><rect x="640" y="210" width="155" height="120" rx="15" fill="#fff3e9" stroke="#c98246" stroke-width="2"/><text x="717.5" y="241" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">Draft / Verify</text><text x="717.5" y="266" text-anchor="middle" font-size="15" fill="#35585a">Accepted lengths</text></g><g><rect x="840" y="210" width="190" height="120" rx="15" fill="#eaf4f1" stroke="#477d78" stroke-width="2"/><text x="935" y="241" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">EMA + hysteresis</text><text x="935" y="266" text-anchor="middle" font-size="15" fill="#35585a">Next tier decision</text></g></svg>