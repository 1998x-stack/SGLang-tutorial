<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="g27b-title g27b-desc"><title id="g27b-title">Streaming parser state machine</title><desc id="g27b-desc">Parser buffers partial start markers and incomplete JSON until a complete tool call can be emitted.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#527b79"/></marker></defs><rect width="1080" height="560" rx="18" fill="#fbfdfc"/><path d="M 210 267 L 285 122" stroke="#527b79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 210 267 L 285 407" stroke="#527b79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 475 122 L 560 245" stroke="#527b79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 475 407 L 560 290" stroke="#527b79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 750 267 L 840 267" stroke="#527b79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g><rect x="35" y="210" width="175" height="115" rx="15" fill="#edf5f3" stroke="#477d78" stroke-width="2"/><text x="122.5" y="241" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">Idle</text><text x="122.5" y="266" text-anchor="middle" font-size="15" fill="#35585a">Normal text</text></g><g><rect x="285" y="65" width="190" height="115" rx="15" fill="#f3f0fb" stroke="#7564a0" stroke-width="2"/><text x="380" y="96" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">Partial marker</text><text x="380" y="121" text-anchor="middle" font-size="15" fill="#35585a">Keep suffix</text></g><g><rect x="285" y="350" width="190" height="115" rx="15" fill="#fff3e9" stroke="#c98246" stroke-width="2"/><text x="380" y="381" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">Inside call</text><text x="380" y="406" text-anchor="middle" font-size="15" fill="#35585a">Buffer JSON</text></g><g><rect x="560" y="210" width="190" height="115" rx="15" fill="#eaf4f1" stroke="#477d78" stroke-width="2"/><text x="655" y="241" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">Parse complete</text><text x="655" y="266" text-anchor="middle" font-size="15" fill="#35585a">Validate shape</text></g><g><rect x="840" y="210" width="190" height="115" rx="15" fill="#eaf4f1" stroke="#477d78" stroke-width="2"/><text x="935" y="241" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">Emit delta</text><text x="935" y="266" text-anchor="middle" font-size="15" fill="#35585a">ToolCallItem</text></g></svg>