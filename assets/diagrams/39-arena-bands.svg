<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" role="img"><title>一个 Arena 中的三条 Band</title><desc>state 从低端向上，full 从高端向下，window float 居中；空白是共享余量。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="700" height="360" rx="10" fill="#faf9f5"/><g font-family="system-ui,sans-serif" fill="#243243"><text x="350" y="29" font-size="19" text-anchor="middle" font-weight="700">一个 Arena 中的三条 Band</text><path d="M165 120V180H125V218" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M357 120V180H272V218" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M570 120V218" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><rect x="30" y="70" width="50" height="50" rx="5" fill="#eef1f4" stroke="#65758a"/><text x="55" y="100" font-size="16" text-anchor="middle">sink</text><rect x="80" y="70" width="170" height="50" rx="5" fill="#eee8fa" stroke="#7858ae"/><text x="165" y="100" font-size="16" text-anchor="middle">state  →</text><rect x="285" y="70" width="145" height="50" rx="5" fill="#fff0dc" stroke="#b36b23"/><text x="357.5" y="100" font-size="16" text-anchor="middle">window float</text><rect x="470" y="70" width="200" height="50" rx="5" fill="#eee8fa" stroke="#7858ae"/><text x="570" y="100" font-size="16" text-anchor="middle">← full KV</text><rect x="30" y="218" width="50" height="50" rx="5" fill="#eef1f4" stroke="#65758a"/><text x="55" y="248" font-size="16" text-anchor="middle">sink</text><rect x="80" y="218" width="90" height="50" rx="5" fill="#eee8fa" stroke="#7858ae"/><text x="125" y="248" font-size="16" text-anchor="middle">state</text><rect x="210" y="218" width="125" height="50" rx="5" fill="#fff0dc" stroke="#b36b23"/><text x="272.5" y="248" font-size="16" text-anchor="middle">window</text><rect x="350" y="218" width="320" height="50" rx="5" fill="#eee8fa" stroke="#7858ae"/><text x="510" y="248" font-size="16" text-anchor="middle">full KV 扩大</text><text x="350" y="52" text-anchor="middle" font-size="15">同一 device arena：起始布局</text><text x="350" y="201" text-anchor="middle" font-size="15">长请求增多后：full band 扩容</text><text x="350" y="312" text-anchor="middle" font-size="15">低端向上 · 中间 float · 高端向下</text></g></svg>