<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="t d"><title id="t">EAGLE Draft Worker 提议候选树，Target Worker 批量验证</title><desc id="d">Draft worker uses target state to propose a tree with parent-child candidate topology. Target verification uses a tree mask to score candidate paths; one accepted path is committed, while alternative branches are not all emitted.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#627c7c"/></marker></defs><rect width="1000" height="500" rx="17" fill="#fbfdfc"/><text x="500" y="40" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#203b40">Draft 负责提出候选拓扑；Target 负责验证并提交可接受路径</text><rect x="25" y="85" width="170" height="80" rx="12" fill="#f0f3f2" stroke="#81918f" stroke-width="2"/><text x="110" y="115" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Target state</text><text x="110" y="141" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">features + KV</text><rect x="250" y="85" width="185" height="80" rx="12" fill="#fff0e4" stroke="#bd6738" stroke-width="2"/><text x="342.5" y="115" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Draft worker</text><text x="342.5" y="141" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">propose tokens</text><rect x="250" y="225" width="130" height="70" rx="12" fill="#f0f3f2" stroke="#81918f" stroke-width="2"/><text x="315" y="255" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">root</text><text x="315" y="281" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">current prefix</text><rect x="470" y="130" width="125" height="70" rx="12" fill="#eee9f8" stroke="#7258a8" stroke-width="2"/><text x="532.5" y="160" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">a</text><text x="532.5" y="186" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">candidate · q₁</text><rect x="470" y="305" width="125" height="70" rx="12" fill="#eee9f8" stroke="#7258a8" stroke-width="2"/><text x="532.5" y="335" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">b</text><text x="532.5" y="361" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">candidate · q₂</text><rect x="665" y="75" width="120" height="65" rx="12" fill="#e2f4f0" stroke="#147f80" stroke-width="2"/><text x="725" y="105" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">c</text><text x="725" y="131" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">child of a</text><rect x="665" y="180" width="120" height="65" rx="12" fill="#f0f3f2" stroke="#81918f" stroke-width="2"/><text x="725" y="210" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">d</text><text x="725" y="236" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">child of a</text><rect x="665" y="280" width="120" height="65" rx="12" fill="#f0f3f2" stroke="#81918f" stroke-width="2"/><text x="725" y="310" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">e</text><text x="725" y="336" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">child of b</text><rect x="665" y="385" width="120" height="65" rx="12" fill="#f0f3f2" stroke="#81918f" stroke-width="2"/><text x="725" y="415" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">f</text><text x="725" y="441" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">child of b</text><rect x="850" y="195" width="130" height="90" rx="12" fill="#e2f4f0" stroke="#147f80" stroke-width="2"/><text x="915" y="225" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Target verify</text><text x="915" y="251" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">tree mask</text><path d="M195 125 L245 125" fill="none" stroke="#81918f" stroke-width="2.7"  marker-end="url(#a)"/><path d="M345 165 L315 218" fill="none" stroke="#bd6738" stroke-width="2.7"  marker-end="url(#a)"/><path d="M380 255 L465 165" fill="none" stroke="#147f80" stroke-width="4"  marker-end="url(#a)"/><path d="M380 265 L465 340" fill="none" stroke="#81918f" stroke-width="2.7"  marker-end="url(#a)"/><path d="M595 165 L660 110" fill="none" stroke="#147f80" stroke-width="4"  marker-end="url(#a)"/><path d="M595 165 L660 212" fill="none" stroke="#81918f" stroke-width="2.7"  marker-end="url(#a)"/><path d="M595 340 L660 312" fill="none" stroke="#81918f" stroke-width="2.7"  marker-end="url(#a)"/><path d="M595 340 L660 417" fill="none" stroke="#81918f" stroke-width="2.7"  marker-end="url(#a)"/><path d="M785 110 L845 220" fill="none" stroke="#147f80" stroke-width="2.7"  marker-end="url(#a)"/><path d="M785 212 L845 240" fill="none" stroke="#81918f" stroke-width="2.7" stroke-dasharray="7 5" marker-end="url(#a)"/><path d="M785 312 L845 250" fill="none" stroke="#81918f" stroke-width="2.7" stroke-dasharray="7 5" marker-end="url(#a)"/><path d="M785 417 L845 260" fill="none" stroke="#81918f" stroke-width="2.7" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="500" y="475" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#627274">粗绿色路径示意被接受的 parent chain；其他分支仅用于并行验证，不会全部输出</text></svg>