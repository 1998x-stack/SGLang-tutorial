<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 465" role="img" aria-labelledby="title desc"><title id="title">EAGLE Draft Worker 提议候选树，Target Worker 批量验证</title><desc id="desc">Draft worker 依据 target 提供的状态与草稿模型逐步提出 token 候选，并构造 parent topology；target 在 tree mask 约束下并行评估候选，再确定可接受路径。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#627c7c"/></marker></defs><rect width="1000" height="465" rx="17" fill="#fbfdfc"/><text x="500" y="40" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#203b40">Speculation 用便宜的候选计算换取更少的串行 target steps</text><rect x="35" y="100" width="190" height="85" rx="13" fill="#f0f3f2" stroke="#81918f" stroke-width="2"/><text x="130" y="130" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Target state</text><text x="130" y="157" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">hidden features + KV</text><rect x="290" y="90" width="205" height="105" rx="13" fill="#fff0e4" stroke="#bd6738" stroke-width="2"/><text x="392.5" y="120" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Draft worker</text><text x="392.5" y="147" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">tokens + parent list</text><rect x="575" y="80" width="190" height="125" rx="13" fill="#eee9f8" stroke="#7258a8" stroke-width="2"/><text x="670" y="110" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Draft tree</text><text x="670" y="137" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">a → c / a → d / b → e</text><rect x="825" y="95" width="145" height="95" rx="13" fill="#e2f4f0" stroke="#147f80" stroke-width="2"/><text x="897.5" y="125" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Target verify</text><text x="897.5" y="152" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">tree mask</text><path d="M225 142 L285 142" fill="none" stroke="#81918f" stroke-width="2.7"  marker-end="url(#arrow)"/><path d="M495 142 L570 142" fill="none" stroke="#bd6738" stroke-width="2.7"  marker-end="url(#arrow)"/><path d="M765 142 L820 142" fill="none" stroke="#7258a8" stroke-width="2.7"  marker-end="url(#arrow)"/><rect x="320" y="280" width="360" height="82" rx="13" fill="#e2f4f0" stroke="#147f80" stroke-width="2"/><text x="500" y="310" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Longest accepted path</text><text x="500" y="337" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">commit accepted tokens / KV</text><rect x="755" y="280" width="200" height="82" rx="13" fill="#fff0e4" stroke="#bd6738" stroke-width="2"/><text x="855" y="310" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Next round</text><text x="855" y="337" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">continue generation</text><path d="M895 190 L895 275" fill="none" stroke="#147f80" stroke-width="2.7"  marker-end="url(#arrow)"/><path d="M680 320 L750 320" fill="none" stroke="#147f80" stroke-width="2.7"  marker-end="url(#arrow)"/><text x="500" y="420" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#627274">EAGLE-2：上下文感知动态树；EAGLE-3：多层特征融合与直接 token 预测</text></svg>