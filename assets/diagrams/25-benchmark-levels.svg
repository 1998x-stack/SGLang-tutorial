<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc"><title id="title">SGLang 四种 benchmark 工具观察不同层级，不能互相替代</title><desc id="desc">bench_serving measures realistic online serving; one_batch_server includes HTTP and scheduler but not steady state; offline_throughput uses Engine without HTTP; one_batch calls ModelRunner for static kernel-level profiling.</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#627c7c"/></marker></defs><rect width="1000" height="470" rx="16" fill="#fbfdfc"/><text x="500" y="42" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#203b40">Benchmark 选择应由要回答的问题决定</text><rect x="55" y="120" width="205" height="95" rx="12" fill="#e2f4f0" stroke="#147f80" stroke-width="2"/><text x="157.5" y="150" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">bench_serving</text><text x="157.5" y="175" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">HTTP + server + scheduler</text><rect x="295" y="120" width="205" height="95" rx="12" fill="#fff0e4" stroke="#bd6738" stroke-width="2"/><text x="397.5" y="150" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">one_batch_server</text><text x="397.5" y="175" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">HTTP + server + scheduler</text><rect x="535" y="120" width="205" height="95" rx="12" fill="#eee9f8" stroke="#7258a8" stroke-width="2"/><text x="637.5" y="150" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">offline_throughput</text><text x="637.5" y="175" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">Engine / no HTTP</text><rect x="775" y="120" width="190" height="95" rx="12" fill="#f0f3f2" stroke="#81918f" stroke-width="2"/><text x="870" y="150" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">one_batch</text><text x="870" y="175" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">ModelRunner / static batch</text><text x="155" y="270" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#147f80">Online latency + load</text><text x="395" y="270" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#8e4d2b">Single-batch E2E</text><text x="635" y="270" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#7258a8">Engine throughput</text><text x="870" y="270" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#627274">Kernel profiling</text><path d="M155 220 L155 250" fill="none" stroke="#147f80" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M395 220 L395 250" fill="none" stroke="#bd6738" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M635 220 L635 250" fill="none" stroke="#7258a8" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M870 220 L870 250" fill="none" stroke="#81918f" stroke-width="2.5"  marker-end="url(#arr)"/><text x="500" y="370" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#8e4d2b">bench_one_batch_server 只有单批，不代表 steady-state serving</text><text x="500" y="430" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#627274">公平比较必须固定模型、硬件、prompt/output 分布、并发、到达率与缓存状态</text></svg>