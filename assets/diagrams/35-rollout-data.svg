dth="190" height="58" rx="7" fill="#fff0dc" stroke="#b36b23" stroke-width="1.5"/><text x="580" y="233.5" font-size="16" text-anchor="middle">Reward / advantage</text><text x="580" y="254.5" font-size="16" text-anchor="middle">训练侧</text><rect x="255" y="210" width="190" height="58" rx="7" fill="#fff0dc" stroke="#b36b23" stroke-width="1.5"/><text x="350" y="233.5" font-size="16" text-anchor="middle">Trainer</text><text x="350" y="254.5" font-size="16" text-anchor="middle">optimizer step</text><rect x="25" y="210" width="190" height="58" rx="7" fill="#e0f4ef" stroke="#167b70" stroke-width="1.5"/><text x="120" y="233.5" font-size="16" text-anchor="middle">Refit / validate</text><text x="120" y="254.5" font-size="16" text-anchor="middle">version v+1</text><text x="350" y="176" font-size="15" text-anchor="middle">控制面权重回路（与轨迹数据区分）</text><text x="350" y="313" font-size="15" text-anchor="middle">不由 SGLang 执行 reward 或 optimizer</text></g></svg>