<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 455" role="img" aria-labelledby="title desc"><title id="title">RadixCache 在部分前缀命中处拆分压缩边</title><desc id="desc">旧树有一条压缩边 [10,11,12,13,14,15]；新请求 [10,11,12,90] 在前三个 token 后分叉。match_prefix 仅拆原边；后续 insert 才产生新后缀，不复制共享 KV 的语义。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#627c7c"/></marker></defs><rect width="1000" height="455" rx="17" fill="#fbfdfc"/><text x="250" y="40" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#203b40">拆分前</text><text x="750" y="40" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#203b40">拆分 + 后续插入</text><rect x="145" y="80" width="210" height="62" rx="13" fill="#f0f3f2" stroke="#81918f" stroke-width="2"/><text x="250" y="110" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">root</text><text x="250" y="137" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">起点</text><rect x="85" y="190" width="330" height="86" rx="13" fill="#eee9f8" stroke="#7258a8" stroke-width="2"/><text x="250" y="220" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">[10,11,12,13,14,15]</text><text x="250" y="247" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">一条压缩边 · cached KV</text><path d="M250 142 L250 185" fill="none" stroke="#7258a8" stroke-width="2.7"  marker-end="url(#arrow)"/><text x="250" y="315" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#bd6738">新请求：[10,11,12,90]</text><text x="250" y="345" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#627274">命中 3 个 token 后出现分叉</text><rect x="650" y="80" width="200" height="62" rx="13" fill="#f0f3f2" stroke="#81918f" stroke-width="2"/><text x="750" y="110" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">root</text><text x="750" y="137" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">起点</text><rect x="610" y="190" width="280" height="72" rx="13" fill="#eee9f8" stroke="#7258a8" stroke-width="2"/><text x="750" y="220" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">[10,11,12]</text><text x="750" y="247" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">共享前缀节点</text><rect x="505" y="315" width="205" height="72" rx="13" fill="#e2f4f0" stroke="#147f80" stroke-width="2"/><text x="607.5" y="345" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">[13,14,15]</text><text x="607.5" y="372" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">旧请求后缀</text><rect x="790" y="315" width="175" height="72" rx="13" fill="#fff0e4" stroke="#bd6738" stroke-width="2"/><text x="877.5" y="345" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">[90]</text><text x="877.5" y="372" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">计算后插入</text><path d="M750 142 L750 185" fill="none" stroke="#7258a8" stroke-width="2.7"  marker-end="url(#arrow)"/><path d="M700 262 L610 308" fill="none" stroke="#147f80" stroke-width="2.7"  marker-end="url(#arrow)"/><path d="M800 262 L870 308" fill="none" stroke="#bd6738" stroke-width="2.7"  marker-end="url(#arrow)"/><text x="750" y="415" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#627274">match 只拆旧边；新后缀须先计算再 insert，索引切分不复制 KV</text></svg>