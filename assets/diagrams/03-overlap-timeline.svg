<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 397" role="img" aria-labelledby="t d"><title id="t">CPU 与 GPU 迭代间的 overlap</title><desc id="d">控制面 CPU 准备与结果处理可以和上一轮设备执行部分并行；模型输出 token 的依赖仍然存在。图长不表示实际耗时。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607a7b"/></marker></defs><rect width="960" height="397" rx="16" fill="#fbfdfc"/><text x="480" y="39" font-size="22" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#203b3f">串行 vs 重叠：减少 CPU/GPU 等待空白</text><text x="25" y="125" font-size="16" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#53666a">串行</text><text x="25" y="276" font-size="16" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#53666a">重叠</text><text x="480" y="390" font-size="16" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#53666a">重叠是调度时序，不代表 token 顺序依赖消失</text><path d="M321 117L327 117" fill="none" stroke="#c16b37" stroke-width="3"  marker-end="url(#arr)"/><path d="M503 117L509 117" fill="none" stroke="#81918f" stroke-width="3"  marker-end="url(#arr)"/><path d="M685 117L691 117" fill="none" stroke="#c16b37" stroke-width="3"  marker-end="url(#arr)"/><path d="M608 272L665 272" fill="none" stroke="#147f80" stroke-width="3"  marker-end="url(#arr)"/><path d="M646 348L666 348" fill="none" stroke="#c16b37" stroke-width="3"  marker-end="url(#arr)"/><rect x="148" y="81" width="173" height="73" rx="12" fill="#f0f2f2" stroke="#81918f" stroke-width="2"/><text x="234.5" y="111" font-size="18" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#243e42">CPU₀</text><text x="234.5" y="137" font-size="14" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#435a60">准备 batch₀</text><rect x="330" y="81" width="173" height="73" rx="12"