"#e0f4f0" stroke="#147f80" stroke-width="2"/><text x="546.5" y="270" font-size="18" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#243e42">CPU₁</text><text x="546.5" y="296" font-size="14" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#435a60">准备下一 batch</text><rect x="670" y="320" width="245" height="62" rx="12" fill="#fff0e4" stroke="#c16b37" stroke-width="2"/><text x="792.5" y="350" font-size="18" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#243e42">GPU₁</text><text x="792.5" y="376" font-size="14" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#435a60">后续计算</text></svg>