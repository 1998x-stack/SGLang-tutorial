<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc"><title id="title">请求行、物理槽位与 KV 张量的三层映射</title><desc id="desc">请求持有 req_pool_idx 指向 ReqToTokenPool 的一行；每个逻辑 token 位置记录物理 slot ID；物理 slot 再索引各层 K/V buffer。页号与 offset 的例子使用 P=4。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#627c7c"/></marker></defs><rect width="1000" height="460" rx="17" fill="#fbfdfc"/><text x="500" y="40" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#203b40">一个 token 的位置不是 GPU 张量地址</text><rect x="35" y="130" width="150" height="100" rx="13" fill="#f0f3f2" stroke="#81918f" stroke-width="2"/><text x="110" y="160" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Request A</text><text x="110" y="187" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">req_pool_idx = 3</text><rect x="235" y="105" width="375" height="155" rx="13" fill="#eee9f8" stroke="#7258a8" stroke-width="2"/><text x="422.5" y="135" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">ReqToTokenPool · row 3</text><text x="422.5" y="162" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">logical pos → physical slot ID</text><rect x="253" y="145" width="38" height="42" rx="6" fill="#fff" stroke="#9eaaa7"/><text x="272" y="162" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="13" font-weight="500" text-anchor="middle" fill="#60706f">0</text><text x="272" y="180" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#7258a8">16</text><rect x="296" y="145" width="38" height="42" rx="6" fill="#fff" stroke="#9eaaa7"/><text x="315" y="162" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="13" font-weight="500" text-anchor="middle" fill="#60706f">1</text><text x="315" y="180" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#7258a8">17</text><rect x="339" y="145" width="38" height="42" rx="6" fill="#fff" stroke="#9eaaa7"/><text x="358" y="162" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="13" font-weight="500" text-anchor="middle" fill="#60706f">2</text><text x="358" y="180" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#7258a8">18</text><rect x="382" y="145" width="38" height="42" rx="6" fill="#fff" stroke="#9eaaa7"/><text x="401" y="162" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="13" font-weight="500" text-anchor="middle" fill="#60706f">3</text><text x="401" y="180" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#7258a8">19</text><rect x="425" y="145" width="38" height="42" rx="6" fill="#fff" stroke="#9eaaa7"/><text x="444" y="162" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="13" font-weight="500" text-anchor="middle" fill="#60706f">4</text><text x="444" y="180" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#7258a8">36</text><rect x="468" y="145" width="38" height="42" rx="6" fill="#fff" stroke="#9eaaa7"/><text x="487" y="162" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="13" font-weight="500" text-anchor="middle" fill="#60706f">5</text><text x="487" y="180" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#7258a8">37</text><rect x="511" y="145" width="38" height="42" rx="6" fill="#fff" stroke="#9eaaa7"/><text x="530" y="162" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="13" font-weight="500" text-anchor="middle" fill="#60706f">6</text><text x="530" y="180" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#7258a8">38</text><rect x="554" y="145" width="38" height="42" rx="6" fill="#fff" stroke="#9eaaa7"/><text x="573" y="162" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="13" font-weight="500" text-anchor="middle" fill="#60706f">7</text><text x="573" y="180" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#7258a8">39</text><rect x="660" y="120" width="155" height="120" rx="13" fill="#fff0e4" stroke="#bd6738" stroke-width="2"/><text x="737.5" y="150" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Paged allocator</text><text x="737.5" y="177" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">page ID + offset</text><rect x="850" y="95" width="125" height="165" rx="13" fill="#e2f4f0" stroke="#147f80" stroke-width="2"/><text x="912.5" y="125" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">KVCache</text><text x="912.5" y="152" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">per-layer K and V</text><path d="M185 180 L230 180" fill="none" stroke="#7258a8" stroke-width="2.7"  marker-end="url(#arrow)"/><text x="207" y="162" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="13" font-weight="500" text-anchor="middle" fill="#7258a8">row index</text><path d="M660 210 L615 210" fill="none" stroke="#bd6738" stroke-width="2.7"  marker-end="url(#arrow)"/><text x="635" y="194" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="13" font-weight="500" text-anchor="middle" fill="#bd6738">slot IDs</text><path d="M815 180 L845 180" fill="none" stroke="#147f80" stroke-width="2.7"  marker-end="url(#arrow)"/><text x="830" y="163" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="12" font-weight="500" text-anchor="middle" fill="#147f80">read / write</text><text x="500" y="320" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="17" font-weight="500" text-anchor="middle" fill="#334f53">P = 4 的教学映射：page 4 → slots 16–19；page 9 → slots 36–39</text><text x="500" y="362" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#334f53">logical position j  →  req_to_token[row, j]  →  physical slot</text><text x="500" y="405" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#627274">真实 KV buffer 形状受 MHA / MLA、布局、dtype 与硬件路径影响</text></svg>