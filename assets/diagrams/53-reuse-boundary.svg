<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" role="img"><title>Full KV 与 recurrent checkpoint 边界</title><desc>850 KV hit 不等于850可恢复；最近可用 state 决定恢复位置。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="700" height="360" rx="10" fill="#faf9f5"/><g font-family="system-ui,sans-serif" fill="#243243"><text x="350" y="29" font-size="19" text-anchor="middle" font-weight="700">Full KV 与 recurrent checkpoint 边界</text><rect x="87" y="103" width="455" height="22" fill="#bda7e0"/><path d="M87 125H622" stroke="#64748b"/><path d="M87 125v9" stroke="#64748b"/><path d="M301 125v9" stroke="#64748b"/><path d="M515 125v9" stroke="#64748b"/><path d="M542 125v9" stroke="#64748b"/><path d="M622 125v9" stroke="#64748b"/><rect x="301" y="171" width="241" height="14" fill="#e7ba7e"/><rect x="515" y="219" width="27" height="14" fill="#7fc8ba"/><text x="350" y="66" font-size="15" text-anchor="middle">Full KV hit：850 tokens</text><text x="87" y="147" font-size="15" text-anchor="middle">0</text><text x="301" y="147" font-size="15" text-anchor="middle">400</text><text x="515" y="147" font-size="15" text-anchor="middle">800</text><text x="542" y="91" font-size="15" text-anchor="middle">850</text><text x="622" y="147" font-size="15" text-anchor="middle">1000</text><text x="301" y="202" font-size="15" text-anchor="middle">Level 2 resume</text><text x="515" y="250" font-size="15" text-anchor="middle">Level 3 resume</text><text x="350" y="323" font-size="15" text-anchor="middle">重算：450 vs 50 tokens</text></g></svg>