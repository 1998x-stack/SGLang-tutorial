<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 485" role="img" aria-labelledby="t d"><title id="t">锁引用决定哪些 RadixCache 节点可以被回收</title><desc id="d">A root and prefix path with lock_ref 1 are protected while a request uses them. An unreferenced leaf B1 may become an eviction candidate; its KV segment is then returned through the allocator.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#627c7c"/></marker></defs><rect width="1000" height="485" rx="17" fill="#fbfdfc"/><text x="500" y="40" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#203b40">lock_ref 保护路径；eviction 只选择满足条件的可回收叶节点</text><rect x="410" y="75" width="180" height="65" rx="12" fill="#eee9f8" stroke="#7258a8" stroke-width="2"/><text x="500" y="105" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">root · lock_ref = 1</text><text x="500" y="131" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">祖先路径受保护</text><rect x="70" y="205" width="280" height="90" rx="12" fill="#eee9f8" stroke="#7258a8" stroke-width="2"/><text x="210" y="235" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">prefix A · lock_ref = 1</text><text x="210" y="261" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">protected · active request</text><rect x="650" y="205" width="280" height="90" rx="12" fill="#fff0e4" stroke="#bd6738" stroke-width="2"/><text x="790" y="235" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">prefix B · lock_ref = 0</text><text x="790" y="261" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">evictable · no active ref</text><rect x="70" y="345" width="280" height="70" rx="12" fill="#e2f4f0" stroke="#147f80" stroke-width="2"/><text x="210" y="375" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">leaf A1</text><text x="210" y="401" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">仍被请求使用</text><rect x="650" y="345" width="280" height="70" rx="12" fill="#fff0e4" stroke="#bd6738" stroke-width="2"/><text x="790" y="375" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">leaf B1</text><text x="790" y="401" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">eviction candidate</text><rect x="390" y="345" width="200" height="70" rx="12" fill="#f0f3f2" stroke="#81918f" stroke-width="2"/><text x="490" y="375" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">allocator</text><text x="490" y="401" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">free_segment()</text><path d="M470 140 L210 195" fill="none" stroke="#7258a8" stroke-width="2.7"  marker-end="url(#a)"/><path d="M530 140 L790 195" fill="none" stroke="#bd6738" stroke-width="2.7"  marker-end="url(#a)"/><path d="M210 295 L210 338" fill="none" stroke="#147f80" stroke-width="2.7"  marker-end="url(#a)"/><path d="M790 295 L790 338" fill="none" stroke="#bd6738" stroke-width="2.7"  marker-end="url(#a)"/><path d="M650 380 L595 380" fill="none" stroke="#bd6738" stroke-width="2.7"  marker-end="url(#a)"/><text x="500" y="455" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#627274">unlock 后 B 仍需满足 leaf / strategy 等条件，才会真正被淘汰</text></svg>