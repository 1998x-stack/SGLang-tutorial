<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc"><title id="title">锁引用决定哪些 RadixCache 节点可以被回收</title><desc id="desc">请求命中后沿节点到根增加 lock_ref；节点从 0 变为 1 时从 evictable 转为 protected。请求释放时反向递减。驱逐从可回收叶节点开始，再通过 allocator 释放对应 KV segment。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#627c7c"/></marker></defs><rect width="1000" height="470" rx="17" fill="#fbfdfc"/><text x="500" y="40" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#203b40">索引树管理“能否回收”，物理 allocator 管理“如何归还页”</text><rect x="390" y="75" width="220" height="62" rx="13" fill="#f0f3f2" stroke="#81918f" stroke-width="2"/><text x="500" y="105" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">root</text><text x="500" y="132" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">所有路径的共同祖先</text><rect x="130" y="200" width="300" height="92" rx="13" fill="#eee9f8" stroke="#7258a8" stroke-width="2"/><text x="280" y="230" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">prefix A · lock_ref = 1</text><text x="280" y="257" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">protected · 正在使用</text><rect x="570" y="200" width="300" height="92" rx="13" fill="#fff0e4" stroke="#bd6738" stroke-width="2"/><text x="720" y="230" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">prefix B · lock_ref = 0</text><text x="720" y="257" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">evictable · 空闲叶节点</text><path d="M440 137 L290 195" fill="none" stroke="#7258a8" stroke-width="2.7"  marker-end="url(#arrow)"/><path d="M560 137 L710 195" fill="none" stroke="#bd6738" stroke-width="2.7"  marker-end="url(#arrow)"/><rect x="110" y="340" width="340" height="65" rx="13" fill="#e2f4f0" stroke="#147f80" stroke-width="2"/><text x="280" y="370" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">请求释放后 dec_lock_ref</text><text x="280" y="397" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">A 可能重新变为 evictable</text><rect x="555" y="340" width="340" height="65" rx="13" fill="#f0f3f2" stroke="#81918f" stroke-width="2"/><text x="725" y="370" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">evict(B)</text><text x="725" y="397" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">删除叶节点 + free_segment</text><path d="M280 292 L280 335" fill="none" stroke="#147f80" stroke-width="2.7"  marker-end="url(#arrow)"/><path d="M710 292 L710 335" fill="none" stroke="#bd6738" stroke-width="2.7"  marker-end="url(#arrow)"/><text x="500" y="435" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#627274">受保护路径不能因普通空闲叶淘汰而被提前释放</text></svg>