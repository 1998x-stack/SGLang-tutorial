<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" role="img"><title>并发 buffer 与固定预算</title><desc>2、6、8 streams 对应512、1024、1280 MiB；1GiB 是教学预算。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="700" height="360" rx="10" fill="#faf9f5"/><g font-family="system-ui,sans-serif" fill="#243243"><text x="350" y="29" font-size="19" text-anchor="middle" font-weight="700">并发 buffer 与固定预算</text><path d="M549 80V267" stroke="#b36b23" stroke-width="2" stroke-dasharray="5 4"/><rect x="160" y="83" width="97" height="26" fill="#bda7e0"/><rect x="257" y="83" width="97" height="26" fill="#7fc8ba"/><text x="362" y="102" font-size="15" text-anchor="start">512</text><rect x="160" y="148" width="97" height="26" fill="#bda7e0"/><rect x="257" y="148" width="291" height="26" fill="#7fc8ba"/><text x="556" y="167" font-size="15" text-anchor="start">1024</text><rect x="160" y="213" width="97" height="26" fill="#bda7e0"/><rect x="257" y="213" width="388" height="26" fill="#e7ba7e"/><text x="653" y="232" font-size="15" text-anchor="end">1280</text><text x="105" y="100" font-size="15" text-anchor="middle">C=2</text><text x="105" y="165" font-size="15" text-anchor="middle">C=6</text><text x="105" y="230" font-size="15" text-anchor="middle">C=8</text><text x="580" y="74" font-size="15" text-anchor="middle">Budget 1024 MiB</text><text x="350" y="322" font-size="15" text-anchor="middle">固定 256 MiB + C×128 MiB；教学预算</text></g></svg>