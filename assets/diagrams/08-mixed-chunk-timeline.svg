<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc"><title id="title">Prefill chunk 与 Decode 请求可以在同一轮混合</title><desc id="desc">当 mixed-chunk 路径启用且资源/模型约束允许时，PrefillAdder 为长输入选择一段，ScheduleBatch 将其与运行中的 Decode 行合并为 MIXED forward；并非所有配置都混合。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#627c7c"/></marker></defs><rect width="1000" height="440" rx="17" fill="#fbfdfc"/><text x="500" y="40" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#203b40">一次 forward 的 batch 可以同时包含不同请求阶段</text><text x="190" y="100" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#627274">迭代</text><text x="360" y="100" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#29474c">t₀</text><text x="570" y="100" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#29474c">t₁</text><text x="780" y="100" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#29474c">t₂</text><text x="55" y="175" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#bd6738">Prefill A</text><text x="55" y="270" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#147f80">Decode B</text><rect x="270" y="125" width="180" height="70" rx="10" fill="#fff0e4" stroke="#bd6738" stroke-width="2"/><text x="360" y="154" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#8e4d2b">A[0:4]</text><text x="360" y="178" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#8e6a54">Prefill chunk</text><rect x="480" y="125" width="180" height="70" rx="10" fill="#fff0e4" stroke="#bd6738" stroke-width="2"/><text x="570" y="154" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#8e4d2b">A[4:7]</text><text x="570" y="178" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#8e6a54">Prefill chunk</text><rect x="690" y="125" width="180" height="70" rx="10" fill="#fff0e4" stroke="#bd6738" stroke-width="2"/><text x="780" y="154" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#8e4d2b">A[7:12]</text><text x="780" y="178" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#8e6a54">Prefill chunk</text><rect x="270" y="220" width="180" height="70" rx="10" fill="#e2f4f0" stroke="#147f80" stroke-width="2"/><text x="360" y="249" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#176f70">B token 1</text><text x="360" y="273" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a7774">Decode row</text><rect x="480" y="220" width="180" height="70" rx="10" fill="#e2f4f0" stroke="#147f80" stroke-width="2"/><text x="570" y="249" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#176f70">B token 2</text><text x="570" y="273" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a7774">Decode row</text><rect x="690" y="220" width="180" height="70" rx="10" fill="#e2f4f0" stroke="#147f80" stroke-width="2"/><text x="780" y="249" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#176f70">B token 3</text><text x="780" y="273" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a7774">Decode row</text><text x="500" y="345" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#334f53">同一列代表可合并为一个 MIXED forward 的两类行</text><text x="500" y="390" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#627274">每个 B token 仍遵循自回归依赖；图中不表示跨步预测</text></svg>