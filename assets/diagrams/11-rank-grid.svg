-weight="750" fill="#1d3035" text-anchor="middle">GPU 5</text><line x1="565" y1="332" x2="595" y2="332" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/><text x="70" y="433" font-family="system-ui,sans-serif" font-size="17" font-weight="650" fill="#53646b" text-anchor="start">Stage 3</text><rect x="315" y="388" width="250" height="68" rx="12" fill="#d8efeb" stroke="#147f80" stroke-width="2"/><rect x="595" y="388" width="250" height="68" rx="12" fill="#d8efeb" stroke="#147f80" stroke-width="2"/><text x="440" y="430" font-family="system-ui,sans-serif" font-size="18" font-weight="750" fill="#1d3035" text-anchor="middle">GPU 6</text><text x="720" y="430" font-family="system-ui,sans-serif" font-size="18" font-weight="750" fill="#1d3035" text-anchor="middle">GPU 7</text><line x1="565" y1="422" x2="595" y2="422" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/>
