<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc"><title id="title">TP=2 PP=4 的八 rank 组网</title><desc id="desc">8 ranks 组成四个 TP group 和两个 PP group；横向同一 stage 做 TP，纵向同一 tensor rank 跨 stage 做 PP。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#147f80"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#b75c31"/></marker></defs><rect width="1200" height="540" rx="20" fill="#fffdf9"/><text x="42" y="48" font-family="system-ui,sans-serif" font-size="24" font-weight="750" fill="#1d3035" text-anchor="start">8 ranks · TP = 2 · PP = 4</text>
<text x="440" y="92" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#147f80" text-anchor="middle">Tensor rank 0</text><text x="720" y="92" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#147f80" text-anchor="middle">Tensor rank 1</text>
