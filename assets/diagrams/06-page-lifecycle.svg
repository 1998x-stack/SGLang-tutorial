<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc"><title id="title">分页 KV 的分配、追加与释放</title><desc id="desc">空闲页池提供整页物理页；扩展请求可先使用当前页剩余位置，跨越页边界时再分配新页。释放时归还 page ID；异步写入场景可能先暂存等待安全复用。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#627c7c"/></marker></defs><rect width="1000" height="460" rx="17" fill="#fbfdfc"/><text x="500" y="40" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#203b40">页号决定一组物理 slot，而不是 token 的语义位置</text><rect x="30" y="110" width="180" height="105" rx="13" fill="#f0f3f2" stroke="#81918f" stroke-width="2"/><text x="120" y="140" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Free pages</text><text x="120" y="167" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">[2, 4, 7]</text><rect x="265" y="110" width="190" height="105" rx="13" fill="#eee9f8" stroke="#7258a8" stroke-width="2"/><text x="360" y="140" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Request A</text><text x="360" y="167" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">page 2 · P=4</text><rect x="510" y="100" width="210" height="125" rx="13" fill="#fff0e4" stroke="#bd6738" stroke-width="2"/><text x="615" y="130" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Physical slots</text><text x="615" y="157" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">8 · 9 · 10 · 11</text><rect x="780" y="110" width="190" height="105" rx="13" fill="#e2f4f0" stroke="#147f80" stroke-width="2"/><text x="875" y="140" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">ReqToToken row</text><text x="875" y="167" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">[8, 9, 10, 11]</text><path d="M210 162 L260 162" fill="none" stroke="#627c7c" stroke-width="2.7"  marker-end="url(#arrow)"/><path d="M455 162 L505 162" fill="none" stroke="#bd6738" stroke-width="2.7"  marker-end="url(#arrow)"/><path d="M720 162 L775 162" fill="none" stroke="#147f80" stroke-width="2.7"  marker-end="url(#arrow)"/><text x="500" y="265" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#334f53">追加 2 个 token：若当前页尚有位置，可继续使用 page 2</text><rect x="70" y="300" width="190" height="90" rx="13" fill="#e2f4f0" stroke="#147f80" stroke-width="2"/><text x="165" y="330" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">继续追加</text><text x="165" y="357" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">slot 10 → 11</text><rect x="405" y="300" width="190" height="90" rx="13" fill="#fff0e4" stroke="#bd6738" stroke-width="2"/><text x="500" y="330" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">跨页边界</text><text x="500" y="357" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">申请 page 7</text><rect x="740" y="300" width="190" height="90" rx="13" fill="#f0f3f2" stroke="#81918f" stroke-width="2"/><text x="835" y="330" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">释放请求</text><text x="835" y="357" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">page IDs 回池</text><path d="M260 345 L400 345" fill="none" stroke="#147f80" stroke-width="2.7"  marker-end="url(#arrow)"/><path d="M595 345 L735 345" fill="none" stroke="#bd6738" stroke-width="2.7"  marker-end="url(#arrow)"/><text x="500" y="425" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#627274">示意页号与槽位；生产路径还要处理 staged free、写入事件和并发安全</text></svg>