<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 374" role="img" aria-labelledby="t d"><title id="t">约束生成的教学有限状态机</title><desc id="d">字符级 JSON 样例在 q0 仅允许 {，转移后 q1 仅允许引号；真实解码按 tokenizer token 与 grammar 前缀状态做匹配，不等同字符单步转移。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607a7b"/></marker></defs><rect width="960" height="374" rx="16" fill="#fbfdfc"/><text x="480" y="44" font-size="22" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#203b3f">约束输出限制候选，不保证事实正确</text><text x="319" y="123" font-size="16" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#53666a">字符 {</text><text x="641" y="123" font-size="16" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#53666a">字符双引号</text><text x="480" y="365" font-size="16" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#53666a">此例是字符级演示，不是具体 grammar backend</text><path d="M259 141L373 141" fill="none" stroke="#7459a9" stroke-width="3"  marker-end="url(#arr)"/><path d="M589 141L694 141" fill="none" stroke="#147f80" stroke-width="3"  marker-end="url(#arr)"/><path d="M430 292L529 292" fill="none" stroke="#147f80" stroke-width="3"  marker-end="url(#arr)"/><rect x="48" y="101" width="211" height="80" rx="12" fill="#f0f2f2" stroke="#81918f" stroke-width="2"/><text x="153.5" y="131" font-size="18" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#243e42">q₀</text><text x="153.5" y="157" font-size="14" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#435a60">期望左花括号 {</text><rect x="378" y="101" width="211" height="80" rx="12" fill="#eee9f9" stroke="#7459a9" stroke-width="2"/><text x="483.5" y="131" font-size="18" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#243e42">q₁</text><text x="483.5" y="157" font-size="14" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#435a60">期望引号</text><rect x="698" y="101" width="211" height="80" rx="12" fill="#e0f4f0" stroke="#147f80" stroke-width="2"/><text x="803.5" y="131" font-size="18" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#243e42">q₂</text><text x="803.5" y="157" font-size="14" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#435a60">字段内容开始</text><rect x="88" y="255" width="342" height="76" rx="12" fill="#f0f2f2" stroke="#81918f" stroke-width="2"/><text x="259" y="285" font-size="18" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#243e42">原候选集合</text><text x="259" y="311" font-size="14" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#435a60">{, [, a, 0, ...</text><rect x="534" y="255" width="342" height="76" rx="12" fill="#e0f4f0" stroke="#147f80" stroke-width="2"/><text x="705" y="285" font-size="18" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#243e42">q₀ 允许</text><text x="705" y="311" font-size="14" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#435a60">仅 {（toy）</text></svg>