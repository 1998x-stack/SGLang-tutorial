<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc"><title id="title">CUDA Graph 将一次 forward 的 GPU work capture 后反复 replay</title><desc id="desc">Warmup and capture create a graph for fixed operations, shapes, and memory addresses. Replay updates static input buffer contents, then launches the captured graph without rebuilding Python and driver dispatch for every op.</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#627c7c"/></marker></defs><rect width="1000" height="470" rx="16" fill="#fbfdfc"/><text x="500" y="42" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#203b40">Capture 一次，Replay 多次：减少 CPU launch 开销</text><rect x="45" y="130" width="190" height="100" rx="12" fill="#f0f3f2" stroke="#81918f" stroke-width="2"/><text x="140" y="160" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Warmup</text><text x="140" y="185" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">allocate + compile</text><rect x="285" y="130" width="190" height="100" rx="12" fill="#fff0e4" stroke="#bd6738" stroke-width="2"/><text x="380" y="160" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Capture</text><text x="380" y="185" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">record kernels</text><rect x="525" y="130" width="190" height="100" rx="12" fill="#eee9f8" stroke="#7258a8" stroke-width="2"/><text x="620" y="160" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Static buffers</text><text x="620" y="185" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">same addresses</text><rect x="765" y="130" width="190" height="100" rx="12" fill="#e2f4f0" stroke="#147f80" stroke-width="2"/><text x="860" y="160" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Replay</text><text x="860" y="185" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">cudaGraphLaunch</text><path d="M235 180 L280 180" fill="none" stroke="#627c7c" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M475 180 L520 180" fill="none" stroke="#627c7c" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M715 180 L760 180" fill="none" stroke="#627c7c" stroke-width="2.5"  marker-end="url(#arr)"/><rect x="285" y="310" width="190" height="75" rx="12" fill="#e2f4f0" stroke="#147f80" stroke-width="2"/><text x="380" y="340" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">new input data</text><text x="380" y="365" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">copy_ into static input</text><path d="M380 305 L380 240" fill="none" stroke="#147f80" stroke-width="2.5"  marker-end="url(#arr)"/><text x="500" y="435" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#627274">shape / control flow / pointer contract 不满足时，必须换 graph key、重捕获或回退</text></svg>