<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Unified、PD 与 EPD 部署拓扑</title><desc id="desc">Unified 将 Encoder/Prefill/Decode 共置；PD 拆分 Prefill 与 Decode；EPD 再独立 Encoder。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#147f80"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#b75c31"/></marker></defs><rect width="1200" height="520" rx="20" fill="#fffdf9"/><text x="42" y="45" font-family="system-ui,sans-serif" font-size="23" font-weight="750" fill="#1d3035" text-anchor="start">部署拓扑的差异：谁被独立扩缩容？</text>
<text x="55" y="125" font-family="system-ui,sans-serif" font-size="19" font-weight="750" fill="#53646b" text-anchor="start">Unified</text><rect x="240" y="82" width="850" height="80" rx="12" fill="#f0f1ef" stroke="#8b9693" stroke-width="2"/><text x="665" y="130" font-family="system-ui,sans-serif" font-size="20" font-weight="750" fill="#1d3035" text-anchor="middle">Encoder + Prefill + Decode</text>
<text x="55" y="275" font-family="system-ui,sans-serif" font-size="19" font-weight="750" fill="#53646b" text-anchor="start">PD</text><rect x="240" y="220" width="390" height="80" rx="12" fill="#d8efeb" stroke="#147f80" stroke-width="2"/><text x="435" y="268" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#147f80" text-anchor="middle">Encoder + Prefill</text><rect x="730" y="220" width="360" height="80" rx="12" fill="#fff0e6" stroke="#b75c31" stroke-width="2"/><text x="910" y="268" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#b75c31" text-anchor="middle">Decode</text><line x1="630" y1="260" x2="730" y2="260" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/>
<text x="55" y="425" font-family="system-ui,sans-serif" font-size="19" font-weight="750" fill="#53646b" text-anchor="start">EPD</text><rect x="240" y="370" width="250" height="80" rx="12" fill="#eee9f7" stroke="#7059aa" stroke-width="2"/><text x="365" y="418" font-family="system-ui,sans-serif" font-size="19" font-weight="750" fill="#7059aa" text-anchor="middle">Encoder</text><rect x="570" y="370" width="250" height="80" rx="12" fill="#d8efeb" stroke="#147f80" stroke-width="2"/><text x="695" y="418" font-family="system-ui,sans-serif" font-size="19" font-weight="750" fill="#147f80" text-anchor="middle">Prefill</text><rect x="900" y="370" width="190" height="80" rx="12" fill="#fff0e6" stroke="#b75c31" stroke-width="2"/><text x="995" y="418" font-family="system-ui,sans-serif" font-size="18" font-weight="750" fill="#b75c31" text-anchor="middle">Decode</text><line x1="490" y1="410" x2="570" y2="410" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/><line x1="820" y1="410" x2="900" y2="410" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/>
<text x="240" y="490" font-family="system-ui,sans-serif" font-size="15" font-weight="500" fill="#53646b" text-anchor="start">EPD 增加独立扩缩容能力，同时增加 embedding / KV transfer、router 与故障边界。</text></svg>