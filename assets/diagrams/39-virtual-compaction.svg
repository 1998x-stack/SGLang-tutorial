<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" role="img"><title>移动物理页而保持虚拟 ID</title><desc>虚拟 ID 7 指向物理页 5，安全移动后改映射到页 2；仍在读取的旧页不可提前覆写。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="700" height="360" rx="10" fill="#faf9f5"/><g font-family="system-ui,sans-serif" fill="#243243"><text x="350" y="29" font-size="19" text-anchor="middle" font-weight="700">移动物理页而保持虚拟 ID</text><path d="M205 95H260" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M440 95H495" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M585 120V230" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M350 120V230" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M205 255H260" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M440 255H495" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><rect x="25" y="70" width="180" height="50" rx="5" fill="#e0f4ef" stroke="#167b70"/><text x="115" y="90" font-size="16" text-anchor="middle">Request row</text><text x="115" y="110" font-size="16" text-anchor="middle">virtual ID 7</text><rect x="260" y="70" width="180" height="50" rx="5" fill="#eee8fa" stroke="#7858ae"/><text x="350" y="90" font-size="16" text-anchor="middle">Mapping</text><text x="350" y="110" font-size="16" text-anchor="middle">7 → physical 5</text><rect x="495" y="70" width="180" height="50" rx="5" fill="#eee8fa" stroke="#7858ae"/><text x="585" y="90" font-size="16" text-anchor="middle">Page 5</text><text x="585" y="110" font-size="16" text-anchor="middle">旧 payload</text><rect x="25" y="230" width="180" height="50" rx="5" fill="#e0f4ef" stroke="#167b70"/><text x="115" y="250" font-size="16" text-anchor="middle">Request row</text><text x="115" y="270" font-size="16" text-anchor="middle">virtual ID 7</text><rect x="260" y="230" width="180" height="50" rx="5" fill="#eee8fa" stroke="#7858ae"/><text x="350" y="250" font-size="16" text-anchor="middle">Mapping</text><text x="350" y="270" font-size="16" text-anchor="middle">7 → physical 2</text><rect x="495" y="230" width="180" height="50" rx="5" fill="#eee8fa" stroke="#7858ae"/><text x="585" y="250" font-size="16" text-anchor="middle">Page 2</text><text x="585" y="270" font-size="16" text-anchor="middle">相同 payload</text><text x="350" y="165" text-anchor="middle" font-size="15">wait / copy / rebind</text><text x="350" y="188" text-anchor="middle" font-size="15">未清除 hazard 时禁止复用旧物理页</text><text x="350" y="321" text-anchor="middle" font-size="15">request row 不需要改变</text></g></svg>