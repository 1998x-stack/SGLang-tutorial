<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="g26a-title g26a-desc"><title id="g26a-title">Grammar constrained decoding runtime path</title><desc id="g26a-desc">Request constraint is compiled, cached and converted into per-step vocabulary masks before sampling.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#527b79"/></marker></defs><rect width="1080" height="560" rx="18" fill="#fbfdfc"/><path d="M 215 265 L 260 265" stroke="#527b79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 450 265 L 500 265" stroke="#527b79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 670 265 L 720 265" stroke="#527b79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 875 265 L 910 265" stroke="#527b79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 585 400 L 585 325" stroke="#c98246" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="585" y="353.5" text-anchor="middle" font-size="14" fill="#52666a">ready / failed</text><g><rect x="35" y="205" width="180" height="120" rx="15" fill="#f3f0fb" stroke="#7564a0" stroke-width="2"/><text x="125" y="236" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">Request</text><text x="125" y="261" text-anchor="middle" font-size="15" fill="#35585a">JSON Schema / EBNF</text></g><g><rect x="260" y="205" width="190" height="120" rx="15" fill="#f3f0fb" stroke="#7564a0" stroke-width="2"/><text x="355" y="236" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">Compiler</text><text x="355" y="261" text-anchor="middle" font-size="15" fill="#35585a">TokenizerInfo + cache</text></g><g><rect x="500" y="205" width="170" height="120" rx="15" fill="#fff3e9" stroke="#c98246" stroke-width="2"/><text x="585" y="236" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">Matcher</text><text x="585" y="261" text-anchor="middle" font-size="15" fill="#35585a">Grammar state</text></g><g><rect x="720" y="205" width="155" height="120" rx="15" fill="#eaf4f1" stroke="#477d78" stroke-width="2"/><text x="797.5" y="236" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">Bitmask</text><text x="797.5" y="261" text-anchor="middle" font-size="15" fill="#35585a">Allowed tokens</text></g><g><rect x="910" y="205" width="135" height="120" rx="15" fill="#eaf4f1" stroke="#477d78" stroke-width="2"/><text x="977.5" y="236" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">Sampler</text><text x="977.5" y="261" text-anchor="middle" font-size="15" fill="#35585a">Next token</text></g><g><rect x="500" y="400" width="170" height="95" rx="15" fill="#f0f2f3" stroke="#839196" stroke-width="2"/><text x="585" y="431" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">Grammar queue</text><text x="585" y="456" text-anchor="middle" font-size="15" fill="#35585a">Async compile</text></g></svg>