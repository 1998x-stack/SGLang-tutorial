<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 465" role="img" aria-labelledby="title desc"><title id="title">Attention Kernel 通过请求映射读取分散的 KV 页面</title><desc id="desc">当前 Query 不直接假设历史 K/V 连续存放；metadata updater 根据 request row 生成页索引，后端 wrapper 访问相应 K/V blocks 并计算注意力。Online softmax 是分块精确计算的一种通用策略，并非所有 backend 的唯一实现。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#627c7c"/></marker></defs><rect width="1000" height="465" rx="17" fill="#fbfdfc"/><text x="500" y="40" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#203b40">从逻辑 token 到 K/V page，再到 attention output</text><rect x="25" y="110" width="150" height="82" rx="13" fill="#fff0e4" stroke="#bd6738" stroke-width="2"/><text x="100" y="140" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Query Q</text><text x="100" y="167" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">当前 token</text><rect x="235" y="95" width="215" height="110" rx="13" fill="#eee9f8" stroke="#7258a8" stroke-width="2"/><text x="342.5" y="125" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Request row</text><text x="342.5" y="152" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">[16,17,36,37]</text><rect x="500" y="95" width="210" height="110" rx="13" fill="#f0f3f2" stroke="#81918f" stroke-width="2"/><text x="605" y="125" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Metadata</text><text x="605" y="152" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">indptr + page indices</text><rect x="765" y="80" width="205" height="135" rx="13" fill="#e2f4f0" stroke="#147f80" stroke-width="2"/><text x="867.5" y="110" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">K/V pages</text><text x="867.5" y="137" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">page 4 · page 9</text><path d="M175 150 L230 150" fill="none" stroke="#bd6738" stroke-width="2.7"  marker-end="url(#arrow)"/><path d="M450 150 L495 150" fill="none" stroke="#7258a8" stroke-width="2.7"  marker-end="url(#arrow)"/><path d="M710 150 L760 150" fill="none" stroke="#81918f" stroke-width="2.7"  marker-end="url(#arrow)"/><rect x="245" y="285" width="235" height="85" rx="13" fill="#fff0e4" stroke="#bd6738" stroke-width="2"/><text x="362.5" y="315" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Tile loop</text><text x="362.5" y="342" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">QKᵀ → scale → softmax</text><rect x="535" y="285" width="205" height="85" rx="13" fill="#eee9f8" stroke="#7258a8" stroke-width="2"/><text x="637.5" y="315" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Online state</text><text x="637.5" y="342" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">running m, ℓ, u</text><rect x="790" y="285" width="180" height="85" rx="13" fill="#e2f4f0" stroke="#147f80" stroke-width="2"/><text x="880" y="315" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Output O</text><text x="880" y="342" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">weighted V</text><path d="M865 220 L365 280" fill="none" stroke="#147f80" stroke-width="2.7"  marker-end="url(#arrow)"/><path d="M480 327 L530 327" fill="none" stroke="#bd6738" stroke-width="2.7"  marker-end="url(#arrow)"/><path d="M740 327 L785 327" fill="none" stroke="#7258a8" stroke-width="2.7"  marker-end="url(#arrow)"/><text x="500" y="420" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#627274">分块减少中间矩阵写回；具体 tile / warp / page 规则取决于所选 kernel</text></svg>