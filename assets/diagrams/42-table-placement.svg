<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" role="img"><title>Engram 表分片及查表路径</title><desc>每个 rank 可保存静态表的一部分；请求 row 由 owner 或集体通信返回。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="700" height="360" rx="10" fill="#faf9f5"/><g font-family="system-ui,sans-serif" fill="#243243"><text x="350" y="29" font-size="19" text-anchor="middle" font-weight="700">Engram 表分片及查表路径</text><path d="M205 265H255" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M585 126V181H350V238" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M445 265H495" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><rect x="25" y="70" width="180" height="56" rx="5" fill="#eee8fa" stroke="#7858ae"/><text x="115" y="93" font-size="16" text-anchor="middle">Rank 0</text><text x="115" y="113" font-size="16" text-anchor="middle">rows 0–1</text><rect x="255" y="70" width="190" height="56" rx="5" fill="#eee8fa" stroke="#7858ae"/><text x="350" y="93" font-size="16" text-anchor="middle">Rank 1</text><text x="350" y="113" font-size="16" text-anchor="middle">rows 2–3</text><rect x="495" y="70" width="180" height="56" rx="5" fill="#eee8fa" stroke="#7858ae"/><text x="585" y="93" font-size="16" text-anchor="middle">Rank 2</text><text x="585" y="113" font-size="16" text-anchor="middle">rows 4–5</text><rect x="25" y="238" width="180" height="54" rx="5" fill="#eef1f4" stroke="#65758a"/><text x="115" y="260" font-size="16" text-anchor="middle">Query rank</text><text x="115" y="280" font-size="16" text-anchor="middle">请求 row 4</text><rect x="255" y="238" width="190" height="54" rx="5" fill="#fff0dc" stroke="#b36b23"/><text x="350" y="260" font-size="16" text-anchor="middle">Peer / collective</text><text x="350" y="280" font-size="16" text-anchor="middle">取回 row 4</text><rect x="495" y="238" width="180" height="54" rx="5" fill="#e0f4ef" stroke="#167b70"/><text x="585" y="260" font-size="16" text-anchor="middle">Lookup result</text><text x="585" y="280" font-size="16" text-anchor="middle">same row</text><text x="350" y="160" text-anchor="middle" font-size="15">table placement 与 lookup route 是不同决策</text><text x="350" y="326" text-anchor="middle" font-size="15">静态 rows 可以在 GPU 或 pinned host</text></g></svg>