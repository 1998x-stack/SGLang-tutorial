<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img"><title>PD 分离：控制请求与 KV 数据分开</title><desc>Router 选择 P/D 并协同发送控制请求；Prefill 与 Decode 间交付 KV 及必要 metadata，Decode 确认接收可用后继续。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="960" height="420" rx="16" fill="#fbfdfc"/><g font-family="system-ui,sans-serif" fill="#243e42"><text x="480" y="32" font-size="22" text-anchor="middle" font-weight="700">PD 分离：控制请求与 KV 数据分开</text><path d="M240 98H330" fill="none" stroke="#64748b" stroke-width="2.5"  marker-end="url(#a)"/><path d="M137 131V190H780V131" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a)"/><path d="M445 131V260" fill="none" stroke="#64748b" stroke-width="2.5"  marker-end="url(#a)"/><path d="M560 293H690" fill="none" stroke="#64748b" stroke-width="2.5"  marker-end="url(#a)"/><path d="M805 260V131" fill="none" stroke="#64748b" stroke-width="2.5"  marker-end="url(#a)"/><rect x="35" y="65" width="205" height="66" rx="9" fill="#f0f2f2" stroke="#81918f" stroke-width="2"/><text x="137.5" y="92" font-size="16" text-anchor="middle">Router</text><text x="137.5" y="114" font-size="16" text-anchor="middle">select P and D</text><rect x="330" y="65" width="230" height="66" rx="9" fill="#fff0e4" stroke="#c16b37" stroke-width="2"/><text x="445" y="92" font-size="16" text-anchor="middle">Prefill worker</text><text x="445" y="114" font-size="16" text-anchor="middle">prompt forward</text><rect x="690" y="65" width="230" height="66" rx="9" fill="#e0f4f0" stroke="#147f80" stroke-width="2"/><text x="805" y="92" font-size="16" text-anchor="middle">Decode worker</text><text x="805" y="114" font-size="16" text-anchor="middle">continue generation</text><rect x="330" y="260" width="230" height="66" rx="9" fill="#eee9f9" stroke="#7459a9" stroke-width="2"/><text x="445" y="287" font-size="16" text-anchor="middle">Source KV</text><text x="445" y="309" font-size="16" text-anchor="middle">plus metadata</text><rect x="690" y="260" width="230" height="66" rx="9" fill="#eee9f9" stroke="#7459a9" stroke-width="2"/><text x="805" y="287" font-size="16" text-anchor="middle">Destination KV</text><text x="805" y="309" font-size="16" text-anchor="middle">ready gate</text><text x="480" y="213" font-size="16" text-anchor="middle">虚线：协同请求与 bootstrap 控制</text><text x="625" y="280" font-size="16" text-anchor="middle">KV</text><text x="480" y="375" font-size="16" text-anchor="middle">传输、接收端分配、同步及失败处理都不可省略</text></g></svg>