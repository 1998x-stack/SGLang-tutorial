<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="t d"><title id="t">Prefill–Decode 分离的实例和 KV 转运</title><desc id="d">请求由 Router 分发到 Prefill Worker 计算 prompt KV，经传输路径送到 Decode Worker，再逐 token 返回；拆分后不能省掉计算和同步。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607a7b"/></marker></defs><rect width="960" height="380" rx="16" fill="#fbfdfc"/><text x="480" y="43" font-size="22" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#203b3f">两阶段不同实例：新增 KV transfer 与同步</text><text x="840" y="116" font-size="16" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#53666a">stream</text><text x="530" y="227" font-size="16" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#53666a">显式传输</text><text x="480" y="365" font-size="16" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#53666a">跨节点传输成本不能忽略；协议/设备依赖实际配置</text><path d="M247 139L281 139" fill="none" stroke="#c16b37" stroke-width="3"  marker-end="url(#arr)"/><path d="M504 139L543 139" fill="none" stroke="#7459a9" stroke-width="3"  marker-end="url(#arr)"/><path d="M766 139L917 139" fill="none" stroke="#147f80" stroke-width="3"  marker-end="url(#arr)"/><path d="M396 179L396 240" fill="none" stroke="#7459a9" stroke-width="3"  marker-end="url(#arr)"/><path d="M493 286L563 286" fill="none" stroke="#7459a9" stroke-width="3"  marker-end="url(#arr)"/><path d="M663 240L663 179" fill="none" stroke="#7459a9" stroke-width="3"  marker-end="url(#arr)"/><rect x="30" y="99" width="217" height="80" rx="12" fill="#f0f2f2" stroke="#81918f" stroke-width="2"/><text x="138.5" y="129" font-size="18" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#243e42">Router</text><text x="138.5" y="155" font-size="14" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#435a60">入口 / 路由</text><rect x="286" y="99" width="218" height="80" rx="12" fill="#fff0e4" stroke="#c16b37" stroke-width="2"/><text x="395" y="129" font-size="18" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#243e42">Prefill worker</text><text x="395" y="155" font-size="14" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#435a60">处理 prompt</text><rect x="548" y="99" width="218" height="80" rx="12" fill="#e0f4f0" stroke="#147f80" stroke-width="2"/><text x="657" y="129" font-size="18" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#243e42">Decode worker</text><text x="657" y="155" font-size="14" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#435a60">逐 token 解码</text><rect x="303" y="245" width="190" height="80" rx="12" fill="#eee9f9" stroke="#7459a9" stroke-width="2"/><text x="398" y="275" font-size="18" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#243e42">KV buffer A</text><text x="398" y="301" font-size="14" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#435a60">已构建 K/V</text><rect x="568" y="245" width="190" height="80" rx="12" fill="#eee9f9" stroke="#7459a9" stroke-width="2"/><text x="663" y="275" font-size="18" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#243e42">KV buffer B</text><text x="663" y="301" font-size="14" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#435a60">已接收 K/V</text></svg>