<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" role="img"><title>Level 2/3 的教学时间轴</title><desc>fork/end 与 chunk/interval 的位置不同；真实有 SWA 例外及软 cap。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="700" height="360" rx="10" fill="#faf9f5"/><g font-family="system-ui,sans-serif" fill="#243243"><text x="350" y="29" font-size="19" text-anchor="middle" font-weight="700">Level 2/3 的教学时间轴</text><rect x="25" y="75" width="195" height="55" rx="5" fill="#eee8fa" stroke="#7858ae"/><text x="122.5" y="97.5" font-size="16" text-anchor="middle">Level 2</text><text x="122.5" y="117.5" font-size="16" text-anchor="middle">fork / request end</text><rect x="480" y="75" width="195" height="55" rx="5" fill="#e0f4ef" stroke="#167b70"/><text x="577.5" y="97.5" font-size="16" text-anchor="middle">Level 3</text><text x="577.5" y="117.5" font-size="16" text-anchor="middle">+chunk / interval</text><path d="M85 155H595" stroke="#64748b" stroke-width="3"/><circle cx="85" cy="155" r="9" fill="#7fc8ba"/><circle cx="255" cy="155" r="9" fill="#7858ae"/><circle cx="425" cy="155" r="9" fill="#7fc8ba"/><circle cx="595" cy="155" r="9" fill="#7858ae"/><text x="85" y="187" font-size="15" text-anchor="middle">0</text><text x="255" y="187" font-size="15" text-anchor="middle">400</text><text x="425" y="187" font-size="15" text-anchor="middle">800</text><text x="595" y="187" font-size="15" text-anchor="middle">1200</text><text x="350" y="245" font-size="15" text-anchor="middle">Level 2: fork/end · Level 3: more grid points</text><text x="350" y="321" font-size="15" text-anchor="middle">SWA+linear hybrid 例外；软 cap ≠ hard bound</text></g></svg>