<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" role="img"><title>思考预算与多 token 结束序列</title><desc>预算耗尽时逐 token 强制终止，完整 marker 后切入 answer grammar。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="700" height="360" rx="10" fill="#faf9f5"/><g font-family="system-ui,sans-serif" fill="#243243"><text x="350" y="29" font-size="19" text-anchor="middle" font-weight="700">思考预算与多 token 结束序列</text><path d="M210 102H258" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M443 102H490" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M582 130V230" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M490 259H443" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M117 130V171H582V230" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#a)"/><rect x="25" y="75" width="185" height="55" rx="5" fill="#eee8fa" stroke="#7858ae"/><text x="117.5" y="97.5" font-size="16" text-anchor="middle">Thinking</text><text x="117.5" y="117.5" font-size="16" text-anchor="middle">n=0…3</text><rect x="258" y="75" width="185" height="55" rx="5" fill="#fff0dc" stroke="#b36b23"/><text x="350.5" y="97.5" font-size="16" text-anchor="middle">Budget exhausted</text><text x="350.5" y="117.5" font-size="16" text-anchor="middle">force token 90</text><rect x="490" y="75" width="185" height="55" rx="5" fill="#fff0dc" stroke="#b36b23"/><text x="582.5" y="97.5" font-size="16" text-anchor="middle">Terminator</text><text x="582.5" y="117.5" font-size="16" text-anchor="middle">force token 91</text><rect x="490" y="230" width="185" height="58" rx="5" fill="#e0f4ef" stroke="#167b70"/><text x="582.5" y="254" font-size="16" text-anchor="middle">Answer state</text><text x="582.5" y="274" font-size="16" text-anchor="middle">inner grammar</text><rect x="258" y="230" width="185" height="58" rx="5" fill="#eef1f4" stroke="#65758a"/><text x="350.5" y="254" font-size="16" text-anchor="middle">Finish / stop</text><text x="350.5" y="274" font-size="16" text-anchor="middle">total budget</text><text x="350" y="158" text-anchor="middle" font-size="15">可提前生成完整结束 marker（虚线）</text><text x="350" y="327" text-anchor="middle" font-size="15">教学 marker [90,91]；真实 IDs 由 parser/tokenizer 确定</text></g></svg>