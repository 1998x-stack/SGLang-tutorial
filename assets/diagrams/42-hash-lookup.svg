<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" role="img"><title>从 N-gram 窗口到静态记忆行</title><desc>压缩 ID、乘法、XOR 与 modulus 决定 row；示例只演示一个 hash head。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="700" height="360" rx="10" fill="#faf9f5"/><g font-family="system-ui,sans-serif" fill="#243243"><text x="350" y="29" font-size="19" text-anchor="middle" font-weight="700">从 N-gram 窗口到静态记忆行</text><path d="M210 95H258" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M443 95H490" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M582 123V220" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M490 247H443" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M258 247H210" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><rect x="25" y="68" width="185" height="55" rx="5" fill="#eef1f4" stroke="#65758a"/><text x="117.5" y="90.5" font-size="16" text-anchor="middle">Token window</text><text x="117.5" y="110.5" font-size="16" text-anchor="middle">[3,5]</text><rect x="258" y="68" width="185" height="55" rx="5" fill="#fff0dc" stroke="#b36b23"/><text x="350.5" y="90.5" font-size="16" text-anchor="middle">Multiply</text><text x="350.5" y="110.5" font-size="16" text-anchor="middle">21, 55</text><rect x="490" y="68" width="185" height="55" rx="5" fill="#fff0dc" stroke="#b36b23"/><text x="582.5" y="100.5" font-size="16" text-anchor="middle">XOR = 34</text><rect x="490" y="220" width="185" height="55" rx="5" fill="#fff0dc" stroke="#b36b23"/><text x="582.5" y="252.5" font-size="16" text-anchor="middle">mod 13 = 8</text><rect x="258" y="220" width="185" height="55" rx="5" fill="#eee8fa" stroke="#7858ae"/><text x="350.5" y="242.5" font-size="16" text-anchor="middle">offset + 100</text><text x="350.5" y="262.5" font-size="16" text-anchor="middle">row 108</text><rect x="25" y="220" width="185" height="55" rx="5" fill="#e0f4ef" stroke="#167b70"/><text x="117.5" y="242.5" font-size="16" text-anchor="middle">Embedding row</text><text x="117.5" y="262.5" font-size="16" text-anchor="middle">gated into state</text><text x="350" y="170" text-anchor="middle" font-size="15">示例只代表单个 n-gram hash head</text><text x="350" y="320" text-anchor="middle" font-size="15">row ID ≠ 相似度检索</text></g></svg>