<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="g26b-title g26b-desc"><title id="g26b-title">XGrammar vocabulary partition</title><desc id="g26b-desc">Vocabulary checks are split into context-independent prechecked tokens and context-dependent tokens evaluated against the current parser stack.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#527b79"/></marker></defs><rect width="1080" height="560" rx="18" fill="#fbfdfc"/><path d="M 285 245 L 360 150" stroke="#527b79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 285 275 L 360 400" stroke="#527b79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 620 150 L 725 150" stroke="#527b79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 620 400 L 725 400" stroke="#527b79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 865 225 L 865 330" stroke="#527b79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g><rect x="55" y="190" width="230" height="145" rx="15" fill="#edf5f3" stroke="#477d78" stroke-width="2"/><text x="170" y="221" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">Vocabulary</text><text x="170" y="246" text-anchor="middle" font-size="15" fill="#35585a">All token IDs</text></g><g><rect x="360" y="80" width="260" height="145" rx="15" fill="#eaf4f1" stroke="#477d78" stroke-width="2"/><text x="490" y="111" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">Context-independent</text><text x="490" y="136" text-anchor="middle" font-size="15" fill="#35585a">Prechecked token class</text></g><g><rect x="360" y="330" width="260" height="145" rx="15" fill="#fff3e9" stroke="#c98246" stroke-width="2"/><text x="490" y="361" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">Context-dependent</text><text x="490" y="386" text-anchor="middle" font-size="15" fill="#35585a">Runtime stack checks</text></g><g><rect x="725" y="80" width="285" height="145" rx="15" fill="#f3f0fb" stroke="#7564a0" stroke-width="2"/><text x="867.5" y="111" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">Cached token table</text><text x="867.5" y="136" text-anchor="middle" font-size="15" fill="#35585a">Fast mask contribution</text></g><g><rect x="725" y="330" width="285" height="145" rx="15" fill="#f3f0fb" stroke="#7564a0" stroke-width="2"/><text x="867.5" y="361" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">Persistent stack</text><text x="867.5" y="386" text-anchor="middle" font-size="15" fill="#35585a">Current grammar state</text></g></svg>