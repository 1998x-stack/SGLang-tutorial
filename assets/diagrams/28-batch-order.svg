<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="g28a-title g28a-desc"><title id="g28a-title">Dynamic batch changes reduction order</title><desc id="g28a-desc">The same request can be reduced through different floating-point groupings when batch shapes or tile layouts change.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#527b79"/></marker></defs><rect width="1080" height="560" rx="18" fill="#fbfdfc"/><path d="M 245 267 L 335 130" stroke="#527b79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 245 267 L 335 420" stroke="#527b79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 575 130 L 700 130" stroke="#527b79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 575 420 L 700 420" stroke="#527b79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g><rect x="45" y="210" width="200" height="120" rx="15" fill="#edf5f3" stroke="#477d78" stroke-width="2"/><text x="145" y="241" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">Same request</text><text x="145" y="266" text-anchor="middle" font-size="15" fill="#35585a">Same input vector</text></g><g><rect x="335" y="65" width="240" height="130" rx="15" fill="#f3f0fb" stroke="#7564a0" stroke-width="2"/><text x="455" y="96" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">Batch A</text><text x="455" y="121" text-anchor="middle" font-size="15" fill="#35585a">Reduction: (a+b)+c</text></g><g><rect x="335" y="355" width="240" height="130" rx="15" fill="#fff3e9" stroke="#c98246" stroke-width="2"/><text x="455" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">Batch B</text><text x="455" y="411" text-anchor="middle" font-size="15" fill="#35585a">Reduction: a+(b+c)</text></g><g><rect x="700" y="65" width="300" height="130" rx="15" fill="#eaf4f1" stroke="#477d78" stroke-width="2"/><text x="850" y="96" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">Logits A</text><text x="850" y="121" text-anchor="middle" font-size="15" fill="#35585a">Rounded accumulation</text></g><g><rect x="700" y="355" width="300" height="130" rx="15" fill="#fff3e9" stroke="#c98246" stroke-width="2"/><text x="850" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">Logits B</text><text x="850" y="411" text-anchor="middle" font-size="15" fill="#35585a">Slightly different</text></g></svg>