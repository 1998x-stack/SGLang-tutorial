<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" role="img"><title>异步动态分词的队列与 future</title><desc>相同 kwargs 可批处理；空队列时立即执行，避免固定等待。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="700" height="360" rx="10" fill="#faf9f5"/><g font-family="system-ui,sans-serif" fill="#243243"><text x="350" y="29" font-size="19" text-anchor="middle" font-weight="700">异步动态分词的队列与 future</text><path d="M210 94H258" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M443 94H490" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M582 123V220" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#a)"/><path d="M490 249H443" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M350 123V220" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M258 249H210" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><rect x="25" y="65" width="185" height="58" rx="5" fill="#eef1f4" stroke="#65758a"/><text x="117.5" y="89" font-size="16" text-anchor="middle">Async requests</text><text x="117.5" y="109" font-size="16" text-anchor="middle">future A / B / C</text><rect x="258" y="65" width="185" height="58" rx="5" fill="#fff0dc" stroke="#b36b23"/><text x="350.5" y="89" font-size="16" text-anchor="middle">Queue + batcher</text><text x="350.5" y="109" font-size="16" text-anchor="middle">size / deadline</text><rect x="490" y="65" width="185" height="58" rx="5" fill="#e0f4ef" stroke="#167b70"/><text x="582.5" y="89" font-size="16" text-anchor="middle">Same kwargs?</text><text x="582.5" y="109" font-size="16" text-anchor="middle">yes: batch</text><rect x="490" y="220" width="185" height="58" rx="5" fill="#eef1f4" stroke="#65758a"/><text x="582.5" y="244" font-size="16" text-anchor="middle">Different kwargs</text><text x="582.5" y="264" font-size="16" text-anchor="middle">individual encode</text><rect x="258" y="220" width="185" height="58" rx="5" fill="#eee8fa" stroke="#7858ae"/><text x="350.5" y="244" font-size="16" text-anchor="middle">Single-thread</text><text x="350.5" y="264" font-size="16" text-anchor="middle">executor</text><rect x="25" y="220" width="185" height="58" rx="5" fill="#e0f4ef" stroke="#167b70"/><text x="117.5" y="244" font-size="16" text-anchor="middle">Resolve futures</text><text x="117.5" y="264" font-size="16" text-anchor="middle">per request</text><text x="350" y="174" text-anchor="middle" font-size="15">空队列时立即处理；积压时收集</text><text x="350" y="322" text-anchor="middle" font-size="15">阻塞 tokenizer 不直接占用 event loop</text></g></svg>