<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" role="img"><title>四步 detach 与失败分支</title><desc>先 drain，stop threads 后再 release，最后 drain；stop 失败保留状态。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="700" height="360" rx="10" fill="#faf9f5"/><g font-family="system-ui,sans-serif" fill="#243243"><text x="350" y="29" font-size="19" text-anchor="middle" font-weight="700">四步 detach 与失败分支</text><path d="M215 92H255" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><path d="M445 92H485" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><path d="M582 120V228" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><path d="M350 120V228" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="65" width="195" height="55" rx="5" fill="#eee8fa" stroke="#7858ae"/><text x="117.5" y="87.5" font-size="16" text-anchor="middle">1 Drain</text><text x="117.5" y="107.5" font-size="16" text-anchor="middle">control queues</text><rect x="255" y="65" width="190" height="55" rx="5" fill="#fff0dc" stroke="#b36b23"/><text x="350" y="87.5" font-size="16" text-anchor="middle">2 Stop</text><text x="350" y="107.5" font-size="16" text-anchor="middle">storage threads</text><rect x="485" y="65" width="195" height="55" rx="5" fill="#e0f4ef" stroke="#167b70"/><text x="582.5" y="87.5" font-size="16" text-anchor="middle">3 Release</text><text x="582.5" y="107.5" font-size="16" text-anchor="middle">pending operations</text><rect x="485" y="228" width="195" height="55" rx="5" fill="#e0f4ef" stroke="#167b70"/><text x="582.5" y="250.5" font-size="16" text-anchor="middle">4 Drain again</text><text x="582.5" y="270.5" font-size="16" text-anchor="middle">return host pages</text><rect x="255" y="228" width="190" height="55" rx="5" fill="#eef1f4" stroke="#65758a"/><text x="350" y="250.5" font-size="16" text-anchor="middle">Stop failed</text><text x="350" y="270.5" font-size="16" text-anchor="middle">preserve bookkeeping</text><text x="350" y="172" font-size="15" text-anchor="middle">失败分支保留 ack / pending 映射</text><text x="350" y="325" font-size="15" text-anchor="middle">停止使用 L3 不等于删除远端数据</text></g></svg>