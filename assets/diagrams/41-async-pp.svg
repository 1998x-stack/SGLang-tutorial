<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" role="img"><title>PP metadata、forward 与异步通信</title><desc>send work 与等待分离；在消费和缓冲复用前建立依赖。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="700" height="360" rx="10" fill="#faf9f5"/><g font-family="system-ui,sans-serif" fill="#243243"><text x="350" y="29" font-size="19" text-anchor="middle" font-weight="700">PP metadata、forward 与异步通信</text><path d="M215 92H255" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M445 92H485" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M215 242H255" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M445 242H485" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M120 120V215" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#a)"/><rect x="25" y="65" width="190" height="55" rx="5" fill="#eef1f4" stroke="#65758a"/><text x="120" y="87.5" font-size="16" text-anchor="middle">CPU scheduler</text><text x="120" y="107.5" font-size="16" text-anchor="middle">prepare metadata</text><rect x="255" y="65" width="190" height="55" rx="5" fill="#fff0dc" stroke="#b36b23"/><text x="350" y="87.5" font-size="16" text-anchor="middle">async send</text><text x="350" y="107.5" font-size="16" text-anchor="middle">P2PWork handle</text><rect x="485" y="65" width="190" height="55" rx="5" fill="#e0f4ef" stroke="#167b70"/><text x="580" y="87.5" font-size="16" text-anchor="middle">Next stage</text><text x="580" y="107.5" font-size="16" text-anchor="middle">wait before use</text><rect x="25" y="215" width="190" height="55" rx="5" fill="#fff0dc" stroke="#b36b23"/><text x="120" y="237.5" font-size="16" text-anchor="middle">forward stream</text><text x="120" y="257.5" font-size="16" text-anchor="middle">GPU microbatch</text><rect x="255" y="215" width="190" height="55" rx="5" fill="#eee8fa" stroke="#7858ae"/><text x="350" y="237.5" font-size="16" text-anchor="middle">copy stream</text><text x="350" y="257.5" font-size="16" text-anchor="middle">D2H result</text><rect x="485" y="215" width="190" height="55" rx="5" fill="#e0f4ef" stroke="#167b70"/><text x="580" y="237.5" font-size="16" text-anchor="middle">CPU result</text><text x="580" y="257.5" font-size="16" text-anchor="middle">process previous</text><text x="350" y="164" text-anchor="middle" font-size="15">通信与计算可重叠；send buffer 复用前必须完成</text><text x="350" y="312" text-anchor="middle" font-size="15">不同 streams 仍需事件依赖</text></g></svg>