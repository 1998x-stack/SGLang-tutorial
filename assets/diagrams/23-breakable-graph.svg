<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc"><title id="title">Breakable CUDA Graph 把动态算子放在多个 captured segments 之间</title><desc id="desc">A breakable graph replays graph segment one, runs the marked eager operation against stable buffers, then replays the next graph segment. The break preserves compatible regions without pretending dynamic host work is captured.</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#627c7c"/></marker></defs><rect width="1000" height="470" rx="16" fill="#fbfdfc"/><text x="500" y="42" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#203b40">Breakable：不是“半个 Graph”，而是 Graph / Eager 的有序拼接</text><rect x="45" y="150" width="190" height="100" rx="12" fill="#e2f4f0" stroke="#147f80" stroke-width="2"/><text x="140" y="180" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Segment 1</text><text x="140" y="205" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">captured graph</text><rect x="285" y="150" width="190" height="100" rx="12" fill="#fff0e4" stroke="#bd6738" stroke-width="2"/><text x="380" y="180" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Eager break</text><text x="380" y="205" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">dynamic / sync op</text><rect x="525" y="150" width="190" height="100" rx="12" fill="#e2f4f0" stroke="#147f80" stroke-width="2"/><text x="620" y="180" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Segment 2</text><text x="620" y="205" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">captured graph</text><rect x="765" y="150" width="190" height="100" rx="12" fill="#e2f4f0" stroke="#147f80" stroke-width="2"/><text x="860" y="180" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Segment 3</text><text x="860" y="205" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">captured graph</text><path d="M235 200 L280 200" fill="none" stroke="#627c7c" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M475 200 L520 200" fill="none" stroke="#627c7c" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M715 200 L760 200" fill="none" stroke="#627c7c" stroke-width="2.5"  marker-end="url(#arr)"/><text x="380" y="300" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#8e4d2b">host-side function</text><text x="620" y="300" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#147f80">static output buffer</text><text x="500" y="390" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#8e4d2b">每个 break 有 launch / Python call / capture boundary 成本</text><text x="500" y="440" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#627274">只有 graph-safe 区域获得 replay 收益；调试模式全 eager 不等于加速</text></svg>