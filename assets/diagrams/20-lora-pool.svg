<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">Multi-LoRA GPU slot pool with pinning and eviction</title><desc id="d">The base None slot, pinned adapters and ordinary LRU slots share a finite GPU pool. Eviction can select only eligible unpinned slots; pinned count is limited to max_loras_per_batch minus one.</desc><rect width="1200" height="500" rx="20" fill="#fffdf9"/><text x="40" y="45" font-family="system-ui" font-size="24" font-weight="700" fill="#20363b">GPU slots are a finite working set, not the CPU adapter catalogue</text><g font-family="system-ui" text-anchor="middle"><rect x="70" y="135" width="245" height="190" rx="14" fill="#fff0e6" stroke="#b75c31" stroke-width="2"/><text x="192" y="175" font-size="20" font-weight="700" fill="#b75c31">Slot 0</text><text x="192" y="220" font-size="22" font-weight="700" fill="#b75c31">None</text><text x="192" y="260" font-size="16" fill="#53646b">base model</text><text x="192" y="292" font-size="15" fill="#53646b">reserved distinct ID</text><rect x="365" y="135" width="245" height="190" rx="14" fill="#eee9f7" stroke="#7059aa" stroke-width="2"/><text x="487" y="175" font-size="20" font-weight="700" fill="#7059aa">Slot 1</text><text x="487" y="220" font-size="22" font-weight="700" fill="#7059aa">Adapter A</text><text x="487" y="260" font-size="16" fill="#53646b">PINNED</text><text x="487" y="292" font-size="15" fill="#53646b">not evictable</text><rect x="660" y="135" width="245" height="190" rx="14" fill="#d8efeb" stroke="#147f80" stroke-width="2"/><text x="782" y="175" font-size="20" font-weight="700" fill="#147f80">Slot 2</text><text x="782" y="220" font-size="22" font-weight="700" fill="#147f80">Adapter B</text><text x="782" y="260" font-size="16" fill="#53646b">LRU candidate</text><text x="782" y="292" font-size="15" fill="#53646b">evict if eligible</text><rect x="955" y="135" width="190" height="190" rx="14" fill="#f0f1ef" stroke="#8b9693" stroke-width="2"/><text x="1050" y="175" font-size="20" font-weight="700" fill="#53646b">CPU pool</text><text x="1050" y="220" font-size="18" fill="#53646b">loaded adapters</text><text x="1050" y="260" font-size="15" fill="#53646b">separate capacity</text></g><path d="M1050 325V385H782V325" stroke="#147f80" stroke-width="3" fill="none"/><text x="600" y="430" font-family="system-ui" font-size="17" font-weight="700" fill="#7059aa" text-anchor="middle">Pinned adapters ≤ max_loras_per_batch − 1</text><text x="600" y="465" font-family="system-ui" font-size="15" fill="#53646b" text-anchor="middle">Keep one slot available for unpinned requests; CPU residency does not imply GPU residency.</text></svg>