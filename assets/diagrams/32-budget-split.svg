<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" role="img"><title>双池预算与两个瓶颈</title><desc>同一 120 MiB 预算下，增加 state 份额可提高状态槽并发，却减少 token 容量。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="700" height="360" rx="12" fill="#faf9f5"/><g font-family="system-ui, sans-serif" fill="#243243"><text x="350" y="28" text-anchor="middle" font-size="19" font-weight="700">双池预算与两个瓶颈</text><path d="M140 110V145" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><path d="M140 197V223" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="35" y="65" width="630" height="45" rx="7" fill="#eef1f4" stroke="#65758a" stroke-width="1.5"/><text x="350" y="92.5" font-size="16" text-anchor="middle">总预算 120 MiB（教学）</text><rect x="35" y="145" width="210" height="52" rx="7" fill="#eee8fa" stroke="#7858ae" stroke-width="1.5"/><text x="140" y="176" font-size="16" text-anchor="middle">r=0.5 · state 40</text><rect x="245" y="145" width="420" height="52" rx="7" fill="#e0f4ef" stroke="#167b70" stroke-width="1.5"/><text x="455" y="176" font-size="16" text-anchor="middle">KV 80 · 320 tokens</text><rect x="35" y="223" width="420" height="52" rx="7" fill="#eee8fa" stroke="#7858ae" stroke-width="1.5"/><text x="245" y="254" font-size="16" text-anchor="middle">r=2 · state 80</text><rect x="455" y="223" width="210" height="52" rx="7" fill="#e0f4ef" stroke="#167b70" stroke-width="1.5"/><text x="560" y="254" font-size="16" text-anchor="middle">KV 40 · 160 tokens</text><text x="350" y="132" font-size="15" text-anchor="middle">状态槽与 KV 竞争同一预算</text><text x="350" y="212" font-size="15" text-anchor="middle">增大 state 比例</text><text x="350" y="310" font-size="15" text-anchor="middle">并发上界：5 → 10；KV 容量：320 → 160</text></g></svg>