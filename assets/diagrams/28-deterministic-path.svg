<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="g28b-title g28b-desc"><title id="g28b-title">Batch-invariant deterministic execution path</title><desc id="g28b-desc">Request-specific sampling state and batch-invariant operations constrain numerical execution while the scheduler can still form dynamic batches.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#527b79"/></marker></defs><rect width="1080" height="560" rx="18" fill="#fbfdfc"/><path d="M 225 267 L 275 267" stroke="#527b79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 485 267 L 535 267" stroke="#527b79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 745 267 L 795 267" stroke="#527b79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 905 267 L 950 267" stroke="#527b79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g><rect x="35" y="205" width="190" height="125" rx="15" fill="#f3f0fb" stroke="#7564a0" stroke-width="2"/><text x="130" y="236" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">Request state</text><text x="130" y="261" text-anchor="middle" font-size="15" fill="#35585a">Prompt + seed</text></g><g><rect x="275" y="205" width="210" height="125" rx="15" fill="#edf5f3" stroke="#477d78" stroke-width="2"/><text x="380" y="236" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">Scheduler</text><text x="380" y="261" text-anchor="middle" font-size="15" fill="#35585a">Dynamic batch</text></g><g><rect x="535" y="205" width="210" height="125" rx="15" fill="#eaf4f1" stroke="#477d78" stroke-width="2"/><text x="640" y="236" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">Invariant ops</text><text x="640" y="261" text-anchor="middle" font-size="15" fill="#35585a">Fixed reduction</text></g><g><rect x="795" y="205" width="110" height="125" rx="15" fill="#eaf4f1" stroke="#477d78" stroke-width="2"/><text x="850" y="236" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">Logits</text><text x="850" y="261" text-anchor="middle" font-size="15" fill="#35585a">Stable</text></g><g><rect x="950" y="205" width="100" height="125" rx="15" fill="#fff3e9" stroke="#c98246" stroke-width="2"/><text x="1000" y="236" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">Sampler</text><text x="1000" y="261" text-anchor="middle" font-size="15" fill="#35585a">Seeded</text></g></svg>