<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc"><title id="title">KV cache 的有效压缩比要计入 scale 和 workspace</title><desc id="desc">For the documented native NVFP4 recipe, each scalar uses 0.5 bytes packed FP4 plus 1/16 byte scale storage, compared with 2 bytes BF16; auxiliary prefill workspace can change actual capacity.</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#627c7c"/></marker></defs><rect width="1000" height="470" rx="16" fill="#fbfdfc"/><text x="500" y="42" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#203b40">按每个 KV scalar 计算：数据位宽之外还有 scale</text><rect x="80" y="130" width="230" height="120" rx="12" fill="#f0f3f2" stroke="#81918f" stroke-width="2"/><text x="195" y="160" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">BF16</text><text x="195" y="185" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">2.00 bytes / scalar</text><rect x="385" y="130" width="230" height="120" rx="12" fill="#e2f4f0" stroke="#147f80" stroke-width="2"/><text x="500" y="160" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">FP8</text><text x="500" y="185" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">1.00 byte + scale</text><rect x="690" y="130" width="230" height="120" rx="12" fill="#eee9f8" stroke="#7258a8" stroke-width="2"/><text x="805" y="160" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">NVFP4</text><text x="805" y="185" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">0.50 + 0.0625 bytes</text><text x="195" y="300" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#627274">1.00× baseline</text><text x="500" y="300" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#147f80">&lt; 2× raw ratio</text><text x="805" y="300" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#7258a8">2 / 0.5625 ≈ 3.56×</text><path d="M195 255 L195 280" fill="none" stroke="#81918f" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M500 255 L500 280" fill="none" stroke="#147f80" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M805 255 L805 280" fill="none" stroke="#7258a8" stroke-width="2.5"  marker-end="url(#arr)"/><text x="500" y="390" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#8e4d2b">理论 token capacity multiplier ≠ 端到端吞吐提升</text><text x="500" y="440" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#627274">真实容量还受 KV layout、scale buffer、workspace 与 backend 约束</text></svg>