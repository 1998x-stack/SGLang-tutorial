<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" role="img"><title>PD direct-to-host 与 layer 预取</title><desc>Prefill 的可卸载 KV 先入 Decode Host；anchor 产生 miss plan，后续层可提前搬运，消费前等待。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="700" height="360" rx="12" fill="#faf9f5"/><g font-family="system-ui, sans-serif" fill="#243243"><text x="350" y="28" text-anchor="middle" font-size="19" font-weight="700">PD direct-to-host 与 layer 预取</text><path d="M205 90H260" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><path d="M440 90H495" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><path d="M585 117V164H115V210" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><path d="M205 241H260" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><path d="M440 241H495" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="25" y="63" width="180" height="54" rx="7" fill="#fff0dc" stroke="#b36b23" stroke-width="1.5"/><text x="115" y="84.5" font-size="16" text-anchor="middle">Prefill GPU</text><text x="115" y="105.5" font-size="16" text-anchor="middle">eligible KV</text><rect x="260" y="63" width="180" height="54" rx="7" fill="#eee8fa" stroke="#7858ae" stroke-width="1.5"/><text x="350" y="84.5" font-size="16" text-anchor="middle">Decode Host</text><text x="350" y="105.5" font-size="16" text-anchor="middle">pinned pool</text><rect x="495" y="63" width="180" height="54" rx="7" fill="#eee8fa" stroke="#7858ae" stroke-width="1.5"/><text x="585" y="84.5" font-size="16" text-anchor="middle">GPU hot buffer</text><text x="585" y="105.5" font-size="16" text-anchor="middle">当前层</text><rect x="25" y="210" width="180" height="62" rx="7" fill="#fff0dc" stroke="#b36b23" stroke-width="1.5"/><text x="115" y="235.5" font-size="16" text-anchor="middle">Anchor layer</text><text x="115" y="256.5" font-size="16" text-anchor="middle">index + plan</text><rect x="260" y="210" width="180" height="62" rx="7" fill="#fff0dc" stroke="#b36b23" stroke-width="1.5"/><text x="350" y="235.5" font-size="16" text-anchor="middle">Side stream</text><text x="350" y="256.5" font-size="16" text-anchor="middle">copy-only replay</text><rect x="495" y="210" width="180" height="62" rx="7" fill="#e0f4ef" stroke="#167b70" stroke-width="1.5"/><text x="585" y="235.5" font-size="16" text-anchor="middle">Skip layer</text><text x="585" y="256.5" font-size="16" text-anchor="middle">wait → attention</text><text x="232" y="77" font-size="15" text-anchor="middle">RDMA</text><text x="467" y="77" font-size="15" text-anchor="middle">换入</text><text x="350" y="300" font-size="15" text-anchor="middle">可重叠，不可省略消费前同步</text></g></svg>