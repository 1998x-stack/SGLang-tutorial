<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 465" role="img" aria-labelledby="title desc"><title id="title">链式拒绝采样与树形 Block Verification 是不同验证路径</title><desc id="desc">链式标准 speculative sampling 逐个验证候选，拒绝时从 residual distribution 修正；树形 block verification 可按候选树检查前缀并采用对应修正分布。SGLang 对应功能有明确配置约束。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#627c7c"/></marker></defs><rect width="1000" height="465" rx="17" fill="#fbfdfc"/><text x="500" y="40" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#203b40">先区分“链式拒绝”与“树形块验证”</text><text x="250" y="95" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#203b40">Chain · topk = 1</text><rect x="55" y="125" width="155" height="75" rx="13" fill="#fff0e4" stroke="#bd6738" stroke-width="2"/><text x="132.5" y="155" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Draft x₁</text><text x="132.5" y="182" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">q(x₁)</text><rect x="285" y="125" width="155" height="75" rx="13" fill="#fff0e4" stroke="#bd6738" stroke-width="2"/><text x="362.5" y="155" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Draft x₂</text><text x="362.5" y="182" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">q(x₂)</text><rect x="515" y="125" width="155" height="75" rx="13" fill="#fff0e4" stroke="#bd6738" stroke-width="2"/><text x="592.5" y="155" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Draft x₃</text><text x="592.5" y="182" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">q(x₃)</text><path d="M210 162 L280 162" fill="none" stroke="#bd6738" stroke-width="2.7"  marker-end="url(#arrow)"/><path d="M440 162 L510 162" fill="none" stroke="#bd6738" stroke-width="2.7"  marker-end="url(#arrow)"/><text x="250" y="240" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#627274">逐 token 接受；首个拒绝后从 residual 分布采样</text><text x="750" y="95" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#203b40">Tree · topk &gt; 1</text><rect x="690" y="125" width="135" height="70" rx="13" fill="#f0f3f2" stroke="#81918f" stroke-width="2"/><text x="757.5" y="155" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">root</text><text x="757.5" y="182" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">target state</text><rect x="600" y="235" width="120" height="65" rx="13" fill="#eee9f8" stroke="#7258a8" stroke-width="2"/><text x="660" y="265" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">a</text><text x="660" y="292" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">branch 1</text><rect x="765" y="235" width="120" height="65" rx="13" fill="#eee9f8" stroke="#7258a8" stroke-width="2"/><text x="825" y="265" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="m