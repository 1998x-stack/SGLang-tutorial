<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc"><title id="title">Token-wise rejection 与 Block verification 的区别</title><desc id="desc">左侧链式逐 token rejection 在首个拒绝后停止并从 residual distribution 修正；右侧 block verification 检查每个 draft prefix，按 correction 规则保留最长可接受前缀。图中不把 block verification 误标为 topk 大于一的树形路径。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#627c7c"/></marker></defs><rect width="1000" height="480" rx="17" fill="#fbfdfc"/><text x="500" y="40" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#203b40">同一条 draft chain，可以使用不同的验证 / 修正规则</text><rect x="25" y="65" width="455" height="365" rx="15" fill="#f8faf9" stroke="#d5dfdc"/><rect x="520" y="65" width="455" height="365" rx="15" fill="#f8faf9" stroke="#d5dfdc"/><text x="252" y="100" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#203b40">Token-wise rejection</text><text x="252" y="126" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" text-anchor="middle" fill="#627274">chain draft · topk = 1</text><rect x="55" y="155" width="110" height="64" rx="10" fill="#fff0e4" stroke="#bd6738" stroke-width="2"/><text x="110" y="181" font-family="system-ui" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">x₁</text><text x="110" y="204" font-family="system-ui" font-size="14" text-anchor="middle" fill="#8e4d2b">draft q</text><rect x="195" y="155" width="110" height="64" rx="10" fill="#fff0e4" stroke="#bd6738" stroke-width="2"/><text x="250" y="181" font-family="system-ui" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">x₂</text><text x="250" y="204" font-family="system-ui" font-size="14" text-anchor="middle" fill="#8e4d2b">draft q</text><rect x="335" y="155" width="110" height="64" rx="10" fill="#f0f3f2" stroke="#81918f" stroke-width="2" stroke-dasharray="5 4"/><text x="390" y="181" font-family="system-ui" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">x₃</text><text x="390" y="204" font-family="system-ui" font-size="14" text-anchor="middle" fill="#627274">not reached</text><path d="M165 187L190 187M305 187L330 187" fill="none" stroke="#bd6738" stroke-width="2.7" marker-end="url(#arrow)"/><rect x="55" y="265" width="110" height="60" rx="9" fill="#e2f4f0" stroke="#147f80" stroke-width="2"/><text x="110" y="290" font-family="system-ui" font-size="16" font-weight="700" text-anchor="middle" fill="#176f70">accept x₁</text><text x="110" y="312" font-family="system-ui" font-size="14" text-anchor="middle" fill="#4a7774">p / q test</text><rect x="195" y="265" width="110" height="60" rx="9" fill="#fff0e4" stroke="#bd6738" stroke-width="2"/><text x="250" y="290" font-family="system-ui" font-size="16" font-weight="700" text-anchor="middle" fill="#8e4d2b">reject x₂</text><text x="250" y="312" font-family="system-ui" font-size="14" text-anchor="middle" fill="#8e4d2b">stop chain</text><rect x="335" y="265" width="110" height="60" rx="9" fill="#eee9f8" stroke="#7258a8" stroke-width="2"/><text x="390" y="290" font-family="system-ui" font-size="16" font-weight="700" text-anchor="middle" fill="#7258a8">sample r(v)</text><text x="390" y="312" font-family="system-ui" font-size="14" text-anchor="middle" fill="#7258a8">correction</text><path d="M110 220L110 260M250 220L250 260M305 295L330 295" fill="none" stroke="#627c7c" stroke-width="2.3" marker-end="url(#arrow)"/><text x="252" y="382" font-family="system-ui" font-size="14" text-anchor="middle" fill="#627274">首个拒绝后不再验证后续 draft token</text><text x="747" y="100" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#203b40">Block verification</text><text x="747" y="126" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" text-anchor="middle" fill="#627274">documented stochastic modes · topk = 1</text><rect x="560" y="155" width="100" height="58" rx="9" fill="#fff0e4" stroke="#bd6738" stroke-width="2"/><text x="610" y="180" font-family="system-ui" font-size="17" font-weight="700" text-anchor="middle" fill="#203b40">x₁</text><text x="610" y="200" font-family="system-ui" font-size="14" text-anchor="middle" fill="#8e4d2b">draft</text><rect x="700" y="155" width="100" height="58" rx="9" fill="#fff0e4" stroke="#bd6738" stroke-width="2"/><text x="750" y="180" font-family="system-ui" font-size="17" font-weight="700" text-anchor="middle" fill="#203b40">x₂</text><text x="750" y="200" font-family="system-ui" font-size="14" text-anchor="middle" fill="#8e4d2b">draft</text><rect x="840" y="155" width="100" height="58" rx="9" fill="#fff0e4" stroke="#bd6738" stroke-width="2"/><text x="890" y="180" font-family="system-ui" font-size="17" font-weight="700" text-anchor="middle" fill="#203b40">x₃</text><text x="890" y="200" font-family="system-ui" font-size="14" text-anchor="middle" fill="#8e4d2b">draft</text><path d="M660 184L695 184M800 184L835 184" fill="none" stroke="#bd6738" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="555" y="255" width="115" height="68" rx="9" fill="#f0f3f2" stroke="#81918f"/><text x="612.5" y="281" font-family="system-ui" font-size="15" font-weight="700" text-anchor="middle" fill="#203b40">prefix 1</text><text x="612.5" y="304" font-family="system-ui" font-size="14" text-anchor="middle" fill="#627274">check</text><rect x="695" y="255" width="115" height="68" rx="9" fill="#e2f4f0" stroke="#147f80" stroke-width="2"/><text x="752.5" y="281" font-family="system-ui" font-size="15" font-weight="700" text-anchor="middle" fill="#176f70">prefix 2</text><text x="752.5" y="304" font-family="system-ui" font-size="14" text-anchor="middle" fill="#4a7774">accepted</text><rect x="835" y="255" width="115" height="68" rx="9" fill="#f0f3f2" stroke="#81918f"/><text x="892.5" y="281" font-family="system-ui" font-size="15" font-weight="700" text-anchor="middle" fill="#203b40">prefix 3</text><text x="892.5" y="304" font-family="system-ui" font-size="14" text-anchor="middle" fill="#627274">check</text><path d="M610 214L612 250M750 214L752 250M890 214L892 250" fill="none" stroke="#627c7c" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="635" y="350" width="225" height="54" rx="10" fill="#eee9f8" stroke="#7258a8" stroke-width="2"/><text x="747.5" y="373" font-family="system-ui" font-size="15" font-weight="700" text-anchor="middle" fill="#7258a8">longest accepted prefix</text><text x="747.5" y="393" font-family="system-ui" font-size="14" text-anchor="middle" fill="#7258a8">+ correction distribution</text><path d="M752 325L752 345" fill="none" stroke="#147f80" stroke-width="2.7" marker-end="url(#arrow)"/><text x="747" y="445" font-family="system-ui" font-size="14" text-anchor="middle" fill="#627274">checks all prefixes; correction follows the block algorithm</text><text x="500" y="470" font-family="system-ui" font-size="14" font-weight="700" text-anchor="middle" fill="#203b40">Block ≠ topk &gt; 1 tree; verify exact flag / model / device compatibility.</text></svg>