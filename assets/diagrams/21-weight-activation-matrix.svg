<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc"><title id="title">Weight bits 与 activation bits 是两个独立维度</title><desc id="desc">W4A16 means 4-bit stored weights with 16-bit activations; W8A8 uses 8-bit weights and activations; FP8/FP4 recipes can have different scale layouts and hardware kernel contracts.</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#627c7c"/></marker></defs><rect width="1000" height="470" rx="16" fill="#fbfdfc"/><text x="500" y="42" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#203b40">W/A 表示法：先问权重如何存，再问激活如何算</text><rect x="60" y="115" width="260" height="90" rx="12" fill="#fff0e4" stroke="#bd6738" stroke-width="2"/><text x="190" y="145" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">W4A16</text><text x="190" y="170" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">4-bit weights · 16-bit activations</text><rect x="370" y="115" width="260" height="90" rx="12" fill="#e2f4f0" stroke="#147f80" stroke-width="2"/><text x="500" y="145" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">W8A8</text><text x="500" y="170" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">8-bit weights · 8-bit activations</text><rect x="680" y="115" width="260" height="90" rx="12" fill="#eee9f8" stroke="#7258a8" stroke-width="2"/><text x="810" y="145" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">FP8 W8A8</text><text x="810" y="170" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">floating-point scales</text><rect x="60" y="285" width="260" height="90" rx="12" fill="#f0f3f2" stroke="#81918f" stroke-width="2"/><text x="190" y="315" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Weight-only</text><text x="190" y="340" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">dequantize / fused GEMM</text><rect x="370" y="285" width="260" height="90" rx="12" fill="#f0f3f2" stroke="#81918f" stroke-width="2"/><text x="500" y="315" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Activation quant</text><text x="500" y="340" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">dynamic or calibrated</text><rect x="680" y="285" width="260" height="90" rx="12" fill="#f0f3f2" stroke="#81918f" stroke-width="2"/><text x="810" y="315" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Backend contract</text><text x="810" y="340" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">dtype + layout + SM</text><path d="M190 205 L190 275" fill="none" stroke="#bd6738" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M500 205 L500 275" fill="none" stroke="#147f80" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M810 205 L810 275" fill="none" stroke="#7258a8" stroke-width="2.5"  marker-end="url(#arr)"/><text x="500" y="440" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#627274">同一个量化名称不能脱离设备、scale layout 和 kernel compatibility 单独评价</text></svg>