<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">Mooncake Store control plane and data plane</title><desc id="d">Master allocates logical space and manages eviction, metadata service or peer handshake maintains object metadata, store service exposes memory segments, and SGLang clients transfer data directly to store.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#147f80"/></marker></defs><rect width="1200" height="500" rx="20" fill="#fffdf9"/><text x="40" y="45" font-family="system-ui" font-size="24" font-weight="700" fill="#20363b">Control-plane coordination; direct data-plane transfer</text><g font-family="system-ui" text-anchor="middle"><rect x="70" y="120" width="250" height="95" rx="12" fill="#eee9f7" stroke="#7059aa" stroke-width="2"/><text x="195" y="158" font-size="19" font-weight="700" fill="#7059aa">Master service</text><text x="195" y="188" font-size="15" fill="#53646b">logical pool / eviction</text><rect x="470" y="120" width="250" height="95" rx="12" fill="#f0f1ef" stroke="#8b9693" stroke-width="2"/><text x="595" y="158" font-size="19" font-weight="700" fill="#53646b">Metadata service</text><text x="595" y="188" font-size="15" fill="#53646b">optional / P2P alternative</text><rect x="870" y="120" width="250" height="95" rx="12" fill="#d8efeb" stroke="#147f80" stroke-width="2"/><text x="995" y="158" font-size="19" font-weight="700" fill="#147f80">Store service</text><text x="995" y="188" font-size="15" fill="#53646b">shared memory segment</text><rect x="470" y="330" width="250" height="95" rx="12" fill="#fff0e6" stroke="#b75c31" stroke-width="2"/><text x="595" y="368" font-size="19" font-weight="700" fill="#b75c31">SGLang client</text><text x="595" y="398" font-size="15" fill="#53646b">HiCache / linker</text></g><path d="M320 167H470" stroke="#7059aa" stroke-width="2.5" stroke-dasharray="7 5"/><path d="M720 167H870" stroke="#7059aa" stroke-width="2.5" stroke-dasharray="7 5"/><path d="M720 377H995V215" stroke="#147f80" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="890" y="355" font-family="system-ui" font-size="16" fill="#147f80" text-anchor="middle">direct payload path</text><text x="45" y="470" font-family="system-ui" font-size="15" fill="#53646b">Master / metadata coordinate; the Store and SGLang exchange the payload without routing it through Master.</text></svg>