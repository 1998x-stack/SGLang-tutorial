<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" role="img" aria-labelledby="t d"><title id="t">KV Cache 字节预算</title><desc id="d">适用于标准 MHA/GQA KV 缓存的有效 payload 理论计算图；真实显存还包含权重、激活、图捕获、池与碎片开销。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607a7b"/></marker></defs><rect width="960" height="370" rx="16" fill="#fbfdfc"/><text x="480" y="43" font-size="22" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#203b3f">一枚 token，在每一层写入 K 和 V</text><text x="480" y="342" font-size="16" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#53666a">最后乘缓存 token 数 T；这不是总 GPU 显存</text><path d="M220 132L269 132" fill="none" stroke="#147f80" stroke-width="3"  marker-end="url(#arr)"/><path d="M449 132L500 132" fill="none" stroke="#147f80" stroke-width="3"  marker-end="url(#arr)"/><path d="M681 132L730 132" fill="none" stroke="#147f80" stroke-width="3"  marker-end="url(#arr)"/><rect x="43" y="92" width="176" height="82" rx="12" fill="#f0f2f2" stroke="#81918f" stroke-width="2"/><text x="131" y="122" font-size="18" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#243e42">L</text><text x="131" y="148" font-size="14" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#435a60">Transformer 层数</text><rect x="272" y="92" width="176" height="82" rx="12" fill="#eee9f9" stroke="#7459a9" stroke-width="2"/><text x="360" y="122" font-size="18" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#243e42">H_KV</text><text x="360" y="148" font-size="14" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#435a60">每层 KV head 数</text><rect x="504" y="92" width="176" height="82" rx="12" fill="#eee9f9" stroke="#7459a9" stroke-width="2"/><text x="592" y="122" font-size="18" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#243e42">D_head</text><text x="592" y="148" font-size="14" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#435a60">每 head 维度</text><rect x="733" y="92" width="176" height="82" rx="12" fill="#fff0e4" stroke="#c16b37" stroke-width="2"/><text x="821" y="122" font-size="18" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#243e42">B × 2</text><text x="821" y="148" font-size="14" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#435a60">字节 × K/V</text><rect x="107" y="235" width="314" height="76" rx="12" fill="#eee9f9" stroke="#7459a9" stroke-width="2"/><text x="264" y="265" font-size="18" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#243e42">Key tensor</text><text x="264" y="291" font-size="14" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#435a60">L × H_KV × D_head</text><rect x="539" y="235" width="314" height="76" rx="12" fill="#e0f4f0" stroke="#147f80" stroke-width="2"/><text x="696" y="265" font-size="18" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#243e42">Value tensor</text><text x="696" y="291" font-size="14" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#435a60">L × H_KV × D_head</text></svg>