<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc"><title id="title">MoE Two-Batch Overlap 时间线</title><desc id="desc">两个 microbatch 的 attention、dispatch、expert GEMM 与 combine 交错执行；重叠可隐藏部分通信等待，但不消除依赖。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#147f80"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#b75c31"/></marker></defs><rect width="1200" height="540" rx="20" fill="#fffdf9"/><text x="42" y="48" font-family="system-ui,sans-serif" font-size="23" font-weight="750" fill="#1d3035" text-anchor="start">TBO：让一个 microbatch 的通信与另一个的计算交错</text>
<text x="60" y="150" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#147f80" text-anchor="start">Batch B0</text><text x="60" y="355" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#7059aa" text-anchor="start">Batch B1</text>
<text x="280" y="100" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#53646b" text-anchor="middle">t0</text><text x="455" y="100" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#53646b" text-anchor="middle">t1</text><text x="630" y="100" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#53646b" text-anchor="middle">t2</text><text x="805" y="100" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#53646b" text-anchor="middle">t3</text><text x="980" y="100" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#53646b" text-anchor="middle">t4</text>
<line x1="280" y1="115" x2="280" y2="455" stroke="#e1e6e4" stroke-dasharray="4 6"/><line x1="455" y1="115" x2="455" y2="455" stroke="#e1e6e4" stroke-dasharray="4 6"/><line x1="630" y1="115" x2="630" y2="455" stroke="#e1e6e4" stroke-dasharray="4 6"/><line x1="805" y1="115" x2="805" y2="455" stroke="#e1e6e4" stroke-dasharray="4 6"/><line x1="980" y1="115" x2="980" y2="455" stroke="#e1e6e4" stroke-dasharray="4 6"/>
