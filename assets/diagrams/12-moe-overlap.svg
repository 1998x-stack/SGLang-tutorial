<rect x="400" y="165" width="170" height="72" rx="12" fill="#fbe2d4" stroke="#b75c31" stroke-width="2"/><text x="485" y="207" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#1d3035" text-anchor="middle">Dispatch B0</text>
<rect x="570" y="165" width="220" height="72" rx="12" fill="#fbe2d4" stroke="#b75c31" stroke-width="2"/><text x="680" y="207" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#1d3035" text-anchor="middle">Expert GEMM B0</text>
<rect x="790" y="165" width="170" height="72" rx="12" fill="#d8efeb" stroke="#147f80" stroke-width="2"/><text x="875" y="207" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#1d3035" text-anchor="middle">Combine B0</text>
<rect x="230" y="365" width="170" height="72" rx="12" fill="#e7e1f4" stroke="#7059aa" stroke-width="2"/><text x="315" y="407" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#1d3035" text-anchor="middle">Attention B1</text>
<rect x="400" y="365" width="170" height="72" rx="12" fill="#fbe2d4" stroke="#b75c31" stroke-width="2"/><text x="485" y="407" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#1d3035" text-anchor="middle">Dispatch B1</text>
<rect x="570" y="365" width="220" height="72" rx="12" fill="#e7e1f4" stroke="#7059aa" stroke-width="2"/><text x="680" y="407" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#1d3035" text-anchor="middle">Expert GEMM B1</text>
