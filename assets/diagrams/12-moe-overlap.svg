<line x1="400" y1="201" x2="400" y2="201" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/><line x1="570" y1="201" x2="570" y2="201" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/><line x1="790" y1="201" x2="790" y2="201" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/><line x1="315" y1="237" x2="315" y2="365" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/><line x1="485" y1="237" x2="485" y2="365" stroke="#b75c31" stroke-width="3" marker-end="url(#o)"/>
<text x="45" y="510" font-family="system-ui,sans-serif" font-size="15" font-weight="500" fill="#53646b" text-anchor="start">示意时间线不是 profiler trace；真实重叠取决于 backend、stream、buffer 与 GPU 资源竞争。</text></svg>