<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc"><title id="title">SGLang 权重量化从 checkpoint metadata 到 layer method 再到 GEMM kernel</title><desc id="desc">Checkpoint quantization metadata is resolved, mapped to a platform-aware QuantizationConfig registry, then each layer creates and loads packed weights before the selected backend applies a kernel.</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#627c7c"/></marker></defs><rect width="1000" height="470" rx="16" fill="#fbfdfc"/><text x="500" y="40" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#203b40">权重文件格式不是最终执行路径</text><rect x="35" y="120" width="180" height="90" rx="12" fill="#fff0e4" stroke="#bd6738" stroke-width="2"/><text x="125" y="150" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Checkpoint</text><text x="125" y="175" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">quantization_config</text><rect x="270" y="120" width="190" height="90" rx="12" fill="#eee9f8" stroke="#7258a8" stroke-width="2"/><text x="365" y="150" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Metadata resolver</text><text x="365" y="175" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">method + source</text><rect x="515" y="120" width="190" height="90" rx="12" fill="#e2f4f0" stroke="#147f80" stroke-width="2"/><text x="610" y="150" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Config registry</text><text x="610" y="175" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">platform-aware</text><rect x="760" y="120" width="205" height="90" rx="12" fill="#fff0e4" stroke="#bd6738" stroke-width="2"/><text x="862.5" y="150" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Layer method</text><text x="862.5" y="175" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">create / load / pack</text><rect x="270" y="310" width="190" height="85" rx="12" fill="#f0f3f2" stroke="#81918f" stroke-width="2"/><text x="365" y="340" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Quantized tensors</text><text x="365" y="365" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">weights + scales</text><rect x="515" y="310" width="190" height="85" rx="12" fill="#eee9f8" stroke="#7258a8" stroke-width="2"/><text x="610" y="340" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">GEMM backend</text><text x="610" y="365" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">CUTLASS / Triton / ...</text><rect x="760" y="310" width="205" height="85" rx="12" fill="#e2f4f0" stroke="#147f80" stroke-width="2"/><text x="862.5" y="340" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Output</text><text x="862.5" y="365" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">matmul result</text><path d="M215 165 L265 165" fill="none" stroke="#bd6738" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M460 165 L510 165" fill="none" stroke="#7258a8" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M705 165 L755 165" fill="none" stroke="#bd6738" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M855 210 L855 300" fill="none" stroke="#bd6738" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M460 350 L505 350" fill="none" stroke="#81918f" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M705 350 L755 350" fill="none" stroke="#7258a8" stroke-width="2.5"  marker-end="url(#arr)"/><text x="500" y="445" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#627274">Offline checkpoint metadata 与 online runtime quantization 是不同入口</text></svg>