<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Two-batch overlap schedule for expert parallelism</title><desc id="d">Microbatch zero and one interleave attention, dispatch, expert compute and combine. Overlap hides part of communication but preserves data dependencies.</desc><rect width="1200" height="520" rx="20" fill="#fffdf9"/><text x="40" y="45" font-family="system-ui" font-size="24" font-weight="700" fill="#20363b">TBO interleaves microbatches; it does not remove dependencies</text><g font-family="system-ui" font-size="17" fill="#53646b"><text x="45" y="155" font-weight="700">Microbatch 0</text><text x="45" y="315" font-weight="700">Microbatch 1</text></g><g><rect x="220" y="105" width="190" height="75" rx="10" fill="#fff0e6" stroke="#b75c31" stroke-width="2"/><rect x="465" y="105" width="190" height="75" rx="10" fill="#eee9f7" stroke="#7059aa" stroke-width="2"/><rect x="710" y="105" width="190" height="75" rx="10" fill="#d8efeb" stroke="#147f80" stroke-width="2"/><rect x="955" y="105" width="190" height="75" rx="10" fill="#eee9f7" stroke="#7059aa" stroke-width="2"/><rect x="220" y="265" width="190" height="75" rx="10" fill="#fff0e6" stroke="#b75c31" stroke-width="2"/><rect x="465" y="265" width="190" height="75" rx="10" fill="#eee9f7" stroke="#7059aa" stroke-width="2"/><rect x="710" y="265" width="190" height="75" rx="10" fill="#d8efeb" stroke="#147f80" stroke-width="2"/><rect x="955" y="265" width="190" height="75" rx="10" fill="#eee9f7" stroke="#7059aa" stroke-width="2"/><g font-family="system-ui" font-size="17" font-weight="700" text-anchor="middle"><text x="315" y="150" fill="#b75c31">Attention</text><text x="560" y="150" fill="#7059aa">Dispatch</text><text x="805" y="150" fill="#147f80">Expert GEMM</text><text x="1050" y="150" fill="#7059aa">Combine</text><text x="315" y="310" fill="#b75c31">Attention</text><text x="560" y="310" fill="#7059aa">Dispatch</text><text x="805" y="310" fill="#147f80">Expert GEMM</text><text x="1050" y="310" fill="#7059aa">Combine</text></g></g><g stroke="#147f80" stroke-width="2.5" fill="none"><path d="M410 142H465"/><path d="M655 142H710"/><path d="M900 142H955"/><path d="M410 302H465"/><path d="M655 302H710"/><path d="M900 302H955"/></g><path d="M560 180V225H315V265" stroke="#7059aa" stroke-width="3" stroke-dasharray="7 5" fill="none"/><path d="M805 180V225H560V265" stroke="#147f80" stroke-width="3" stroke-dasharray="7 5" fill="none"/><path d="M1050 180V225H805V265" stroke="#7059aa" stroke-width="3" stroke-dasharray="7 5" fill="none"/><text x="600" y="405" font-family="system-ui" font-size="17" font-weight="700" fill="#7059aa" text-anchor="middle">Overlap windows: communication for one microbatch can overlap with independent work on another</text><text x="600" y="448" font-family="system-ui" font-size="15" fill="#53646b" text-anchor="middle">Streams, events, buffer lifetimes and collective ordering still define the true dependency graph.</text></svg>