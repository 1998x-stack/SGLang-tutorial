<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" role="img"><title>远程加载与就绪状态机</title><desc>接收、校验与必要初始化完成才能服务；异常转入失败处理。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="700" height="360" rx="10" fill="#faf9f5"/><g font-family="system-ui,sans-serif" fill="#243243"><text x="350" y="29" font-size="19" text-anchor="middle" font-weight="700">远程加载与就绪状态机</text><path d="M205 97H258" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M443 97H490" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M582 125V227" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M490 97H468V254H443" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#a)"/><rect x="25" y="70" width="180" height="55" rx="5" fill="#eef1f4" stroke="#65758a"/><text x="115" y="92.5" font-size="16" text-anchor="middle">Allocate</text><text x="115" y="112.5" font-size="16" text-anchor="middle">target tensors</text><rect x="258" y="70" width="185" height="55" rx="5" fill="#fff0dc" stroke="#b36b23"/><text x="350.5" y="92.5" font-size="16" text-anchor="middle">Receive</text><text x="350.5" y="112.5" font-size="16" text-anchor="middle">all rank shards</text><rect x="490" y="70" width="185" height="55" rx="5" fill="#fff0dc" stroke="#b36b23"/><text x="582.5" y="92.5" font-size="16" text-anchor="middle">Validate</text><text x="582.5" y="112.5" font-size="16" text-anchor="middle">revision / layout</text><rect x="490" y="227" width="185" height="55" rx="5" fill="#e0f4ef" stroke="#167b70"/><text x="582.5" y="249.5" font-size="16" text-anchor="middle">Ready</text><text x="582.5" y="269.5" font-size="16" text-anchor="middle">admit requests</text><rect x="258" y="227" width="185" height="55" rx="5" fill="#eef1f4" stroke="#65758a"/><text x="350.5" y="249.5" font-size="16" text-anchor="middle">Failure</text><text x="350.5" y="269.5" font-size="16" text-anchor="middle">isolate / retry</text><text x="350" y="174" text-anchor="middle" font-size="15">教学 readiness invariant</text><text x="350" y="322" text-anchor="middle" font-size="15">部分成功不能冒充完整就绪</text></g></svg>