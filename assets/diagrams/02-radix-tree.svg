<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="t d"><title id="t">压缩基数树与共享 KV 前缀</title><desc id="d">共同的 token ID 前缀走同一段压缩边，直到请求 A 和请求 B 在后缀处分叉；能否复用还取决于模型与缓存命名空间。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607a7b"/></marker></defs><rect width="960" height="410" rx="16" fill="#fbfdfc"/><text x="480" y="43" font-size="22" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#203b3f">两个请求只计算一次相容的前缀 KV</text><text x="480" y="400" font-size="16" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#53666a">边的标记表示 token ID，不是自然语言字符串</text><path d="M480 143L480 172" fill="none" stroke="#7459a9" stroke-width="3"  marker-end="url(#arr)"/><path d="M360 250L232 298" fill="none" stroke="#147f80" stroke-width="3"  marker-end="url(#arr)"/><path d="M603 250L730 298" fill="none" stroke="#c16b37" stroke-width="3"  marker-end="url(#arr)"/><rect x="371" y="70" width="218" height="72" rx="12" fill="#f0f2f2" stroke="#81918f" stroke-width="2"/><text x="480" y="100" font-size="18" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#243e42">root</text><text x="480" y="126" font-size="14" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#435a60">共享根</text><rect x="287" y="176" width="386" height="73" rx="12" fill="#eee9f9" stroke="#7459a9" stroke-width="2"/><text x="480" y="206" font-size="18" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#243e42">公共压缩边</text><text x="480" y="232" font-size="14" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#435a60">[SYS, Q1, Q2, Q3]</text><rect x="58" y="302" width="350" height="73" rx="12" fill="#e0f4f0" stroke="#147f80" stroke-width="2"/><text x="233" y="332" font-size="18" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#243e42">请求 A 后缀</text><text x="233" y="358" font-size="14" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#435a60">[A1, A2]</text><rect x="552" y="302" width="350" height="73" rx="12" fill="#fff0e4" stroke="#c16b37" stroke-width="2"/><text x="727" y="332" font-size="18" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#243e42">请求 B 后缀</text><text x="727" y="358" font-size="14" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#435a60">[B1, B2]</text></svg>