<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="g30a-title g30a-desc"><title id="g30a-title">Distributed checkpoint loading topology</title><desc id="g30a-desc">Checkpoint shards are read by parallel loader workers and delivered to inference ranks using broadcast, peer-to-peer or combined transport.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#527b79"/></marker></defs><rect width="1080" height="560" rx="18" fill="#fbfdfc"/><path d="M 200 260 L 260 122" stroke="#527b79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 200 260 L 260 412" stroke="#527b79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 440 122 L 520 245" stroke="#527b79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 440 412 L 520 285" stroke="#527b79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 710 245 L 785 122" stroke="#527b79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 710 285 L 785 412" stroke="#527b79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g><rect x="30" y="200" width="170" height="125" rx="15" fill="#edf5f3" stroke="#477d78" stroke-width="2"/><text x="115" y="231" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">Checkpoint</text><text x="115" y="256" text-anchor="middle" font-size="15" fill="#35585a">Shard files</text></g><g><rect x="260" y="65" width="180" height="115" rx="15" fill="#f3f0fb" stroke="#7564a0" stroke-width="2"/><text x="350" y="96" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">Loader 0</text><text x="350" y="121" text-anchor="middle" font-size="15" fill="#35585a">Read / decode</text></g><g><rect x="260" y="355" width="180" height="115" rx="15" fill="#f3f0fb" stroke="#7564a0" stroke-width="2"/><text x="350" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">Loader N</text><text x="350" y="411" text-anchor="middle" font-size="15" fill="#35585a">Read / decode</text></g><g><rect x="520" y="200" width="190" height="125" rx="15" fill="#fff3e9" stroke="#c98246" stroke-width="2"/><text x="615" y="231" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">Parameter Server</text><text x="615" y="256" text-anchor="middle" font-size="15" fill="#35585a">Broadcast / P2P</text></g><g><rect x="785" y="65" width="235" height="115" rx="15" fill="#eaf4f1" stroke="#477d78" stroke-width="2"/><text x="902.5" y="96" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">Inference ranks</text><text x="902.5" y="121" text-anchor="middle" font-size="15" fill="#35585a">GPU 0 ... GPU N</text></g><g><rect x="785" y="355" width="235" height="115" rx="15" fill="#eaf4f1" stroke="#477d78" stroke-width="2"/><text x="902.5" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">SGLang Server</text><text x="902.5" y="411" text-anchor="middle" font-size="15" fill="#35585a">Weight loader + hook</text></g></svg>