<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc"><title id="title">HiCache local match、prefetch、promotion 与 write-back</title><desc id="desc">请求先查找本地 L1/L2，缺失部分查询 L3 并预取到 L2，再晋升到 L1；新 KV 依据 write policy 写回。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#147f80"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#b75c31"/></marker></defs><rect width="1200" height="540" rx="20" fill="#fffdf9"/><text x="42" y="48" font-family="system-ui,sans-serif" font-size="23" font-weight="750" fill="#1d3035" text-anchor="start">从请求到缓存命中：四个核心动作</text>
<rect x="45" y="130" width="235" height="105" rx="12" fill="#d8efeb" stroke="#147f80" stroke-width="2"/><text x="162" y="170" font-family="system-ui,sans-serif" font-size="18" font-weight="750" fill="#1d3035" text-anchor="middle">1 · Local match</text><text x="162" y="205" font-family="system-ui,sans-serif" font-size="16" font-weight="550" fill="#53646b" text-anchor="middle">HiRadixTree</text><rect x="330" y="130" width="235" height="105" rx="12" fill="#e7e1f4" stroke="#7059aa" stroke-width="2"/><text x="447" y="170" font-family="system-ui,sans-serif" font-size="18" font-weight="750" fill="#1d3035" text-anchor="middle">2 · L3 lookup</text><text x="447" y="205" font-family="system-ui,sans-serif" font-size="16" font-weight="550" fill="#53646b" text-anchor="middle">backend metadata</text><rect x="615" y="130" width="235" height="105" rx="12" fill="#fbe2d4" stroke="#b75c31" stroke-width="2"/><text x="732" y="170" font-family="system-ui,sans-serif" font-size="18" font-weight="750" fill="#1d3035" text-anchor="middle">3 · Prefetch</text><text x="732" y="205" font-family="system-ui,sans-serif" font-size="16" font-weight="550" fill="#53646b" text-anchor="middle">L3 → L2</text><rect x="900" y="130" width="235" height="105" rx="12" fill="#d8efeb" stroke="#147f80" stroke-width="2"/><text x="1017" y="170" font-family="system-ui,sans-serif" font-size="18" font-weight="750" fill="#1d3035" text-anchor="middle">4 · Promote</text><text x="1017" y="205" font-family="system-ui,sans-serif" font-size="16" font-weight="550" fill="#53646b" text-anchor="middle">L2 → L1</text>
<line x1="280" y1="182" x2="330" y2="182" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/><line x1="565" y1="182" x2="615" y2="182" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/><line x1="850" y1="182" x2="900" y2="182" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/>
<rect x="65" y="315" width="315" height="125" rx="12" fill="#f5f5f2" stroke="#cbd7d4" stroke-width="2"/><text x="222" y="355" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#1d3035" text-anchor="middle">Prefetch stop policy</text><text x="222" y="395" font-family="system-ui,sans-serif" font-size="15" font-weight="550" fill="#53646b" text-anchor="middle">best_effort · wait_complete · timeout</text>
<rect x="442" y="315" width="315" height="125" rx="12" fill="#f1eff8" stroke="#7059aa" stroke-width="2"/><text x="600" y="355" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#7059aa" text-anchor="middle">Write-back policy</text><text x="600" y="395" font-family="system-ui,sans-serif" font-size="15" font-weight="550" fill="#53646b" text-anchor="middle">write_through · selective · write_back</text>
<rect x="820" y="315" width="315" height="125" rx="12" fill="#fff4ed" stroke="#b75c31" stroke-width="2"/><text x="977" y="355" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#b75c31" text-anchor="middle">Host transfer layout</text><text x="977" y="395" font-family="system-ui,sans-serif" font-size="16" font-weight="550" fill="#53646b" text-anchor="middle">layer_first ↔ page_first</text>
<text x="55" y="500" font-family="system-ui,sans-serif" font-size="15" font-weight="500" fill="#53646b" text-anchor="start">命中层、预取等待、写回策略与内存布局是不同维度；策略选择会影响延迟、命中率与 I/O。</text></svg>