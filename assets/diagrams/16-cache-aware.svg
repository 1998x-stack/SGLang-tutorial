<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Cache-aware routing with admission and fallback</title><desc id="d">Three workers advertise prefix match lengths and load; router prefers the longest eligible prefix owner but falls back if it fails admission or balanced mode favors another engine.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#147f80"/></marker></defs><rect width="1200" height="520" rx="20" fill="#fffdf9"/><text x="40" y="46" font-family="system-ui" font-size="24" font-weight="700" fill="#20363b">Prefix ownership is a preference signal, not a reservation</text><g font-family="system-ui" text-anchor="middle"><rect x="45" y="120" width="280" height="205" rx="14" fill="#eee9f7" stroke="#7059aa" stroke-width="2"/><text x="185" y="158" font-size="20" font-weight="700" fill="#7059aa">Worker A</text><text x="185" y="197" font-size="17" fill="#53646b">prefix match: 2,048 tokens</text><rect x="90" y="220" width="190" height="18" rx="9" fill="#d9d5e5"/><rect x="90" y="220" width="170" height="18" rx="9" fill="#7059aa"/><text x="185" y="276" font-size="16" fill="#53646b">load: high</text><text x="185" y="303" font-size="16" fill="#53646b">admission: pass</text><rect x="460" y="120" width="280" height="205" rx="14" fill="#e8f1f0" stroke="#147f80" stroke-width="2"/><text x="600" y="158" font-size="20" font-weight="700" fill="#147f80">Worker B</text><text x="600" y="197" font-size="17" fill="#53646b">prefix match: 512 tokens</text><rect x="505" y="220" width="190" height="18" rx="9" fill="#d9e5e1"/><rect x="505" y="220" width="72" height="18" rx="9" fill="#147f80"/><text x="600" y="276" font-size="16" fill="#53646b">load: low</text><text x="600" y="303" font-size="16" fill="#53646b">admission: pass</text><rect x="875" y="120" width="280" height="205" rx="14" fill="#f0f1ef" stroke="#8b9693" stroke-width="2"/><text x="1015" y="158" font-size="20" font-weight="700" fill="#53646b">Worker C</text><text x="1015" y="197" font-size="17" fill="#53646b">prefix match: 0 tokens</text><rect x="920" y="220" width="190" height="18" rx="9" fill="#e1e4e1"/><rect x="920" y="220" width="120" height="18" rx="9" fill="#8b9693"/><text x="1015" y="276" font-size="16" fill="#53646b">load: medium</text><text x="1015" y="303" font-size="16" fill="#53646b">admission: pass</text></g><path d="M185 325V385H600" stroke="#7059aa" stroke-width="3" fill="none"/><path d="M600 325V385" stroke="#147f80" stroke-width="3" fill="none"/><path d="M600 385V420" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/><rect x="390" y="420" width="420" height="62" rx="12" fill="#d8efeb" stroke="#147f80" stroke-width="2"/><text x="600" y="458" font-family="system-ui" font-size="18" font-weight="700" fill="#147f80" text-anchor="middle">Prefer A, or switch to B if balanced threshold holds</text><text x="42" y="505" font-family="system-ui" font-size="14" fill="#53646b">Toy values illustrate policy logic only; real routing uses versioned worker reports and cache events.</text></svg>