<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc"><title id="title">并行策略切分维度</title><desc id="desc">TP 切分层内权重，PP 切分层深度，DP 切分请求副本，EP 切分 MoE 专家，CP 切分上下文序列。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#147f80"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#b75c31"/></marker></defs><rect width="1200" height="540" rx="20" fill="#fffdf9"/><text x="42" y="48" font-family="system-ui,sans-serif" font-size="24" font-weight="750" fill="#1d3035" text-anchor="start">先问切分对象，再讨论并行策略</text>
<rect x="45" y="85" width="245" height="62" rx="12" fill="#d8efeb" stroke="#147f80" stroke-width="2"/><text x="168" y="124" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#1d3035" text-anchor="middle">TP · 层内权重</text><rect x="45" y="173" width="245" height="62" rx="12" fill="#fff0e6" stroke="#b75c31" stroke-width="2"/><text x="168" y="212" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#1d3035" text-anchor="middle">PP · 模型深度</text><rect x="45" y="261" width="245" height="62" rx="12" fill="#eee9f7" stroke="#7059aa" stroke-width="2"/><text x="168" y="300" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#1d3035" text-anchor="middle">DP · 请求副本</text><rect x="45" y="349" width="245" height="62" rx="12" fill="#d8efeb" stroke="#147f80" stroke-width="2"/><text x="168" y="388" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#1d3035" text-anchor="middle">EP · MoE 专家</text><rect x="45" y="437" width="245" height="62" rx="12" fill="#f0f1ef" stroke="#8b9693" stroke-width="2"/><text x="168" y="476" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#1d3035" text-anchor="middle">CP / DCP · 上下文</text>
<rect x="360" y="96" width="92" height="42" rx="12" fill="#d8efeb" stroke="#147f80" stroke-width="2"/><rect x="475" y="96" width="92" height="42" rx="12" fill="#d8efeb" stroke="#147f80" stroke-width="2"/><rect x="590" y="96" width="92" height="42" rx="12" fill="#d8efeb" stroke="#147f80" stroke-width="2"/><rect x="705" y="96" width="92" height="42" rx="12" fill="#d8efeb" stroke="#147f80" stroke-width="2"/><text x="406" y="124" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#147f80" text-anchor="middle">W0</text><text x="521" y="124" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#147f80" text-anchor="middle">W1</text><text x="636" y="124" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#147f80" text-anchor="middle">W2</text><text x="751" y="124" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#147f80" text-anchor="middle">W3</text><text x="840" y="124" font-family="system-ui,sans-serif" font-size="17" font-weight="600" fill="#53646b" text-anchor="start">一个 Transformer layer 被切成多个 rank</text>
<rect x="360" y="184" width="92" height="42" rx="12" fill="#fbe2d4" stroke="#b75c31" stroke-width="2"/><rect x="475" y="184" width="92" height="42" rx="12" fill="#fbe2d4" stroke="#b75c31" stroke-width="2"/><rect x="590" y="184" width="92" height="42" rx="12" fill="#fbe2d4" stroke="#b75c31" stroke-width="2"/><rect x="705" y="184" width="92" height="42" rx="12" fill="#fbe2d4" stroke="#b75c31" stroke-width="2"/><text x="406" y="212" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#b75c31" text-anchor="middle">Stage 0</text><text x="521" y="212" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#b75c31" text-anchor="middle">Stage 1</text><text x="636" y="212" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#b75c31" text-anchor="middle">Stage 2</text><text x="751" y="212" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#b75c31" text-anchor="middle">Stage 3</text><text x="840" y="212" font-family="system-ui,sans-serif" font-size="17" font-weight="600" fill="#53646b" text-anchor="start">不同 rank 持有不同层区间</text>
<rect x="360" y="272" width="120" height="42" rx="12" fill="#e7e1f4" stroke="#7059aa" stroke-width="2"/><rect x="510" y="272" width="120" height="42" rx="12" fill="#e7e1f4" stroke="#7059aa" stroke-width="2"/><rect x="660" y="272" width="120" height="42" rx="12" fill="#e7e1f4" stroke="#7059aa" stroke-width="2"/><text x="420" y="300" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#7059aa" text-anchor="middle">Replica 0</text><text x="570" y="300" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#7059aa" text-anchor="middle">Replica 1</text><text x="720" y="300" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#7059aa" text-anchor="middle">Replica 2</text><text x="840" y="300" font-family="system-ui,sans-serif" font-size="17" font-weight="600" fill="#53646b" text-anchor="start">完整模型副本处理不同请求</text>
<rect x="360" y="360" width="92" height="42" rx="12" fill="#d8efeb" stroke="#147f80" stroke-width="2"/><rect x="475" y="360" width="92" height="42" rx="12" fill="#d8efeb" stroke="#147f80" stroke-width="2"/><rect x="590" y="360" width="92" height="42" rx="12" fill="#d8efeb" stroke="#147f80" stroke-width="2"/><rect x="705" y="360" width="92" height="42" rx="12" fill="#d8efeb" stroke="#147f80" stroke-width="2"/><text x="406" y="388" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#147f80" text-anchor="middle">E0–1</text><text x="521" y="388" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#147f80" text-anchor="middle">E2–3</text><text x="636" y="388" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#147f80" text-anchor="middle">E4–5</text><text x="751" y="388" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#147f80" text-anchor="middle">E6–7</text><text x="840" y="388" font-family="system-ui,sans-serif" font-size="17" font-weight="600" fill="#53646b" text-anchor="start">专家分布在 rank，token 按路由跨卡</text>
<rect x="360" y="448" width="92" height="42" rx="12" fill="#f0f1ef" stroke="#8b9693" stroke-width="2"/><rect x="475" y="448" width="92" height="42" rx="12" fill="#f0f1ef" stroke="#8b9693" stroke-width="2"/><rect x="590" y="448" width="92" height="42" rx="12" fill="#f0f1ef" stroke="#8b9693" stroke-width="2"/><rect x="705" y="448" width="92" height="42" rx="12" fill="#f0f1ef" stroke="#8b9693" stroke-width="2"/><text x="406" y="476" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#53646b" text-anchor="middle">Seq 0</text><text x="521" y="476" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#53646b" text-anchor="middle">Seq 1</text><text x="636" y="476" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#53646b" text-anchor="middle">Seq 2</text><text x="751" y="476" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#53646b" text-anchor="middle">Seq 3</text><text x="840" y="476" font-family="system-ui,sans-serif" font-size="17" font-weight="600" fill="#53646b" text-anchor="start">长序列 / KV 上下文被切分</text>
<text x="45" y="525" font-family="system-ui,sans-serif" font-size="15" font-weight="500" fill="#53646b" text-anchor="start">不同并行轴可能嵌套或共享 rank；此图只定义切分语义，不代表通用部署拓扑。</text></svg>