<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" role="img"><title>Metadata 与权重流式加载两阶段</title><desc>配置/tokenizer 本地缓存，权重 URI 传给 streamer，named tensors 进入 model loader。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="700" height="360" rx="10" fill="#faf9f5"/><g font-family="system-ui,sans-serif" fill="#243243"><text x="350" y="29" font-size="19" text-anchor="middle" font-weight="700">Metadata 与权重流式加载两阶段</text><path d="M215 93H255" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><path d="M117 121V158H582V121" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><path d="M582 121V228" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><path d="M485 256H445" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><path d="M255 256H215" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="65" width="195" height="56" rx="5" fill="#eef1f4" stroke="#65758a"/><text x="117.5" y="88" font-size="16" text-anchor="middle">Object URI</text><text x="117.5" y="108" font-size="16" text-anchor="middle">S3 / GCS / Azure</text><rect x="255" y="65" width="190" height="56" rx="5" fill="#eee8fa" stroke="#7858ae"/><text x="350" y="88" font-size="16" text-anchor="middle">Metadata</text><text x="350" y="108" font-size="16" text-anchor="middle">local cache</text><rect x="485" y="65" width="195" height="56" rx="5" fill="#eee8fa" stroke="#7858ae"/><text x="582.5" y="88" font-size="16" text-anchor="middle">Weight URIs</text><text x="582.5" y="108" font-size="16" text-anchor="middle">safetensors files</text><rect x="485" y="228" width="195" height="56" rx="5" fill="#fff0dc" stroke="#b36b23"/><text x="582.5" y="251" font-size="16" text-anchor="middle">Streamer</text><text x="582.5" y="271" font-size="16" text-anchor="middle">named tensors</text><rect x="255" y="228" width="190" height="56" rx="5" fill="#e0f4ef" stroke="#167b70"/><text x="350" y="251" font-size="16" text-anchor="middle">Model loader</text><text x="350" y="271" font-size="16" text-anchor="middle">map / copy</text><rect x="20" y="228" width="195" height="56" rx="5" fill="#e0f4ef" stroke="#167b70"/><text x="117.5" y="251" font-size="16" text-anchor="middle">Ready</text><text x="117.5" y="271" font-size="16" text-anchor="middle">after init</text><text x="350" y="184" font-size="15" text-anchor="middle">metadata 预下载，权重按需流式读取</text><text x="350" y="326" font-size="15" text-anchor="middle">不要求完整本地权重副本</text></g></svg>