<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="g27a-title g27a-desc"><title id="g27a-title">Tool parser protocol pipeline</title><desc id="g27a-desc">Model-specific serialized tool calls are normalized by a parser, returned through the API, and executed by the client application.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#527b79"/></marker></defs><rect width="1080" height="560" rx="18" fill="#fbfdfc"/><path d="M 205 267 L 255 267" stroke="#527b79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 445 267 L 495 267" stroke="#527b79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 680 267 L 730 267" stroke="#527b79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 875 267 L 925 267" stroke="#527b79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g><rect x="30" y="205" width="175" height="125" rx="15" fill="#f3f0fb" stroke="#7564a0" stroke-width="2"/><text x="117.5" y="236" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">Model output</text><text x="117.5" y="261" text-anchor="middle" font-size="15" fill="#35585a">Tokens / text</text></g><g><rect x="255" y="205" width="190" height="125" rx="15" fill="#fff3e9" stroke="#c98246" stroke-width="2"/><text x="350" y="236" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">Parser registry</text><text x="350" y="261" text-anchor="middle" font-size="15" fill="#35585a">Detector per format</text></g><g><rect x="495" y="205" width="185" height="125" rx="15" fill="#eaf4f1" stroke="#477d78" stroke-width="2"/><text x="587.5" y="236" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">ToolCallItem</text><text x="587.5" y="261" text-anchor="middle" font-size="15" fill="#35585a">name + JSON args</text></g><g><rect x="730" y="205" width="145" height="125" rx="15" fill="#edf5f3" stroke="#477d78" stroke-width="2"/><text x="802.5" y="236" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">SSE / API</text><text x="802.5" y="261" text-anchor="middle" font-size="15" fill="#35585a">Client receives</text></g><g><rect x="925" y="205" width="130" height="125" rx="15" fill="#fff3e9" stroke="#c98246" stroke-width="2"/><text x="990" y="236" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">Executor</text><text x="990" y="261" text-anchor="middle" font-size="15" fill="#35585a">Application</text></g></svg>