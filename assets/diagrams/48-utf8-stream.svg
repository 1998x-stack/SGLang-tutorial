<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" role="img"><title>跨片 UTF-8 与增量输出</title><desc>E4、B8、AD 合成“中”；不完整片段不独立发出。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="700" height="360" rx="10" fill="#faf9f5"/><g font-family="system-ui,sans-serif" fill="#243243"><text x="350" y="29" font-size="19" text-anchor="middle" font-weight="700">跨片 UTF-8 与增量输出</text><path d="M117 123V230" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M350 123V230" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M582 123V230" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M210 98H258" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M443 98H490" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><rect x="25" y="73" width="185" height="50" rx="5" fill="#eee8fa" stroke="#7858ae"/><text x="117.5" y="93" font-size="16" text-anchor="middle">E4</text><text x="117.5" y="113" font-size="16" text-anchor="middle">fragment 1</text><rect x="258" y="73" width="185" height="50" rx="5" fill="#eee8fa" stroke="#7858ae"/><text x="350.5" y="93" font-size="16" text-anchor="middle">B8</text><text x="350.5" y="113" font-size="16" text-anchor="middle">fragment 2</text><rect x="490" y="73" width="185" height="50" rx="5" fill="#eee8fa" stroke="#7858ae"/><text x="582.5" y="93" font-size="16" text-anchor="middle">AD</text><text x="582.5" y="113" font-size="16" text-anchor="middle">fragment 3</text><rect x="25" y="230" width="185" height="50" rx="5" fill="#eef1f4" stroke="#65758a"/><text x="117.5" y="250" font-size="16" text-anchor="middle">hold</text><text x="117.5" y="270" font-size="16" text-anchor="middle">无完整字符</text><rect x="258" y="230" width="185" height="50" rx="5" fill="#eef1f4" stroke="#65758a"/><text x="350.5" y="250" font-size="16" text-anchor="middle">hold</text><text x="350.5" y="270" font-size="16" text-anchor="middle">仍无完整字符</text><rect x="490" y="230" width="185" height="50" rx="5" fill="#e0f4ef" stroke="#167b70"/><text x="582.5" y="250" font-size="16" text-anchor="middle">emit 中</text><text x="582.5" y="270" font-size="16" text-anchor="middle">只发送一次</text><text x="350" y="177" text-anchor="middle" font-size="15">跨片 UTF-8 教学模型；实际还需要 token overlap</text><text x="350" y="322" text-anchor="middle" font-size="15">发送 offset 与已提交 decode state 分开</text></g></svg>