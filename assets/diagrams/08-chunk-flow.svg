<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">Chunked Prefill 按本轮预算推进长 Prompt</title><desc id="desc">长 Prompt 被切成多个可执行片段；每轮可用 chunk 上限由剩余 token budget、KV memory budget、配置上限及对齐约束共同限制。每个片段写入 KV 后，请求在下一轮继续。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#627c7c"/></marker></defs><rect width="1000" height="450" rx="17" fill="#fbfdfc"/><text x="500" y="40" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#203b40">切片大小由“这一轮还能容纳多少”决定</text><rect x="35" y="100" width="170" height="85" rx="13" fill="#f0f3f2" stroke="#81918f" stroke-width="2"/><text x="120" y="130" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Long prompt</text><text x="120" y="157" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">tokens 0…11</text><rect x="260" y="85" width="190" height="90" rx="13" fill="#fff0e4" stroke="#bd6738" stroke-width="2"/><text x="355" y="115" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Chunk 1</text><text x="355" y="142" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">0…3 · 4 tokens</text><rect x="505" y="85" width="190" height="90" rx="13" fill="#fff0e4" stroke="#bd6738" stroke-width="2"/><text x="600" y="115" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Chunk 2</text><text x="600" y="142" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">4…6 · 3 tokens</text><rect x="750" y="85" width="190" height="90" rx="13" fill="#fff0e4" stroke="#bd6738" stroke-width="2"/><text x="845" y="115" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Chunk 3</text><text x="845" y="142" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">7…11 · 5 tokens</text><path d="M205 142 L255 130" fill="none" stroke="#bd6738" stroke-width="2.7"  marker-end="url(#arrow)"/><path d="M450 130 L500 130" fill="none" stroke="#bd6738" stroke-width="2.7"  marker-end="url(#arrow)"/><path d="M695 130 L745 130" fill="none" stroke="#bd6738" stroke-width="2.7"  marker-end="url(#arrow)"/><rect x="260" y="225" width="190" height="72" rx="13" fill="#eee9f8" stroke="#7258a8" stroke-width="2"/><text x="355" y="255" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">KV committed</text><text x="355" y="282" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">保存已算状态</text><rect x="505" y="225" width="190" height="72" rx="13" fill="#eee9f8" stroke="#7258a8" stroke-width="2"/><text x="600" y="255" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">KV extended</text><text x="600" y="282" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">追加新位置</text><rect x="750" y="225" width="190" height="72" rx="13" fill="#e2f4f0" stroke="#147f80" stroke-width="2"/><text x="845" y="255" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Prefill done</text><text x="845" y="282" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">进入 Decode</text><path d="M355 175 L355 220" fill="none" stroke="#7258a8" stroke-width="2.7"  marker-end="url(#arrow)"/><path d="M600 175 L600 220" fill="none" stroke="#7258a8" stroke-width="2.7"  marker-end="url(#arrow)"/><path d="M845 175 L845 220" fill="none" stroke="#147f80" stroke-width="2.7"  marker-end="url(#arrow)"/><text x="500" y="345" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#334f53">本轮 chunk ≤ min(剩余输入, token budget, memory 可容纳量, 其他策略上限)</text><text x="500" y="390" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#627274">若被截断，某些路径还要满足 page / recurrent-state chunk grid 对齐</text></svg>