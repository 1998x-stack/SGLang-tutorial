<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" role="img"><title>Session 与可复用 leaf 的引用</title><desc>A、B 引用共享路径 X；A 另有 Y，Z 属一次性流量。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="700" height="360" rx="10" fill="#faf9f5"/><g font-family="system-ui,sans-serif" fill="#243243"><text x="350" y="29" font-size="19" text-anchor="middle" font-weight="700">Session 与可复用 leaf 的引用</text><path d="M140 110V130H310V150" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M560 110V130H390V150" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M140 110V244" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M300 200V219H140V244" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#a)"/><rect x="55" y="60" width="170" height="50" rx="5" fill="#e0f4ef" stroke="#167b70"/><text x="140" y="90" font-size="16" text-anchor="middle">Session A</text><rect x="475" y="60" width="170" height="50" rx="5" fill="#e0f4ef" stroke="#167b70"/><text x="560" y="90" font-size="16" text-anchor="middle">Session B</text><rect x="260" y="150" width="180" height="50" rx="5" fill="#eee8fa" stroke="#7858ae"/><text x="350" y="170" font-size="16" text-anchor="middle">共享前缀 X</text><text x="350" y="190" font-size="16" text-anchor="middle">refs={A,B}</text><rect x="55" y="244" width="170" height="55" rx="5" fill="#eee8fa" stroke="#7858ae"/><text x="140" y="266.5" font-size="16" text-anchor="middle">Leaf Y</text><text x="140" y="286.5" font-size="16" text-anchor="middle">refs={A}</text><rect x="475" y="244" width="170" height="55" rx="5" fill="#eef1f4" stroke="#65758a"/><text x="560" y="266.5" font-size="16" text-anchor="middle">Leaf Z</text><text x="560" y="286.5" font-size="16" text-anchor="middle">refs={}</text><text x="350" y="325" text-anchor="middle" font-size="15">虚线示意树路径，实线示意 session 引用</text></g></svg>