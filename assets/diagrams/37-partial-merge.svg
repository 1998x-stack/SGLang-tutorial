<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" role="img"><title>局部输出与全局 softmax</title><desc>两个 shard 提供 output 与 LSE，通过权重归约得到全局值 8，而非平均值 6。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="700" height="360" rx="10" fill="#faf9f5"/><g font-family="system-ui,sans-serif" fill="#243243"><text x="350" y="29" font-size="19" text-anchor="middle" font-weight="700">局部输出与全局 softmax</text><path d="M215 96H236V128H255" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M215 208H236V177H255" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M440 153H480" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><rect x="25" y="64" width="190" height="64" rx="5" fill="#eee8fa" stroke="#7858ae"/><text x="120" y="91" font-size="16" text-anchor="middle">Rank 0</text><text x="120" y="111" font-size="16" text-anchor="middle">o=2, LSE=0</text><rect x="25" y="176" width="190" height="64" rx="5" fill="#eee8fa" stroke="#7858ae"/><text x="120" y="203" font-size="16" text-anchor="middle">Rank 1</text><text x="120" y="223" font-size="16" text-anchor="middle">o=10, LSE=log 3</text><rect x="255" y="104" width="185" height="97" rx="5" fill="#fff0dc" stroke="#b36b23"/><text x="347.5" y="137.5" font-size="16" text-anchor="middle">LSE merge</text><text x="347.5" y="157.5" font-size="16" text-anchor="middle">权重 1/4、3/4</text><text x="347.5" y="177.5" font-size="16" text-anchor="middle">不是平均</text><rect x="480" y="128" width="195" height="55" rx="5" fill="#e0f4ef" stroke="#167b70"/><text x="577.5" y="160.5" font-size="16" text-anchor="middle">全局 output = 8</text><text x="350" y="273" text-anchor="middle" font-size="15">局部输出已归一化，必须恢复全局权重</text><text x="350" y="305" text-anchor="middle" font-size="15">空 shard 的 LSE=-∞，权重 0</text></g></svg>