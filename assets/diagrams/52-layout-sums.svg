<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" role="img"><title>Token rows 与 partial sum 是不同维度</title><desc>同一 token row 在两 rank 上贡献2、3；完成 sum 后更新 residual。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="700" height="360" rx="10" fill="#faf9f5"/><g font-family="system-ui,sans-serif" fill="#243243"><text x="350" y="29" font-size="19" text-anchor="middle" font-weight="700">Token rows 与 partial sum 是不同维度</text><path d="M117 128V150H350V172" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><path d="M582 128V150H350V172" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><path d="M350 227V265" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="25" y="70" width="185" height="58" rx="5" fill="#eee8fa" stroke="#7858ae"/><text x="117.5" y="94" font-size="16" text-anchor="middle">Rank0 partial</text><text x="117.5" y="114" font-size="16" text-anchor="middle">x₀=2</text><rect x="490" y="70" width="185" height="58" rx="5" fill="#eee8fa" stroke="#7858ae"/><text x="582.5" y="94" font-size="16" text-anchor="middle">Rank1 partial</text><text x="582.5" y="114" font-size="16" text-anchor="middle">x₁=3</text><rect x="258" y="172" width="185" height="55" rx="5" fill="#fff0dc" stroke="#b36b23"/><text x="350.5" y="194.5" font-size="16" text-anchor="middle">Complete sum</text><text x="350.5" y="214.5" font-size="16" text-anchor="middle">2+3=5</text><rect x="258" y="265" width="185" height="52" rx="5" fill="#e0f4ef" stroke="#167b70"/><text x="350.5" y="286" font-size="16" text-anchor="middle">Residual update</text><text x="350.5" y="306" font-size="16" text-anchor="middle">10+5=15</text><text x="350" y="86" font-size="15" text-anchor="middle">same token row</text><text x="350" y="341" font-size="15" text-anchor="middle">先完成归约，再只更新一次</text></g></svg>