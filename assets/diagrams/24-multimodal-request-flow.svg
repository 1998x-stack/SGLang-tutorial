<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc"><title id="title">多模态请求从 raw media 经 processor 变成 scheduler 可消费的 features</title><desc id="desc">A request carries text and raw image/video/audio. Media I/O loads and decodes items, processor workers build modality features, token-space expansion replaces placeholders, and feature transport moves tensors to scheduler-visible memory.</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#627c7c"/></marker></defs><rect width="1000" height="470" rx="16" fill="#fbfdfc"/><text x="500" y="42" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#203b40">单请求数据路径：原始媒体不是模型 token</text><rect x="25" y="140" width="150" height="90" rx="12" fill="#f0f3f2" stroke="#81918f" stroke-width="2"/><text x="100" y="170" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">OpenAI API</text><text x="100" y="195" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">text + media URLs</text><rect x="220" y="140" width="160" height="90" rx="12" fill="#fff0e4" stroke="#bd6738" stroke-width="2"/><text x="300" y="170" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Media I/O</text><text x="300" y="195" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">fetch / decode</text><rect x="425" y="140" width="165" height="90" rx="12" fill="#eee9f8" stroke="#7258a8" stroke-width="2"/><text x="507.5" y="170" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Processor pool</text><text x="507.5" y="195" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">image / video / audio</text><rect x="640" y="140" width="160" height="90" rx="12" fill="#e2f4f0" stroke="#147f80" stroke-width="2"/><text x="720" y="170" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Token expansion</text><text x="720" y="195" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">placeholder → IDs</text><rect x="850" y="140" width="125" height="90" rx="12" fill="#f0f3f2" stroke="#81918f" stroke-width="2"/><text x="912.5" y="170" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Scheduler</text><text x="912.5" y="195" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">features + spans</text><path d="M175 185 L215 185" fill="none" stroke="#627c7c" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M380 185 L420 185" fill="none" stroke="#627c7c" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M590 185 L635 185" fill="none" stroke="#627c7c" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M800 185 L845 185" fill="none" stroke="#627c7c" stroke-width="2.5"  marker-end="url(#arr)"/><rect x="260" y="310" width="210" height="80" rx="12" fill="#f0f3f2" stroke="#81918f" stroke-width="2"/><text x="365" y="340" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">CPU transport</text><text x="365" y="365" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">host tensors</text><rect x="535" y="310" width="210" height="80" rx="12" fill="#e2f4f0" stroke="#147f80" stroke-width="2"/><text x="640" y="340" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">GPU transport</text><text x="640" y="365" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">CUDA IPC / VMM</text><path d="M505 230 L365 305" fill="none" stroke="#81918f" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M720 230 L640 305" fill="none" stroke="#147f80" stroke-width="2.5"  marker-end="url(#arr)"/><text x="500" y="435" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#627274">本章解释 instance 内的 request processing；EPD 章节解释跨 worker 的部署拓扑</text></svg>