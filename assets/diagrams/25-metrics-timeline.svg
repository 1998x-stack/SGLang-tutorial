<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc"><title id="title">TTFT、TPOT、ITL 与 E2E latency 使用不同时间区间和权重</title><desc id="desc">Arrival to first token defines TTFT; later output tokens define request-level TPOT; inter-token latency is token-weighted; end-to-end latency spans arrival to completion.</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#627c7c"/></marker></defs><rect width="1000" height="470" rx="16" fill="#fbfdfc"/><text x="500" y="42" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#203b40">同一个请求时间轴，四种指标回答不同问题</text><path d="M100 210 L900 210" fill="none" stroke="#627c7c" stroke-width="3"  marker-end="url(#arr)"/><circle cx="150" cy="210" r="9" fill="#bd6738"/><text x="150" y="175" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#8e4d2b">arrival</text><circle cx="370" cy="210" r="9" fill="#147f80"/><text x="370" y="175" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#147f80">first token</text><circle cx="565" cy="210" r="9" fill="#147f80"/><text x="565" y="175" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#147f80">token 2</text><circle cx="760" cy="210" r="9" fill="#147f80"/><text x="760" y="175" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#147f80">token N</text><circle cx="900" cy="210" r="9" fill="#7258a8"/><text x="900" y="175" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#7258a8">finish</text><path d="M150 260 L370 260" fill="none" stroke="#bd6738" stroke-width="6"  marker-end="url(#arr)"/><text x="260" y="290" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#8e4d2b">TTFT</text><path d="M370 320 L900 320" fill="none" stroke="#147f80" stroke-width="6"  marker-end="url(#arr)"/><text x="635" y="350" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#147f80">decode window → TPOT denominator excludes first token</text><path d="M150 390 L900 390" fill="none" stroke="#7258a8" stroke-width="4"  marker-end="url(#arr)"/><text x="525" y="420" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#7258a8">E2E = finish − arrival</text></svg>