<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="t d"><title id="t">Prefill—Decode 请求生命周期</title><desc id="d">请求先进入 Prefill 计算 prompt token，再借助各层 KV Cache 逐步解码；每轮 decode 需要前一轮新 token，历史 Key Value 不必重复投影。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607a7b"/></marker></defs><rect width="960" height="360" rx="16" fill="#fbfdfc"/><text x="480" y="43" font-size="22" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#203b3f">同一请求：读入 → 保存状态 → 逐 token 输出</text><text x="480" y="300" font-size="16" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#53666a">新输出进入下一轮；示意回边不代表重算整个历史</text><text x="614" y="212" font-size="16" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#53666a">读取 + 追加缓存</text><path d="M229 130L273 130" fill="none" stroke="#c16b37" stroke-width="3"  marker-end="url(#arr)"/><path d="M470 130L511 130" fill="none" stroke="#7459a9" stroke-width="3"  marker-end="url(#arr)"/><path d="M708 130L755 130" fill="none" stroke="#7459a9" stroke-width="3"  marker-end="url(#arr)"/><path d="M835 171L835 252" fill="none" stroke="#147f80" stroke-width="3"  marker-end="url(#arr)"/><path d="M835 252L280 252" fill="none" stroke="#147f80" stroke-width="3"  marker-end="url(#arr)"/><path d="M280 252L280 205" fill="none" stroke="#147f80" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arr)"/><rect x="36" y="90" width="193" height="80" rx="12" fill="#f0f2f2" stroke="#81918f" stroke-width="2"/><text x="132.5" y="120" font-size="18" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#243e42">输入 Prompt</text><text x="132.5" y="146" font-size="14" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#435a60">token IDs</text><rect x="277" y="90" width="193" height="80" rx="12" fill="#fff0e4" stroke="#c16b37" stroke-width="2"/><text x="373.5" y="120" font-size="18" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#243e42">Prefill</text><text x="373.5" y="146" font-size="14" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#435a60">并行处理输入位置</text><rect x="515" y="90" width="193" height="80" rx="12" fill="#eee9f9" stroke="#7459a9" stroke-width="2"/><text x="611.5" y="120" font-size="18" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#243e42">KV Cache</text><text x="611.5" y="146" font-size="14" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#435a60">历史 K/V 按层保存</text><rect x="759" y="90" width="165" height="80" rx="12" fill="#e0f4f0" stroke="#147f80" stroke-width="2"/><text x="841.5" y="120" font-size="18" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#243e42">Decode</text><text x="841.5" y="146" font-size="14" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#435a60">单步生成 token</text></svg>