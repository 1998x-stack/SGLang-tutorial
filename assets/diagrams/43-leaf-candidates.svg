<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" role="img"><title>Radix tree 的候选与锁定边界</title><desc>仅可回收 leaf 进入 policy；叶被释放后父节点重新检查。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="700" height="360" rx="10" fill="#faf9f5"/><g font-family="system-ui,sans-serif" fill="#243243"><text x="350" y="29" font-size="19" text-anchor="middle" font-weight="700">Radix tree 的候选与锁定边界</text><path d="M350 102V122H170V147" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M350 102V122H530V147" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M170 195V220H115V245" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M170 195V220H330V245" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><rect x="275" y="54" width="150" height="48" rx="5" fill="#eef1f4" stroke="#65758a"/><text x="350" y="83" font-size="16" text-anchor="middle">Root</text><rect x="80" y="147" width="180" height="48" rx="5" fill="#eee8fa" stroke="#7858ae"/><text x="170" y="176" font-size="16" text-anchor="middle">A · internal</text><rect x="440" y="147" width="180" height="48" rx="5" fill="#e0f4ef" stroke="#167b70"/><text x="530" y="176" font-size="16" text-anchor="middle">B · leaf</text><rect x="25" y="245" width="180" height="54" rx="5" fill="#e0f4ef" stroke="#167b70"/><text x="115" y="277" font-size="16" text-anchor="middle">C · unlocked leaf</text><rect x="240" y="245" width="180" height="54" rx="5" fill="#eef1f4" stroke="#65758a"/><text x="330" y="277" font-size="16" text-anchor="middle">D · locked leaf</text><text x="530" y="220" text-anchor="middle" font-size="15">候选 B</text><text x="115" y="320" text-anchor="middle" font-size="15">候选 C</text><text x="330" y="320" text-anchor="middle" font-size="15">排除 D；A 尚有 child</text></g></svg>