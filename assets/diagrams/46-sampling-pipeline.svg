<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" role="img"><title>从 LM head 到采样与状态提交</title><desc>固定版本的普通路径；watermark 或 graph 已采样路径可能旁路部分操作。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="700" height="360" rx="10" fill="#faf9f5"/><g font-family="system-ui,sans-serif" fill="#243243"><text x="350" y="29" font-size="19" text-anchor="middle" font-weight="700">从 LM head 到采样与状态提交</text><path d="M210 92H258" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M443 92H490" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M582 120V220" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M490 247H443" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M258 247H210" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><rect x="25" y="65" width="185" height="55" rx="5" fill="#eef1f4" stroke="#65758a"/><text x="117.5" y="87.5" font-size="16" text-anchor="middle">LM head</text><text x="117.5" y="107.5" font-size="16" text-anchor="middle">next-token logits</text><rect x="258" y="65" width="185" height="55" rx="5" fill="#fff0dc" stroke="#b36b23"/><text x="350.5" y="87.5" font-size="16" text-anchor="middle">Penalties / grammar</text><text x="350.5" y="107.5" font-size="16" text-anchor="middle">logit bias</text><rect x="490" y="65" width="185" height="55" rx="5" fill="#eee8fa" stroke="#7858ae"/><text x="582.5" y="87.5" font-size="16" text-anchor="middle">Optional watermark</text><text x="582.5" y="107.5" font-size="16" text-anchor="middle">or graph path</text><rect x="490" y="220" width="185" height="55" rx="5" fill="#fff0dc" stroke="#b36b23"/><text x="582.5" y="242.5" font-size="16" text-anchor="middle">Custom processors</text><text x="582.5" y="262.5" font-size="16" text-anchor="middle">sanitize</text><rect x="258" y="220" width="185" height="55" rx="5" fill="#e0f4ef" stroke="#167b70"/><text x="350.5" y="242.5" font-size="16" text-anchor="middle">Sampler</text><text x="350.5" y="262.5" font-size="16" text-anchor="middle">filter + draw</text><rect x="25" y="220" width="185" height="55" rx="5" fill="#e0f4ef" stroke="#167b70"/><text x="117.5" y="242.5" font-size="16" text-anchor="middle">Token + logprob</text><text x="117.5" y="262.5" font-size="16" text-anchor="middle">commit state</text><text x="350" y="172" text-anchor="middle" font-size="15">普通路径；可选后端旁路单独处理</text><text x="350" y="320" text-anchor="middle" font-size="15">returned logprob 不一定等于截断后分布</text></g></svg>