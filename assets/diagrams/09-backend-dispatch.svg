<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc"><title id="title">Attention Backend 由配置解析后按 Prefill / Decode 分发</title><desc id="desc">SGLang 解析模型、平台和参数得到 prefill/decode backend；两者相同则构建单一后端，不同时构建 hybrid wrapper。随后按 forward mode 准备 metadata，再调用具体 kernel。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#627c7c"/></marker></defs><rect width="1000" height="470" rx="17" fill="#fbfdfc"/><text x="500" y="40" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#203b40">Backend 是“执行注意力”的策略与 kernel 层，不是 KV allocator</text><rect x="35" y="110" width="190" height="88" rx="13" fill="#f0f3f2" stroke="#81918f" stroke-width="2"/><text x="130" y="140" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Model + platform</text><text x="130" y="167" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">MHA / MLA / device</text><rect x="285" y="100" width="200" height="105" rx="13" fill="#eee9f8" stroke="#7258a8" stroke-width="2"/><text x="385" y="130" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Backend resolver</text><text x="385" y="157" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">prefill / decode</text><rect x="560" y="75" width="180" height="85" rx="13" fill="#fff0e4" stroke="#bd6738" stroke-width="2"/><text x="650" y="105" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Prefill backend</text><text x="650" y="132" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">示意：FlashInfer</text><rect x="560" y="190" width="180" height="85" rx="13" fill="#e2f4f0" stroke="#147f80" stroke-width="2"/><text x="650" y="220" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Decode backend</text><text x="650" y="247" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">示意：Triton</text><rect x="805" y="125" width="165" height="105" rx="13" fill="#eee9f8" stroke="#7258a8" stroke-width="2"/><text x="887.5" y="155" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Hybrid wrapper</text><text x="887.5" y="182" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">按 phase dispatch</text><path d="M225 155 L280 155" fill="none" stroke="#81918f" stroke-width="2.7"  marker-end="url(#arrow)"/><path d="M485 140 L555 115" fill="none" stroke="#bd6738" stroke-width="2.7"  marker-end="url(#arrow)"/><path d="M485 165 L555 230" fill="none" stroke="#147f80" stroke-width="2.7"  marker-end="url(#arrow)"/><path d="M740 115 L800 155" fill="none" stroke="#7258a8" stroke-width="2.7"  marker-end="url(#arrow)"/><path d="M740 230 L800 185" fill="none" stroke="#7258a8" stroke-width="2.7"  marker-end="url(#arrow)"/><rect x="290" y="315" width="420" height="72" rx="13" fill="#f0f3f2" stroke="#81918f" stroke-width="2"/><text x="500" y="345" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">init_forward_metadata</text><text x="500" y="372" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">indptr / page indices / sequence lengths</text><rect x="790" y="315" width="180" height="72" rx="13" fill="#e2f4f0" stroke="#147f80" stroke-width="2"/><text x="880" y="345" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Kernel forward</text><text x="880" y="372" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">extend / decode</text><path d="M880 230 L880 310" fill="none" stroke="#147f80" stroke-width="2.7"  marker-end="url(#arrow)"/><path d="M710 350 L785 350" fill="none" stroke="#81918f" stroke-width="2.7"  marker-end="url(#arrow)"/><text x="500" y="425" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#627274">示意后端组合，不代表默认选择或所有硬件均兼容</text></svg>