<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 476" role="img" aria-labelledby="t d"><title id="t">前端 DSL fork 和 join 的程序 DAG</title><desc id="d">分支复用共同前缀，分别调用生成，最后汇总；fork 是程序结构，并行执行程度受后端与调度资源限制。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607a7b"/></marker></defs><rect width="960" height="476" rx="16" fill="#fbfdfc"/><text x="480" y="38" font-size="22" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#203b3f">相同前缀、多条生成路径、最终汇总</text><text x="480" y="467" font-size="16" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#53666a">fork 分支共享父前缀，不表示把不同后缀 KV 合并</text><path d="M400 137L239 208" fill="none" stroke="#7459a9" stroke-width="3"  marker-end="url(#arr)"/><path d="M561 137L728 208" fill="none" stroke="#7459a9" stroke-width="3"  marker-end="url(#arr)"/><path d="M230 289L400 356" fill="none" stroke="#147f80" stroke-width="3"  marker-end="url(#arr)"/><path d="M728 289L558 356" fill="none" stroke="#147f80" stroke-width="3"  marker-end="url(#arr)"/><rect x="330" y="60" width="300" height="77" rx="12" fill="#eee9f9" stroke="#7459a9" stroke-width="2"/><text x="480" y="90" font-size="18" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#243e42">公共前缀</text><text x="480" y="116" font-size="14" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#435a60">system + prompt</text><rect x="63" y="212" width="343" height="77" rx="12" fill="#e0f4f0" stroke="#147f80" stroke-width="2"/><text x="234.5" y="242" font-size="18" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#243e42">fork A</text><text x="234.5" y="268" font-size="14" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#435a60">生成第一部分</text><rect x="553" y="212" width="343" height="77" rx="12" fill="#e0f4f0" stroke="#147f80" stroke-width="2"/><text x="724.5" y="242" font-size="18" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#243e42">fork B</text><text x="724.5" y="268" font-size="14" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#435a60">生成第二部分</text><rect x="330" y="360" width="300" height="77" rx="12" fill="#fff0e4" stroke="#c16b37" stroke-width="2"/><text x="480" y="390" font-size="18" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#243e42">join / summary</text><text x="480" y="416" font-size="14" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#435a60">汇总后继续生成</text></svg>