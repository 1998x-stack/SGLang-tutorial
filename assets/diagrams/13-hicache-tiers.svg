<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc"><title id="title">HiCache L1 L2 L3 的 KV 驻留层级</title><desc id="desc">L1 GPU HBM 和 L2 CPU DRAM 属于单个 inference instance；L3 Storage 是否共享取决于 backend 与 namespace。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#147f80"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#b75c31"/></marker></defs><rect width="1200" height="540" rx="20" fill="#fffdf9"/><text x="42" y="48" font-family="system-ui,sans-serif" font-size="23" font-weight="750" fill="#1d3035" text-anchor="start">HiCache：缓存驻留位置与 attention 执行位置分离</text>
<rect x="55" y="120" width="300" height="275" rx="12" fill="#e5f3ef" stroke="#147f80" stroke-width="2"/><text x="205" y="165" font-family="system-ui,sans-serif" font-size="21" font-weight="750" fill="#147f80" text-anchor="middle">L1 · GPU HBM</text><text x="205" y="200" font-family="system-ui,sans-serif" font-size="17" font-weight="650" fill="#1d3035" text-anchor="middle">instance 私有</text><rect x="100" y="238" width="210" height="105" rx="12" fill="#d8efeb" stroke="#147f80" stroke-width="2"/><text x="205" y="280" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#1d3035" text-anchor="middle">KV pages</text><text x="205" y="310" font-family="system-ui,sans-serif" font-size="16" font-weight="500" fill="#53646b" text-anchor="middle">attention 读取</text>
<rect x="450" y="120" width="300" height="275" rx="12" fill="#f1eff8" stroke="#7059aa" stroke-width="2"/><text x="600" y="165" font-family="system-ui,sans-serif" font-size="21" font-weight="750" fill="#7059aa" text-anchor="middle">L2 · CPU DRAM</text><text x="600" y="200" font-family="system-ui,sans-serif" font-size="17" font-weight="650" fill="#1d3035" text-anchor="middle">instance 私有</text><rect x="495" y="238" width="210" height="105" rx="12" fill="#e7e1f4" stroke="#7059aa" stroke-width="2"/><text x="600" y="280" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#1d3035" text-anchor="middle">Host KV pool</text><text x="600" y="310" font-family="system-ui,sans-serif" font-size="16" font-weight="500" fill="#53646b" text-anchor="middle">回迁 / spill</text>
<rect x="845" y="120" width="300" height="275" rx="12" fill="#fff4ed" stroke="#b75c31" stroke-width="2"/><text x="995" y="165" font-family="system-ui,sans-serif" font-size="21" font-weight="750" fill="#b75c31" text-anchor="middle">L3 · Storage</text><text x="995" y="200" font-family="system-ui,sans-serif" font-size="16" font-weight="650" fill="#1d3035" text-anchor="middle">共享范围由 backend 决定</text><rect x="890" y="238" width="210" height="105" rx="12" fill="#fbe2d4" stroke="#b75c31" stroke-width="2"/><text x="995" y="280" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#1d3035" text-anchor="middle">Mooncake / 3FS</text><text x="995" y="310" font-family="system-ui,sans-serif" font-size="15" font-weight="500" fill="#53646b" text-anchor="middle">NIXL / file / others</text>
<line x1="355" y1="290" x2="450" y2="290" stroke="#7059aa" stroke-width="3" marker-end="url(#a)"/><line x1="750" y1="290" x2="845" y2="290" stroke="#b75c31" stroke-width="3" marker-end="url(#o)"/>
<text x="400" y="268" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#7059aa" text-anchor="middle">spill / restore</text><text x="800" y="268" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#b75c31" text-anchor="middle">backup / prefetch</text>
<text x="55" y="450" font-family="system-ui,sans-serif" font-size="17" font-weight="600" fill="#53646b" text-anchor="start">L2 不是同节点多实例共享池。L3 只有在后端、路径与 namespace 配置相同时才可能跨实例复用。</text>
<text x="55" y="495" font-family="system-ui,sans-serif" font-size="17" font-weight="600" fill="#53646b" text-anchor="start">GPU 仍负责 attention；Host / Storage 保存 KV 并提供回迁数据。</text></svg>