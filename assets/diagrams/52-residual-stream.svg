<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" role="img"><title>ResidualStream 状态与完成顺序</title><desc>Pending → complete → fold → Written；完整 readout 不允许重复 fold。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="700" height="360" rx="10" fill="#faf9f5"/><g font-family="system-ui,sans-serif" fill="#243243"><text x="350" y="29" font-size="19" text-anchor="middle" font-weight="700">ResidualStream 状态与完成顺序</text><path d="M210 92H258" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><path d="M443 92H490" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><path d="M582 120V228" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><path d="M490 255H443" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="25" y="65" width="185" height="55" rx="5" fill="#eef1f4" stroke="#65758a"/><text x="117.5" y="87.5" font-size="16" text-anchor="middle">Initial / Written</text><text x="117.5" y="107.5" font-size="16" text-anchor="middle">residual r=10</text><rect x="258" y="65" width="185" height="55" rx="5" fill="#eee8fa" stroke="#7858ae"/><text x="350.5" y="87.5" font-size="16" text-anchor="middle">Pending</text><text x="350.5" y="107.5" font-size="16" text-anchor="middle">partial outputs</text><rect x="490" y="65" width="185" height="55" rx="5" fill="#fff0dc" stroke="#b36b23"/><text x="582.5" y="87.5" font-size="16" text-anchor="middle">Complete</text><text x="582.5" y="107.5" font-size="16" text-anchor="middle">sum=5</text><rect x="490" y="228" width="185" height="55" rx="5" fill="#e0f4ef" stroke="#167b70"/><text x="582.5" y="250.5" font-size="16" text-anchor="middle">Fold</text><text x="582.5" y="270.5" font-size="16" text-anchor="middle">r=15</text><rect x="258" y="228" width="185" height="55" rx="5" fill="#e0f4ef" stroke="#167b70"/><text x="350.5" y="250.5" font-size="16" text-anchor="middle">Written</text><text x="350.5" y="270.5" font-size="16" text-anchor="middle">readout</text><text x="350" y="170" font-size="15" text-anchor="middle">Owed work 完成后 residual update 仍需执行</text><text x="350" y="325" font-size="15" text-anchor="middle">拒绝重复 fold 与错误 microbatch handle</text></g></svg>