<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" role="img"><title>Checkpoint file index 与 TP layout 的区别</title><desc>同一个 W tensor 文件映射到两个 rank 的不同参数切片。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="700" height="360" rx="10" fill="#faf9f5"/><g font-family="system-ui,sans-serif" fill="#243243"><text x="350" y="29" font-size="19" text-anchor="middle" font-weight="700">Checkpoint file index 与 TP layout 的区别</text><path d="M215 87H255" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M445 87H480" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M350 114V173H205V220" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M350 173H495V220" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><rect x="25" y="60" width="190" height="54" rx="5" fill="#eef1f4" stroke="#65758a"/><text x="120" y="82" font-size="16" text-anchor="middle">Checkpoint index</text><text x="120" y="102" font-size="16" text-anchor="middle">W → part-02</text><rect x="255" y="60" width="190" height="54" rx="5" fill="#eee8fa" stroke="#7858ae"/><text x="350" y="82" font-size="16" text-anchor="middle">part-02</text><text x="350" y="102" font-size="16" text-anchor="middle">W: shape 8×4</text><rect x="480" y="60" width="195" height="54" rx="5" fill="#eef1f4" stroke="#65758a"/><text x="577.5" y="82" font-size="16" text-anchor="middle">File shard</text><text x="577.5" y="102" font-size="16" text-anchor="middle">not TP rank</text><rect x="95" y="220" width="220" height="62" rx="5" fill="#e0f4ef" stroke="#167b70"/><text x="205" y="246" font-size="16" text-anchor="middle">TP Rank 0</text><text x="205" y="266" font-size="16" text-anchor="middle">rows 0–3 · 32B</text><rect x="385" y="220" width="220" height="62" rx="5" fill="#e0f4ef" stroke="#167b70"/><text x="495" y="246" font-size="16" text-anchor="middle">TP Rank 1</text><text x="495" y="266" font-size="16" text-anchor="middle">rows 4–7 · 32B</text><text x="350" y="151" text-anchor="middle" font-size="15">model weight loader: output-axis slice</text><text x="350" y="325" text-anchor="middle" font-size="15">同一文件可供多个 rank 使用</text></g></svg>