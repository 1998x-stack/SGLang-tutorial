<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">SGLang Router request lifecycle</title><desc id="d">Request preprocessing and bucket fit precede worker admission, policy selection, dispatch, and bounded retry.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#147f80"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#b75c31"/></marker></defs><rect width="1200" height="520" rx="20" fill="#fffdf9"/><text x="40" y="48" font-family="system-ui" font-size="24" font-weight="700" fill="#20363b">Request routing is a sequence of gates, not a single score</text><g font-family="system-ui" font-size="18" text-anchor="middle"><rect x="35" y="130" width="170" height="105" rx="12" fill="#e8f1f0" stroke="#147f80" stroke-width="2"/><text x="120" y="172" fill="#147f80" font-weight="700">Request</text><text x="120" y="202" fill="#53646b">parse / tokenize</text><rect x="250" y="130" width="175" height="105" rx="12" fill="#eee9f7" stroke="#7059aa" stroke-width="2"/><text x="337" y="172" fill="#7059aa" font-weight="700">Bucket</text><text x="337" y="202" fill="#53646b">length / SLO</text><rect x="470" y="130" width="175" height="105" rx="12" fill="#fff0e6" stroke="#b75c31" stroke-width="2"/><text x="557" y="172" fill="#b75c31" font-weight="700">Admission</text><text x="557" y="202" fill="#53646b">capacity caps</text><rect x="690" y="130" width="175" height="105" rx="12" fill="#e8f1f0" stroke="#147f80" stroke-width="2"/><text x="777" y="172" fill="#147f80" font-weight="700">Policy</text><text x="777" y="202" fill="#53646b">load / prefix / session</text><rect x="910" y="130" width="250" height="105" rx="12" fill="#d8efeb" stroke="#147f80" stroke-width="2"/><text x="1035" y="172" fill="#147f80" font-weight="700">Dispatch</text><text x="1035" y="202" fill="#53646b">worker or P/D pair</text></g><g stroke="#147f80" stroke-width="3" marker-end="url(#a)"><line x1="205" y1="182" x2="250" y2="182"/><line x1="425" y1="182" x2="470" y2="182"/><line x1="645" y1="182" x2="690" y2="182"/><line x1="865" y1="182" x2="910" y2="182"/></g><rect x="265" y="320" width="260" height="92" rx="12" fill="#f0f1ef" stroke="#8b9693" stroke-width="2"/><text x="395" y="355" font-family="system-ui" font-size="17" font-weight="700" text-anchor="middle" fill="#53646b">No bucket fits</text><text x="395" y="385" font-family="system-ui" font-size="16" text-anchor="middle" fill="#53646b">reject before engine pick</text><rect x="635" y="320" width="280" height="92" rx="12" fill="#fff4ed" stroke="#b75c31" stroke-width="2"/><text x="775" y="355" font-family="system-ui" font-size="17" font-weight="700" text-anchor="middle" fill="#b75c31">Dispatch failed pre-response</text><text x="775" y="385" font-family="system-ui" font-size="16" text-anchor="middle" fill="#53646b">exclude worker; retry if budget</text><path d="M337 235V320" stroke="#8b9693" stroke-width="2" stroke-dasharray="6 5"/><path d="M1035 235V285H775V320" stroke="#b75c31" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#o)"/><path d="M635 366H560V270H777V235" stroke="#b75c31" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#o)"/><text x="42" y="478" font-family="system-ui" font-size="16" fill="#53646b">Admission observes load snapshots; it does not reserve GPU/KV capacity atomically.</text></svg>