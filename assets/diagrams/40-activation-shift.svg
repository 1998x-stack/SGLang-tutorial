<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" role="img"><title>Prompt 与 Decode 激活分布改变剪枝选择</title><desc>同一 W 与稀疏约束下，prompt-only 与联合校准的重建误差排序反转。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="700" height="360" rx="10" fill="#faf9f5"/><g font-family="system-ui,sans-serif" fill="#243243"><text x="350" y="29" font-size="19" text-anchor="middle" font-weight="700">Prompt 与 Decode 激活分布改变剪枝选择</text><path d="M215 94H260" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M215 204H260" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M450 94H470V140H490" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M450 204H470V178H490" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><rect x="25" y="65" width="190" height="59" rx="5" fill="#eef1f4" stroke="#65758a"/><text x="120" y="89.5" font-size="16" text-anchor="middle">Prompt x=[3,0]</text><text x="120" y="109.5" font-size="16" text-anchor="middle">只看输入</text><rect x="25" y="175" width="190" height="59" rx="5" fill="#e0f4ef" stroke="#167b70"/><text x="120" y="199.5" font-size="16" text-anchor="middle">Decode x=[0,4]</text><text x="120" y="219.5" font-size="16" text-anchor="middle">on-policy</text><rect x="260" y="65" width="190" height="59" rx="5" fill="#fff0dc" stroke="#b36b23"/><text x="355" y="89.5" font-size="16" text-anchor="middle">留 W₁：误差 0</text><text x="355" y="109.5" font-size="16" text-anchor="middle">留 W₂：误差 9</text><rect x="260" y="175" width="190" height="59" rx="5" fill="#fff0dc" stroke="#b36b23"/><text x="355" y="199.5" font-size="16" text-anchor="middle">留 W₁：误差 16</text><text x="355" y="219.5" font-size="16" text-anchor="middle">留 W₂：误差 0</text><rect x="490" y="119" width="185" height="79" rx="5" fill="#eee8fa" stroke="#7858ae"/><text x="582.5" y="153.5" font-size="16" text-anchor="middle">联合误差 16 vs 9</text><text x="582.5" y="173.5" font-size="16" text-anchor="middle">选择留 W₂</text><text x="350" y="285" text-anchor="middle" font-size="15">W=[1,1]，只能保留一个权重（toy）</text><text x="350" y="315" text-anchor="middle" font-size="15">校准样本改变重建误差排序，不是实测剪枝</text></g></svg>