<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="g29b-title g29b-desc"><title id="g29b-title">Prebuilt speculative runtime states</title><desc id="g29b-desc">Each candidate step owns a compatible set of draft, target verification, extend backends and graph runners; switching swaps the complete state.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#527b79"/></marker></defs><rect width="1080" height="560" rx="18" fill="#fbfdfc"/><path d="M 180 220 L 465 345" stroke="#527b79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 540 220 L 540 345" stroke="#527b79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 900 220 L 615 345" stroke="#527b79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g><rect x="45" y="70" width="270" height="150" rx="15" fill="#eaf4f1" stroke="#477d78" stroke-width="2"/><text x="180" y="101" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">Step 1</text><text x="180" y="126" text-anchor="middle" font-size="15" fill="#35585a">Draft / Verify / Extend</text><text x="180" y="149" text-anchor="middle" font-size="15" fill="#35585a">CUDA Graph runners</text></g><g><rect x="405" y="70" width="270" height="150" rx="15" fill="#f3f0fb" stroke="#7564a0" stroke-width="2"/><text x="540" y="101" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">Step 3</text><text x="540" y="126" text-anchor="middle" font-size="15" fill="#35585a">Draft / Verify / Extend</text><text x="540" y="149" text-anchor="middle" font-size="15" fill="#35585a">CUDA Graph runners</text></g><g><rect x="765" y="70" width="270" height="150" rx="15" fill="#fff3e9" stroke="#c98246" stroke-width="2"/><text x="900" y="101" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">Step 5</text><text x="900" y="126" text-anchor="middle" font-size="15" fill="#35585a">Draft / Verify / Extend</text><text x="900" y="149" text-anchor="middle" font-size="15" fill="#35585a">CUDA Graph runners</text></g><g><rect x="370" y="345" width="340" height="120" rx="15" fill="#edf5f3" stroke="#477d78" stroke-width="2"/><text x="540" y="376" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">AdaptiveController</text><text x="540" y="401" text-anchor="middle" font-size="15" fill="#35585a">Atomic state reference swap</text></g></svg>