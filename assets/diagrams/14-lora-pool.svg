<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">LoRA Host/GPU pool、pinning 与 eviction</title><desc id="desc">Host 保存 adapter；GPU pool 容量有限，base-model None slot 也计入 max_loras_per_batch。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#147f80"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#b75c31"/></marker></defs><rect width="1200" height="520" rx="20" fill="#fffdf9"/><text x="42" y="45" font-family="system-ui,sans-serif" font-size="23" font-weight="750" fill="#1d3035" text-anchor="start">Adapter residency：容量有限，调度必须决定谁留在 GPU</text>
<rect x="55" y="110" width="280" height="290" rx="12" fill="#f5f5f2" stroke="#8b9693" stroke-width="2"/><text x="195" y="150" font-family="system-ui,sans-serif" font-size="20" font-weight="750" fill="#53646b" text-anchor="middle">CPU / Host</text>
<rect x="95" y="180" width="200" height="36" rx="12" fill="#ffffff" stroke="#cbd7d4" stroke-width="2"/><text x="195" y="204" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#1d3035" text-anchor="middle">A · adapter</text><rect x="95" y="228" width="200" height="36" rx="12" fill="#ffffff" stroke="#cbd7d4" stroke-width="2"/><text x="195" y="252" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#1d3035" text-anchor="middle">B · adapter</text><rect x="95" y="276" width="200" height="36" rx="12" fill="#ffffff" stroke="#cbd7d4" stroke-width="2"/><text x="195" y="300" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#1d3035" text-anchor="middle">C · adapter</text><rect x="95" y="324" width="200" height="36" rx="12" fill="#ffffff" stroke="#cbd7d4" stroke-width="2"/><text x="195" y="348" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#1d3035" text-anchor="middle">D · adapter</text>
<line x1="335" y1="255" x2="455" y2="255" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/><text x="395" y="235" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#147f80" text-anchor="middle">H2D</text>
<rect x="470" y="110" width="370" height="290" rx="12" fill="#e5f3ef" stroke="#147f80" stroke-width="2"/><text x="655" y="150" font-family="system-ui,sans-serif" font-size="20" font-weight="750" fill="#147f80" text-anchor="middle">GPU adapter slots</text>
<rect x="515" y="180" width="130" height="78" rx="12" fill="#d8efeb" stroke="#147f80" stroke-width="2"/><text x="580" y="215" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#1d3035" text-anchor="middle">base / None</text><text x="580" y="240" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#53646b" text-anchor="middle">reserved</text>
<rect x="665" y="180" width="130" height="78" rx="12" fill="#eee9f7" stroke="#7059aa" stroke-width="2"/><text x="730" y="215" font-family="system-ui,sans-serif" font-size="19" font-weight="750" fill="#7059aa" text-anchor="middle">A</text><text x="730" y="240" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#53646b" text-anchor="middle">LRU</text>
<rect x="515" y="280" width="130" height="78" rx="12" fill="#fff0e6" stroke="#b75c31" stroke-width="2"/><text x="580" y="315" font-family="system-ui,sans-serif" font-size="19" font-weight="750" fill="#b75c31" text-anchor="middle">B</text><text x="580" y="340" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#53646b" text-anchor="middle">pinned</text>
<rect x="665" y="280" width="130" height="78" rx="12" fill="#f0f1ef" stroke="#8b9693" stroke-width="2"/><text x="730" y="315" font-family="system-ui,sans-serif" font-size="16" font-weight="650" fill="#53646b" text-anchor="middle">slot free</text>
<line x1="840" y1="255" x2="920" y2="255" stroke="#b75c31" stroke-width="3" marker-end="url(#o)"/><rect x="930" y="190" width="230" height="130" rx="12" fill="#fff4ed" stroke="#b75c31" stroke-width="2"/><text x="1045" y="230" font-family="system-ui,sans-serif" font-size="17" font-weight="750" fill="#b75c31" text-anchor="middle">Waiting request</text><text x="1045" y="265" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#1d3035" text-anchor="middle">C needs a slot</text><text x="1045" y="295" font-family="system-ui,sans-serif" font-size="15" font-weight="550" fill="#53646b" text-anchor="middle">evict or wait</text>
<text x="55" y="475" font-family="system-ui,sans-serif" font-size="15" font-weight="500" fill="#53646b" text-anchor="start">Pinning 保护 adapter；异步 H2D loading 可尝试与 compute overlap，但需要 backend / buffer 支持。</text></svg>