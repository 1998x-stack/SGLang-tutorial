<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">EPD 多模态 embeddings 与语言 KV 的数据流</title><desc id="desc">Image 经过 Encoder 得到 multimodal embeddings，传到 Prefill 创建语言模型 KV，再交给 Decode；embedding cache 与 KV cache 分离。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#147f80"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#b75c31"/></marker></defs><rect width="1200" height="520" rx="20" fill="#fffdf9"/><text x="42" y="45" font-family="system-ui,sans-serif" font-size="23" font-weight="750" fill="#1d3035" text-anchor="start">图像输入如何变成 Decode 可消费的 KV？</text>
<rect x="35" y="145" width="165" height="110" rx="12" fill="#f0f1ef" stroke="#8b9693" stroke-width="2"/><text x="117" y="188" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#53646b" text-anchor="middle">Image / Video</text><text x="117" y="220" font-family="system-ui,sans-serif" font-size="15" font-weight="500" fill="#53646b" text-anchor="middle">media input</text>
<rect x="250" y="145" width="180" height="110" rx="12" fill="#eee9f7" stroke="#7059aa" stroke-width="2"/><text x="340" y="188" font-family="system-ui,sans-serif" font-size="20" font-weight="750" fill="#7059aa" text-anchor="middle">Encoder</text><text x="340" y="220" font-family="system-ui,sans-serif" font-size="15" font-weight="500" fill="#53646b" text-anchor="middle">ViT / preprocess</text>
<rect x="480" y="145" width="190" height="110" rx="12" fill="#d8efeb" stroke="#147f80" stroke-width="2"/><text x="575" y="188" font-family="system-ui,sans-serif" font-size="19" font-weight="750" fill="#147f80" text-anchor="middle">Embeddings</text><text x="575" y="220" font-family="system-ui,sans-serif" font-size="15" font-weight="500" fill="#53646b" text-anchor="middle">multimodal features</text>
<rect x="720" y="145" width="165" height="110" rx="12" fill="#fff0e6" stroke="#b75c31" stroke-width="2"/><text x="802" y="188" font-family="system-ui,sans-serif" font-size="20" font-weight="750" fill="#b75c31" text-anchor="middle">Prefill</text><text x="802" y="220" font-family="system-ui,sans-serif" font-size="15" font-weight="500" fill="#53646b" text-anchor="middle">build KV</text>
<rect x="935" y="145" width="220" height="110" rx="12" fill="#d8efeb" stroke="#147f80" stroke-width="2"/><text x="1045" y="188" font-family="system-ui,sans-serif" font-size="20" font-weight="750" fill="#147f80" text-anchor="middle">Decode</text><text x="1045" y="220" font-family="system-ui,sans-serif" font-size="15" font-weight="500" fill="#53646b" text-anchor="middle">autoregressive tokens</text>
<line x1="200" y1="200" x2="250" y2="200" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/><line x1="430" y1="200" x2="480" y2="200" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/><line x1="670" y1="200" x2="720" y2="200" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/><line x1="885" y1="200" x2="935" y2="200" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/>
<rect x="235" y="330" width="380" height="95" rx="12" fill="#f1eff8" stroke="#7059aa" stroke-width="2"/><text x="425" y="368" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#7059aa" text-anchor="middle">Global multimodal embedding cache</text><text x="425" y="398" font-family="system-ui,sans-serif" font-size="15" font-weight="500" fill="#53646b" text-anchor="middle">stores Encoder outputs</text>
<rect x="735" y="330" width="380" height="95" rx="12" fill="#fff4ed" stroke="#b75c31" stroke-width="2"/><text x="925" y="368" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#b75c31" text-anchor="middle">HiCache / KV Cache</text><text x="925" y="398" font-family="system-ui,sans-serif" font-size="15" font-weight="500" fill="#53646b" text-anchor="middle">stores language-model KV</text>
