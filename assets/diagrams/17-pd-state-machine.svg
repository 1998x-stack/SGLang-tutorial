<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">PD disaggregation dual-side request lifecycle</title><desc id="d">Prefill sender advances from bootstrap queue to waiting, prefill, and transfer queue; Decode receiver advances from handshake and allocation to transfer, waiting, and decode.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#147f80"/></marker></defs><rect width="1200" height="560" rx="20" fill="#fffdf9"/><text x="40" y="45" font-family="system-ui" font-size="24" font-weight="700" fill="#20363b">One request, two schedulers, one KV handoff</text><text x="42" y="105" font-family="system-ui" font-size="18" font-weight="700" fill="#b75c31">PREFILL SIDE</text><text x="42" y="335" font-family="system-ui" font-size="18" font-weight="700" fill="#147f80">DECODE SIDE</text><g font-family="system-ui" text-anchor="middle" font-size="17"><rect x="50" y="135" width="220" height="90" rx="12" fill="#fff0e6" stroke="#b75c31" stroke-width="2"/><text x="160" y="170" fill="#b75c31" font-weight="700">Bootstrap queue</text><text x="160" y="198" fill="#53646b">sender / handshake</text><rect x="345" y="135" width="200" height="90" rx="12" fill="#f0f1ef" stroke="#8b9693" stroke-width="2"/><text x="445" y="170" fill="#53646b" font-weight="700">Waiting queue</text><text x="445" y="198" fill="#53646b">admitted to prefill</text><rect x="620" y="135" width="200" height="90" rx="12" fill="#fff0e6" stroke="#b75c31" stroke-width="2"/><text x="720" y="170" fill="#b75c31" font-weight="700">Prefill</text><text x="720" y="198" fill="#53646b">compute prompt KV</text><rect x="895" y="135" width="245" height="90" rx="12" fill="#eee9f7" stroke="#7059aa" stroke-width="2"/><text x="1017" y="170" fill="#7059aa" font-weight="700">Transfer queue</text><text x="1017" y="198" fill="#53646b">poll async sender</text><rect x="50" y="365" width="220" height="90" rx="12" fill="#e8f1f0" stroke="#147f80" stroke-width="2"/><text x="160" y="400" fill="#147f80" font-weight="700">Receiver init</text><text x="160" y="428" fill="#53646b">bootstrap metadata</text><rect x="345" y="365" width="200" height="90" rx="12" fill="#e8f1f0" stroke="#147f80" stroke-width="2"/><text x="445" y="400" fill="#147f80" font-weight="700">KV allocation</text><text x="445" y="428" fill="#53646b">destination slots</text><rect x="620" y="365" width="200" height="90" rx="12" fill="#eee9f7" stroke="#7059aa" stroke-width="2"/><text x="720" y="400" fill="#7059aa" font-weight="700">Transfer queue</text><text x="720" y="428" fill="#53646b">poll receiver</text><rect x="895" y="365" width="245" height="90" rx="12" fill="#d8efeb" stroke="#147f80" stroke-width="2"/><text x="1017" y="400" fill="#147f80" font-weight="700">Waiting → Decode</text><text x="1017" y="428" fill="#53646b">only after success</text></g><g stroke="#147f80" stroke-width="3" marker-end="url(#a)"><line x1="270" y1="180" x2="345" y2="180"/><line x1="545" y1="180" x2="620" y2="180"/><line x1="820" y1="180" x2="895" y2="180"/><line x1="270" y1="410" x2="345" y2="410"/><line x1="545" y1="410" x2="620" y2="410"/><line x1="820" y1="410" x2="895" y2="410"/></g><path d="M160 225V285H160V365" stroke="#7059aa" stroke-width="3" stroke-dasharray="7 5" fill="none"/><path d="M1017 225V285H720V365" stroke="#7059aa" stroke-width="3" stroke-dasharray="7 5" fill="none"/><text x="600" y="520" font-family="system-ui" font-size="15" fill="#53646b" text-anchor="middle">Control-plane bootstrap is distinct from the asynchronous KV data transfer.</text></svg>