<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">DeepEP normal and low latency dispatch modes</title><desc id="d">Normal mode uses throughput-oriented dispatch for larger prefill batches; low latency mode uses smaller message paths and CUDA Graph compatible decode behavior. Runtime auto mode can switch by phase.</desc><rect width="1200" height="500" rx="20" fill="#fffdf9"/><text x="40" y="45" font-family="system-ui" font-size="24" font-weight="700" fill="#20363b">Different phases have different communication regimes</text><rect x="55" y="105" width="495" height="300" rx="16" fill="#fff0e6" stroke="#b75c31" stroke-width="2"/><rect x="650" y="105" width="495" height="300" rx="16" fill="#e8f1f0" stroke="#147f80" stroke-width="2"/><g font-family="system-ui" text-anchor="middle"><text x="302" y="150" font-size="22" font-weight="700" fill="#b75c31">NORMAL</text><text x="897" y="150" font-size="22" font-weight="700" fill="#147f80">LOW LATENCY</text><rect x="120" y="190" width="365" height="72" rx="10" fill="#fffdf9" stroke="#b75c31"/><text x="302" y="233" font-size="18" fill="#b75c31">large token batches / Prefill</text><rect x="715" y="190" width="365" height="72" rx="10" fill="#fffdf9" stroke="#147f80"/><text x="897" y="233" font-size="18" fill="#147f80">small decode batches</text><text x="302" y="310" font-size="16" fill="#53646b">high-throughput dispatch</text><text x="302" y="340" font-size="16" fill="#53646b">NVLink / RDMA buffer planning</text><text x="897" y="310" font-size="16" fill="#53646b">low message latency</text><text x="897" y="340" font-size="16" fill="#53646b">CUDA Graph compatible path</text></g><rect x="420" y="425" width="360" height="48" rx="10" fill="#eee9f7" stroke="#7059aa" stroke-width="2"/><text x="600" y="456" font-family="system-ui" font-size="18" font-weight="700" text-anchor="middle" fill="#7059aa">--deepep-mode auto</text><path d="M302 405V425H420" stroke="#b75c31" stroke-width="2.5" fill="none"/><path d="M897 405V425H780" stroke="#147f80" stroke-width="2.5" fill="none"/></svg>