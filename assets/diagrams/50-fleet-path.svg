<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" role="img"><title>Kubernetes 推理入口与 SGLang worker</title><desc>Gateway / EPP 选择 ready worker；KV event index 反馈缓存位置。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="700" height="360" rx="10" fill="#faf9f5"/><g font-family="system-ui,sans-serif" fill="#243243"><text x="350" y="29" font-size="19" text-anchor="middle" font-weight="700">Kubernetes 推理入口与 SGLang worker</text><path d="M210 92H258" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M490 92H443" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M350 120V173H185V230" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M350 173H515V230" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#a)"/><path d="M315 259H350V151H582V120" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#a)"/><path d="M515 230V186H620V120" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#a)"/><rect x="25" y="65" width="185" height="55" rx="5" fill="#eef1f4" stroke="#65758a"/><text x="117.5" y="87.5" font-size="16" text-anchor="middle">Gateway / Route</text><text x="117.5" y="107.5" font-size="16" text-anchor="middle">request ingress</text><rect x="258" y="65" width="185" height="55" rx="5" fill="#fff0dc" stroke="#b36b23"/><text x="350.5" y="87.5" font-size="16" text-anchor="middle">InferencePool / EPP</text><text x="350.5" y="107.5" font-size="16" text-anchor="middle">pick Ready endpoint</text><rect x="490" y="65" width="185" height="55" rx="5" fill="#eee8fa" stroke="#7858ae"/><text x="582.5" y="87.5" font-size="16" text-anchor="middle">KV event index</text><text x="582.5" y="107.5" font-size="16" text-anchor="middle">resident metadata</text><rect x="55" y="230" width="260" height="57" rx="5" fill="#e0f4ef" stroke="#167b70"/><text x="185" y="253.5" font-size="16" text-anchor="middle">SGLang replica A</text><text x="185" y="273.5" font-size="16" text-anchor="middle">scheduler + KV + model</text><rect x="385" y="230" width="260" height="57" rx="5" fill="#e0f4ef" stroke="#167b70"/><text x="515" y="253.5" font-size="16" text-anchor="middle">SGLang replica B</text><text x="515" y="273.5" font-size="16" text-anchor="middle">scheduler + KV + model</text><text x="350" y="209" text-anchor="middle" font-size="15">route to one eligible worker</text><text x="350" y="325" text-anchor="middle" font-size="15">事件索引提供位置估计；不搬运 tensor</text></g></svg>