<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 385" role="img" aria-labelledby="t d"><title id="t">共置与分离式推理的端到端关键路径</title><desc id="d">两条流水线示意只列工作类别：共置需要排队、Prefill、Decode；分离另有 KV transfer、不同 worker 队列。块宽不是测量值。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607a7b"/></marker></defs><rect width="960" height="385" rx="16" fill="#fbfdfc"/><text x="480" y="42" font-size="22" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#203b3f">分离能减少争用，却新增传输与多处排队</text><text x="30" y="112" font-size="16" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#53666a">共置</text><text x="30" y="270" font-size="16" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#53666a">分离</text><text x="480" y="358" font-size="16" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#53666a">所有延迟结论需实测；宽度不表示真实耗时</text><path d="M337 106L352 106" fill="none" stroke="#147f80" stroke-width="3"  marker-end="url(#arr)"/><path d="M531 106L546 106" fill="none" stroke="#147f80" stroke-width="3"  marker-end="url(#arr)"/><path d="M320 259L331 259" fill="none" stroke="#147f80" stroke-width="3"  marker-end="url(#arr)"/><path d="M493 259L506 259" fill="none" stroke="#7459a9" stroke-width="3"  marker-end="url(#arr)"/><path d="M668 259L679 259" fill="none" stroke="#147f80" stroke-width="3"  marker-end="url(#arr)"/><rect x="162" y="65" width="175" height="80" rx="12" fill="#f0f2f2" stroke="#81918f" stroke-width="2"/><text x="249.5" y="95" font-size="18" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#243e42">Queue</text><text x="249.5" y="121" font-size="14" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#435a60">等待</text><rect x="356" y="65" width="175" height="80" rx="12" fill="#fff0e4" stroke="#c16b37" stroke-width="2"/><text x="443.5" y="95" font-size="18" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#243e42">Prefill</text><text x="443.5" y="121" font-size="14" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#435a60">输入计算</text><rect x="550" y="65" width="290" height="80" rx="12" fill="#e0f4f0" stroke="#147f80" stroke-width="2"/><text x="695" y="95" font-size="18" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#243e42">Decode</text><text x="695" y="121" font-size="14" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#435a60">生成输出</text><rect x="162" y="218" width="158" height="80" rx="12" fill="#f0f2f2" stroke="#81918f" stroke-width="2"/><text x="241" y="248" font-size="18" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#243e42">Queue</text><text x="241" y="274" font-size="14" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#435a60">等待</text><rect x="335" y="218" width="158" height="80" rx="12" fill="#fff0e4" stroke="#c16b37" stroke-width="2"/><text x="414" y="248" font-size="18" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#243e42">Prefill</text><text x="414" y="274" font-size="14" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#435a60">独立实例</text><rect x="510" y="218" width="158" height="80" rx="12" fill="#eee9f9" stroke="#7459a9" stroke-width="2"/><text x="589" y="248" font-size="18" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#243e42">KV Xfer</text><text x="589" y="274" font-size="14" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#435a60">传输同步</text><rect x="683" y="218" width="158" height="80" rx="12" fill="#e0f4f0" stroke="#147f80" stroke-width="2"/><text x="762" y="248" font-size="18" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#243e42">Decode</text><text x="762" y="274" font-size="14" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#435a60">独立实例</text></svg>