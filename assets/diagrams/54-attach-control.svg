<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" role="img"><title>Attach/Detach 控制面路径</title><desc>Admin API fanout 后由每个 scheduler 检查 idle，再管理 L3 backend。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="700" height="360" rx="10" fill="#faf9f5"/><g font-family="system-ui,sans-serif" fill="#243243"><text x="350" y="29" font-size="19" text-anchor="middle" font-weight="700">Attach/Detach 控制面路径</text><path d="M215 92H255" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><path d="M445 92H485" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><path d="M582 120V228" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><path d="M485 255H445" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><path d="M255 255H215" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="65" width="195" height="55" rx="5" fill="#eef1f4" stroke="#65758a"/><text x="117.5" y="87.5" font-size="16" text-anchor="middle">Admin HTTP</text><text x="117.5" y="107.5" font-size="16" text-anchor="middle">PUT / DELETE</text><rect x="255" y="65" width="190" height="55" rx="5" fill="#fff0dc" stroke="#b36b23"/><text x="350" y="87.5" font-size="16" text-anchor="middle">Tokenizer fanout</text><text x="350" y="107.5" font-size="16" text-anchor="middle">DP scheduler</text><rect x="485" y="65" width="195" height="55" rx="5" fill="#eee8fa" stroke="#7858ae"/><text x="582.5" y="87.5" font-size="16" text-anchor="middle">Strict idle?</text><text x="582.5" y="107.5" font-size="16" text-anchor="middle">reject if busy</text><rect x="485" y="228" width="195" height="55" rx="5" fill="#e0f4ef" stroke="#167b70"/><text x="582.5" y="250.5" font-size="16" text-anchor="middle">StorageAttachment</text><text x="582.5" y="270.5" font-size="16" text-anchor="middle">controller</text><rect x="255" y="228" width="190" height="55" rx="5" fill="#e0f4ef" stroke="#167b70"/><text x="350" y="250.5" font-size="16" text-anchor="middle">L3 Backend</text><text x="350" y="270.5" font-size="16" text-anchor="middle">threads / config</text><rect x="20" y="228" width="195" height="55" rx="5" fill="#eef1f4" stroke="#65758a"/><text x="117.5" y="250.5" font-size="16" text-anchor="middle">Aggregate result</text><text x="117.5" y="270.5" font-size="16" text-anchor="middle">all ranks success</text><text x="350" y="172" font-size="15" text-anchor="middle">无 running / queued / inflight 请求</text><text x="350" y="325" font-size="15" text-anchor="middle">部分 rank 成功时没有自动全局 rollback</text></g></svg>