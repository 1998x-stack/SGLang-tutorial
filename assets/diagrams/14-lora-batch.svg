<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Multi-LoRA 异构 batch 与共享 base model</title><desc id="desc">多个请求共享 base model，但按请求选择不同 LoRA 低秩 adapter 分支。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#147f80"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#b75c31"/></marker></defs><rect width="1200" height="520" rx="20" fill="#fffdf9"/><text x="42" y="45" font-family="system-ui,sans-serif" font-size="23" font-weight="750" fill="#1d3035" text-anchor="start">一个 batch 可以同时包含多个 adapter 与 base-model 请求</text>
<rect x="55" y="90" width="180" height="55" rx="12" fill="#d8efeb" stroke="#cbd7d4" stroke-width="2"/><text x="145" y="124" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#1d3035" text-anchor="middle">req0 · A</text><rect x="55" y="175" width="180" height="55" rx="12" fill="#e7e1f4" stroke="#cbd7d4" stroke-width="2"/><text x="145" y="209" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#1d3035" text-anchor="middle">req1 · B</text><rect x="55" y="260" width="180" height="55" rx="12" fill="#f0f1ef" stroke="#cbd7d4" stroke-width="2"/><text x="145" y="294" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#1d3035" text-anchor="middle">req2 · base</text><rect x="55" y="345" width="180" height="55" rx="12" fill="#d8efeb" stroke="#cbd7d4" stroke-width="2"/><text x="145" y="379" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#1d3035" text-anchor="middle">req3 · A</text>
<line x1="235" y1="118" x2="350" y2="240" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/><line x1="235" y1="203" x2="350" y2="260" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/><line x1="235" y1="288" x2="350" y2="280" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/><line x1="235" y1="373" x2="350" y2="300" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/>
<rect x="355" y="160" width="260" height="190" rx="12" fill="#f3f8f6" stroke="#147f80" stroke-width="2"/><text x="485" y="205" font-family="system-ui,sans-serif" font-size="20" font-weight="750" fill="#147f80" text-anchor="middle">Shared base model</text><text x="485" y="245" font-family="system-ui,sans-serif" font-size="17" font-weight="600" fill="#1d3035" text-anchor="middle">W · attention · FFN</text><text x="485" y="290" font-family="system-ui,sans-serif" font-size="16" font-weight="550" fill="#53646b" text-anchor="middle">base output</text>
<line x1="615" y1="210" x2="735" y2="130" stroke="#7059aa" stroke-width="3" marker-end="url(#a)"/><line x1="615" y1="255" x2="735" y2="255" stroke="#7059aa" stroke-width="3" marker-end="url(#a)"/><line x1="615" y1="300" x2="735" y2="380" stroke="#7059aa" stroke-width="3" marker-end="url(#a)"/>
<rect x="745" y="82" width="190" height="95" rx="12" fill="#eee9f7" stroke="#7059aa" stroke-width="2"/><text x="840" y="120" font-family="system-ui,sans-serif" font-size="18" font-weight="750" fill="#7059aa" text-anchor="middle">Adapter A</text><text x="840" y="150" font-family="system-ui,sans-serif" font-size="17" font-weight="650" fill="#1d3035" text-anchor="middle">Bₐ Aₐ</text>
<rect x="745" y="212" width="190" height="95" rx="12" fill="#eee9f7" stroke="#7059aa" stroke-width="2"/><text x="840" y="250" font-family="system-ui,sans-serif" font-size="18" font-weight="750" fill="#7059aa" text-anchor="middle">Adapter B</text><text x="840" y="280" font-family="system-ui,sans-serif" font-size="17" font-weight="650" fill="#1d3035" text-anchor="middle">Bᵦ Aᵦ</text>
<rect x="745" y="342" width="190" height="95" rx="12" fill="#f0f1ef" stroke="#8b9693" stroke-width="2"/><text x="840" y="380" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#53646b" text-anchor="middle">No adapter</text><text x="840" y="410" font-family="system-ui,sans-serif" font-size="16" font-weight="550" fill="#53646b" text-anchor="middle">base only</text>
<line x1="935" y1="130" x2="1025" y2="245" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/><line x1="935" y1="260" x2="1025" y2="260" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/><line x1="935" y1="390" x2="1025" y2="275" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/>
<rect x="1030" y="205" width="135" height="125" rx="12" fill="#fff4ed" stroke="#b75c31" stroke-width="2"/><text x="1097" y="250" font-family="system-ui,sans-serif" font-size="18" font-weight="750" fill="#b75c31" text-anchor="middle">Merge</text><text x="1097" y="280" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#1d3035" text-anchor="middle">base + ΔW</text>
<text x="55" y="490" font-family="system-ui,sans-serif" font-size="15" font-weight="500" fill="#53646b" text-anchor="start">adapter identity 决定低秩分支；batching 处理异构 adapter，而不是复制整份 base model。</text></svg>