<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" role="img"><title>三类层的状态布局</title><desc>Full KV 保存历史行；SWA 只保留窗口；循环层保存边界 checkpoint 和当前状态。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="700" height="360" rx="12" fill="#faf9f5"/><g font-family="system-ui, sans-serif" fill="#243243"><text x="350" y="28" text-anchor="middle" font-size="19" font-weight="700">三类层的状态布局</text><path d="M125 115V155" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><path d="M350 115V155" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><path d="M575 115V155" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><path d="M125 235V260H350V285" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><path d="M350 235V285" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><path d="M575 235V260H350" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="30" y="65" width="190" height="50" rx="7" fill="#fff0dc" stroke="#b36b23" stroke-width="1.5"/><text x="125" y="95" font-size="16" text-anchor="middle">Full attention</text><rect x="255" y="65" width="190" height="50" rx="7" fill="#fff0dc" stroke="#b36b23" stroke-width="1.5"/><text x="350" y="95" font-size="16" text-anchor="middle">Sliding window</text><rect x="480" y="65" width="190" height="50" rx="7" fill="#fff0dc" stroke="#b36b23" stroke-width="1.5"/><text x="575" y="95" font-size="16" text-anchor="middle">Recurrent layer</text><rect x="30" y="155" width="190" height="80" rx="7" fill="#eee8fa" stroke="#7858ae" stroke-width="1.5"/><text x="125" y="189.5" font-size="16" text-anchor="middle">KV 0…t</text><text x="125" y="210.5" font-size="16" text-anchor="middle">全历史</text><rect x="255" y="155" width="190" height="80" rx="7" fill="#eee8fa" stroke="#7858ae" stroke-width="1.5"/><text x="350" y="189.5" font-size="16" text-anchor="middle">KV t-W+1…t</text><text x="350" y="210.5" font-size="16" text-anchor="middle">活跃窗口</text><rect x="480" y="155" width="190" height="80" rx="7" fill="#eee8fa" stroke="#7858ae" stroke-width="1.5"/><text x="575" y="189.5" font-size="16" text-anchor="middle">S(t-1) → S(t)</text><text x="575" y="210.5" font-size="16" text-anchor="middle">checkpoint + work</text><rect x="255" y="285" width="190" height="45" rx="7" fill="#e0f4ef" stroke="#167b70" stroke-width="1.5"/><text x="350" y="312.5" font-size="16" text-anchor="middle">请求可继续</text><text x="350" y="137" font-size="15" text-anchor="middle">每类层独立的状态语义</text></g></svg>