<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc"><title id="title">KV cache quantization 是写入时量化、读取时由 attention backend 消费</title><desc id="desc">K and V tensors are quantized with recipe-specific scales before entering the KV pool. At read time the attention backend must support native packed data or a fused/dequant workspace path.</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#627c7c"/></marker></defs><rect width="1000" height="470" rx="16" fill="#fbfdfc"/><text x="500" y="42" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#203b40">KV 量化的关键不是压缩完成，而是 attention 能否高效读取</text><rect x="35" y="125" width="165" height="85" rx="12" fill="#f0f3f2" stroke="#81918f" stroke-width="2"/><text x="117.5" y="155" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">K / V tensors</text><text x="117.5" y="180" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">BF16 / FP16</text><rect x="255" y="125" width="180" height="85" rx="12" fill="#fff0e4" stroke="#bd6738" stroke-width="2"/><text x="345" y="155" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Quant method</text><text x="345" y="180" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">FP8 / NVFP4</text><rect x="500" y="125" width="185" height="85" rx="12" fill="#eee9f8" stroke="#7258a8" stroke-width="2"/><text x="592.5" y="155" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Paged KV pool</text><text x="592.5" y="180" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">packed data + scales</text><rect x="755" y="65" width="210" height="95" rx="12" fill="#e2f4f0" stroke="#147f80" stroke-width="2"/><text x="860" y="95" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Native access</text><text x="860" y="120" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">backend reads packed KV</text><rect x="755" y="230" width="210" height="95" rx="12" fill="#fff0e4" stroke="#bd6738" stroke-width="2"/><text x="860" y="260" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#203b40">Workspace access</text><text x="860" y="285" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4a6267">dequantize → attention</text><path d="M200 165 L250 165" fill="none" stroke="#81918f" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M435 165 L495 165" fill="none" stroke="#bd6738" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M685 165 L745 115" fill="none" stroke="#147f80" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M685 165 L745 275" fill="none" stroke="#bd6738" stroke-width="2.5"  marker-end="url(#arr)"/><text x="500" y="385" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#8e4d2b">若 backend 需要逐元素解量化且不能融合，节省的显存可能换来更慢的 attention</text><text x="500" y="440" font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#627274">KV dtype、scale recipe、page size、head dimension 与 backend 必须一起核对</text></svg>