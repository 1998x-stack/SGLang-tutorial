<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 375" role="img" aria-labelledby="t d"><title id="t">前缀 KV 缓存的概念生命周期</title><desc id="d">匹配公共前缀后保护在用节点，计算缺失后缀；任务完成后释放保护，符合回收条件的空闲节点可以被逐出。不是实现类的一比一状态机。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607a7b"/></marker></defs><rect width="960" height="375" rx="16" fill="#fbfdfc"/><text x="480" y="44" font-size="22" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#203b3f">命中不是缓存永久保留：引用与回收有先后关系</text><text x="480" y="363" font-size="16" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#53666a">锁 / LRU / split 的具体实现需核对固定版本</text><path d="M223 144L262 144" fill="none" stroke="#7459a9" stroke-width="3"  marker-end="url(#arr)"/><path d="M460 144L497 144" fill="none" stroke="#c16b37" stroke-width="3"  marker-end="url(#arr)"/><path d="M695 144L733 144" fill="none" stroke="#147f80" stroke-width="3"  marker-end="url(#arr)"/><path d="M363 184L268 246" fill="none" stroke="#7459a9" stroke-width="3"  marker-end="url(#arr)"/><path d="M831 184L691 246" fill="none" stroke="#81918f" stroke-width="3"  marker-end="url(#arr)"/><rect x="29" y="103" width="194" height="80" rx="12" fill="#eee9f9" stroke="#7459a9" stroke-width="2"/><text x="126" y="133" font-size="18" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#243e42">1 · match</text><text x="126" y="159" font-size="14" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#435a60">寻找可复用 prefix</text><rect x="266" y="103" width="194" height="80" rx="12" fill="#eee9f9" stroke="#7459a9" stroke-width="2"/><text x="363" y="133" font-size="18" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#243e42">2 · lock</text><text x="363" y="159" font-size="14" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#435a60">保护正在使用的 KV</text><rect x="501" y="103" width="194" height="80" rx="12" fill="#fff0e4" stroke="#c16b37" stroke-width="2"/><text x="598" y="133" font-size="18" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#243e42">3 · extend</text><text x="598" y="159" font-size="14" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#435a60">计算缺失 token</text><rect x="737" y="103" width="194" height="80" rx="12" fill="#e0f4f0" stroke="#147f80" stroke-width="2"/><text x="834" y="133" font-size="18" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#243e42">4 · release</text><text x="834" y="159" font-size="14" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#435a60">释放 / 后续回收</text><rect x="121" y="251" width="294" height="75" rx="12" fill="#eee9f9" stroke="#7459a9" stroke-width="2"/><text x="268" y="281" font-size="18" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#243e42">in use</text><text x="268" y="307" font-size="14" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#435a60">不能任意驱逐</text><rect x="545" y="251" width="294" height="75" rx="12" fill="#f0f2f2" stroke="#81918f" stroke-width="2"/><text x="692" y="281" font-size="18" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#243e42">eligible</text><text x="692" y="307" font-size="14" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-weight="500" fill="#435a60">按策略回收空闲节点</text></svg>