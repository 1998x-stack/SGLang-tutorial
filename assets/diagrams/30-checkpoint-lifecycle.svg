<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="g30b-title g30b-desc"><title id="g30b-title">Checkpoint weight readiness lifecycle</title><desc id="g30b-desc">The server remains unready while dummy model initialization waits for external checkpoint workers to transfer and post-process real weights.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#527b79"/></marker></defs><rect width="1080" height="560" rx="18" fill="#fbfdfc"/><path d="M 215 272 L 275 272" stroke="#527b79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 455 272 L 515 272" stroke="#527b79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 695 272 L 755 272" stroke="#527b79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 905 272 L 950 272" stroke="#527b79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g><rect x="35" y="210" width="180" height="125" rx="15" fill="#edf5f3" stroke="#477d78" stroke-width="2"/><text x="125" y="241" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">Server start</text><text x="125" y="266" text-anchor="middle" font-size="15" fill="#35585a">Dummy weights</text></g><g><rect x="275" y="210" width="180" height="125" rx="15" fill="#fff3e9" stroke="#c98246" stroke-width="2"/><text x="365" y="241" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">Wait state</text><text x="365" y="266" text-anchor="middle" font-size="15" fill="#35585a">Not ready</text></g><g><rect x="515" y="210" width="180" height="125" rx="15" fill="#f3f0fb" stroke="#7564a0" stroke-width="2"/><text x="605" y="241" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">IPC update</text><text x="605" y="266" text-anchor="middle" font-size="15" fill="#35585a">Load real weights</text></g><g><rect x="755" y="210" width="150" height="125" rx="15" fill="#f3f0fb" stroke="#7564a0" stroke-width="2"/><text x="830" y="241" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">Post-load</text><text x="830" y="266" text-anchor="middle" font-size="15" fill="#35585a">Quant hooks</text></g><g><rect x="950" y="210" width="100" height="125" rx="15" fill="#eaf4f1" stroke="#477d78" stroke-width="2"/><text x="1000" y="241" text-anchor="middle" font-size="18" font-weight="700" fill="#193c3d">Ready</text><text x="1000" y="266" text-anchor="middle" font-size="15" fill="#35585a">Serve</text></g></svg>