<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc"><title id="title">MoE token routing 与 expert dispatch</title><desc id="desc">Router 为 token 选择 Top-K experts；token hidden states 通过 All-to-All 送往专家驻留 rank，计算后再 combine。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#147f80"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#b75c31"/></marker></defs><rect width="1200" height="540" rx="20" fill="#fffdf9"/><text x="42" y="48" font-family="system-ui,sans-serif" font-size="24" font-weight="750" fill="#1d3035" text-anchor="start">Router → Dispatch → Expert GEMM → Combine</text>
