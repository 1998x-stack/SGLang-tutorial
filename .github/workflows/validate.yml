name: SGLang visual tutorial · static, browser and Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sglang-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Structural tests / browser QA
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline test suite
        run: python3 -m unittest discover -s tests -v
      - name: CPU-only reproducible examples
        run: |
          python3 examples/prefix_match.py
          python3 examples/page_allocator.py
          python3 examples/chunk_budget.py
          python3 examples/online_softmax.py
          python3 examples/speculative_sampling.py
          python3 examples/parallel_topology.py
          python3 examples/moe_dispatch.py
          python3 examples/hicache_tiers.py
          python3 examples/lora_pool.py
          python3 examples/epd_pipeline.py
          python3 examples/router_policy.py
          python3 examples/pd_lifecycle.py
          python3 examples/mooncake_planes.py
          python3 examples/deepep_overlap.py
          python3 examples/lora_scheduler.py
          python3 examples/weight_quantization.py
          python3 examples/kv_cache_quantization.py
          python3 examples/cuda_graph_capture.py
          python3 examples/multimodal_pipeline.py
          python3 examples/serving_metrics.py
          python3 examples/grammar_mask.py
          python3 examples/tool_parser.py
          python3 examples/deterministic_inference.py
          python3 examples/adaptive_spec.py
          python3 examples/checkpoint_engine.py
          python3 examples/hisparse_working_set.py
          python3 examples/hybrid_pool_budget.py
          python3 examples/kv_sharing_pages.py
          python3 examples/paged_expert_waves.py
          python3 examples/rl_rollout_versions.py
          python3 examples/prefill_cp_layout.py
          python3 examples/dcp_lse_merge.py
          python3 examples/session_eviction.py
          python3 examples/unified_arena.py
          python3 examples/rac_calibration.py
          python3 examples/pipeline_chunking.py
          python3 examples/engram_lookup.py
          python3 examples/radix_policy.py
          python3 examples/rfork_readiness.py
          python3 examples/serving_simulation.py
          python3 examples/sampling_distribution.py
          python3 examples/checkpoint_shards.py
          python3 examples/streaming_detokenize.py
          python3 examples/reasoning_budget.py
          python3 examples/fleet_routing.py
      - name: Install Playwright Chromium
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Four-viewport browser and interaction QA
        run: python3 scripts/browser_qa.py --out reports/browser-qa
      - name: Upload screenshots and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa
          path: reports/
          if-no-files-found: ignore
      - name: Stage static Pages site
        run: |
          mkdir -p _site
          cp ./*.html _site/
          cp -R assets _site/assets
          cp -R examples _site/examples
          cp -R evidence _site/evidence
          touch _site/.nojekyll
          test -f _site/examples/page_allocator.py
          test -f _site/examples/chunk_budget.py
          test -f _site/examples/online_softmax.py
          test -f _site/examples/speculative_sampling.py
          test -f _site/examples/parallel_topology.py
          test -f _site/examples/moe_dispatch.py
          test -f _site/examples/hicache_tiers.py
          test -f _site/examples/lora_pool.py
          test -f _site/examples/epd_pipeline.py
          test -f _site/evidence/01.json
          test -f _site/evidence/06.json
          test -f _site/evidence/10.json
          test -f _site/evidence/11.json
          test -f _site/evidence/12.json
          test -f _site/evidence/13.json
          test -f _site/evidence/14.json
          test -f _site/evidence/15.json
          test -f _site/examples/router_policy.py
          test -f _site/examples/pd_lifecycle.py
          test -f _site/examples/mooncake_planes.py
          test -f _site/examples/deepep_overlap.py
          test -f _site/examples/lora_scheduler.py
          test -f _site/examples/weight_quantization.py
          test -f _site/examples/kv_cache_quantization.py
          test -f _site/examples/cuda_graph_capture.py
          test -f _site/examples/multimodal_pipeline.py
          test -f _site/examples/serving_metrics.py
          test -f _site/examples/grammar_mask.py
          test -f _site/examples/tool_parser.py
          test -f _site/examples/deterministic_inference.py
          test -f _site/examples/adaptive_spec.py
          test -f _site/examples/checkpoint_engine.py
          test -f _site/evidence/26.json
          test -f _site/evidence/27.json
          test -f _site/evidence/28.json
          test -f _site/evidence/29.json
          test -f _site/evidence/30.json
          test -f _site/examples/hisparse_working_set.py
          test -f _site/examples/hybrid_pool_budget.py
          test -f _site/examples/kv_sharing_pages.py
          test -f _site/examples/paged_expert_waves.py
          test -f _site/examples/rl_rollout_versions.py
          test -f _site/examples/prefill_cp_layout.py
          test -f _site/examples/dcp_lse_merge.py
          test -f _site/examples/session_eviction.py
          test -f _site/examples/unified_arena.py
          test -f _site/examples/rac_calibration.py
          test -f _site/examples/pipeline_chunking.py
          test -f _site/examples/engram_lookup.py
          test -f _site/examples/radix_policy.py
          test -f _site/examples/rfork_readiness.py
          test -f _site/examples/serving_simulation.py
          test -f _site/examples/sampling_distribution.py
          test -f _site/examples/checkpoint_shards.py
          test -f _site/examples/streaming_detokenize.py
          test -f _site/examples/reasoning_budget.py
          test -f _site/examples/fleet_routing.py
          test -f _site/evidence/21.json
          test -f _site/evidence/22.json
          test -f _site/evidence/23.json
          test -f _site/evidence/24.json
          test -f _site/evidence/25.json
          for i in $(seq -w 1 50); do test -f _site/$i.html; test -f _site/evidence/$i.json; done
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://1998x-stack.github.io/SGLang-tutorial/
    steps:
      - uses: actions/checkout@v4
      - name: Detect Pages Actions publishing
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type' 2>/dev/null || true)
          if [ "$mode" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Pages Actions publishing not configured; skipping deployment (mode=$mode)"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/deploy-pages@v4
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/setup-python@v5
        if: steps.pages.outputs.enabled == 'true'
        with:
          python-version: "3.12"
      - name: Public site smoke check
        if: steps.pages.outputs.enabled == 'true'
        run: python3 scripts/verify_deployment.py --base-url 'https://1998x-stack.github.io/SGLang-tutorial/'
