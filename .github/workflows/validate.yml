name: SGLang visual tutorial · static, browser and Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sglang-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Structural tests / browser QA
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline test suite
        run: python3 -m unittest discover -s tests -v
      - name: CPU-only reproducible prefix example
        run: python3 examples/prefix_match.py
      - name: Install Playwright Chromium
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Four-viewport browser and interaction QA
        run: python3 scripts/browser_qa.py --out reports/browser-qa
      - name: Upload screenshots and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa
          path: reports/
          if-no-files-found: ignore
      - name: Stage static Pages site
        run: |
          mkdir -p _site
          cp ./*.html _site/
          cp -R assets _site/assets
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://1998x-stack.github.io/SGLang-tutorial/
    steps:
      - uses: actions/checkout@v4
      - name: Detect Pages Actions publishing
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type' 2>/dev/null || true)
          if [ "$mode" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Pages Actions publishing not configured; skipping deployment (mode=$mode)"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/deploy-pages@v4
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/setup-python@v5
        if: steps.pages.outputs.enabled == 'true'
        with:
          python-version: "3.12"
      - name: Public site smoke check
        if: steps.pages.outputs.enabled == 'true'
        run: python3 scripts/verify_deployment.py --base-url 'https://1998x-stack.github.io/SGLang-tutorial/'
